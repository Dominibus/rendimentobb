<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title data-it="Report investimento B&B" data-en="B&B Investment Report">
Report investimento B&B
</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="/js/lang.js"></script>
<script type="module" src="/js/firebase-init.js"></script>

<style>

/* ===== BASE ===== */
body{
  font-family:system-ui;
  background:#f8fafc;
  margin:0;
  padding-top:80px;
  color:#0f172a;
}

/* ===== NAV ===== */
.report-nav{
  max-width:900px;
  margin:20px auto;
  display:flex;
  gap:10px;
  padding:0 20px;
}

/* ===== BUTTON NAV ===== */
.nav-btn{
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
  transition:all .2s ease;
}

.nav-btn.primary{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.nav-btn.secondary{
  background:#e2e8f0;
  color:#0f172a;
}

/* ===== CARD ===== */
.report{
  max-width:920px;
  margin:20px auto 60px auto;
  background:white;
  padding:40px;
  border-radius:24px;
  box-shadow:0 30px 100px rgba(2,6,23,0.12);
  position:relative;
  border:1px solid #e2e8f0;
}

/* ===== KPI ===== */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.kpi{
  background:#f8fafc;
  padding:18px;
  border-radius:14px;
}

/* ===== VERDICT ===== */
.verdict{
  margin-top:30px;
  padding:24px;
  border-radius:16px;
  background:linear-gradient(135deg,#10b981,#059669);
  color:white;
}

/* ===== BUTTON ===== */
.btn{
  margin-top:25px;
  background:#10b981;
  color:white;
  border:none;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  width:100%;
  font-weight:600;
}

/* ===== OVERLAY ===== */
.lock-overlay{
  position:absolute;
  inset:0;
  background:rgba(15,23,42,0.85);
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  border-radius:20px;
  z-index:10;
  text-align:center;
}

</style>

</head>

<body>

<!-- HEADER CORRETTO -->
<div id="global-header"></div>

<div class="report-nav">
  <a href="/dashboard/" class="nav-btn primary">← Dashboard</a>
  <a href="/" class="nav-btn secondary">Home</a>
</div>

<div class="report">

<h1>📄 Analisi investimento</h1>

<div class="kpi-grid">
  <div class="kpi"><span>Prezzo</span><strong id="price"></strong></div>
  <div class="kpi"><span>Equity</span><strong id="equity"></strong></div>
  <div class="kpi"><span>ROI</span><strong id="roi"></strong></div>
  <div class="kpi"><span>Rischio</span><strong id="risk"></strong></div>
</div>

<div class="verdict">
  <h2 id="verdict"></h2>
  <p id="verdict-text"></p>
</div>

<canvas id="roiChart" style="margin-top:30px;"></canvas>

<button class="btn" onclick="generatePDF()">📥 Scarica PDF</button>

<div id="upgradeOverlay" class="lock-overlay">
  <h2>🔒 Report PRO</h2>
  <button onclick="location.href='/pricing/'">🚀 Sblocca</button>
</div>

</div>

<!-- FOOTER CORRETTO -->
<div id="global-footer"></div>

<script type="module" src="/js/header.js"></script>
<script src="/js/footer.js" defer></script>

<script>

// PARAMS
const p = new URLSearchParams(location.search);

const price = Number(p.get("price")||0);
const roi = Number(p.get("roi")||0);
const equity = Number(p.get("equity")||0);
const risk = Number(p.get("risk")||0);

// FORMAT
const euro = v => new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(v);

// RENDER
priceEl = document.getElementById("price");
equityEl = document.getElementById("equity");
roiEl = document.getElementById("roi");
riskEl = document.getElementById("risk");

priceEl.innerText = euro(price);
equityEl.innerText = euro(equity);
roiEl.innerText = roi.toFixed(1)+"%";
riskEl.innerText = risk+"/100";

// VERDICT
let verdict = "HIGH RISK";
let text = "Investimento rischioso";

if(roi>=12){ verdict="AAA INVESTMENT"; text="Top investimento"; }
else if(roi>=8){ verdict="STRONG"; text="Ottimo investimento"; }

document.getElementById("verdict").innerText = verdict;
document.getElementById("verdict-text").innerText = text;

// CHART
new Chart(document.getElementById("roiChart"),{
  type:"bar",
  data:{
    labels:["ROI","Rischio","Benchmark"],
    datasets:[{data:[roi,risk,8],borderRadius:8}]
  },
  options:{plugins:{legend:{display:false}}}
});

// 🔥 USER PLAN (FIX DEFINITIVO)
function init(){

  const plan = window.currentPlan;

  if(!plan){
    setTimeout(init,300);
    return;
  }

  const isPro = (
    plan === "pro" ||
    plan === "pro_yearly"
  );

  if(!isPro){
    document.getElementById("upgradeOverlay").style.display="flex";
  }

}

// SYNC CON FIREBASE
document.addEventListener("rb_auth_ready", init);
setTimeout(init,600);

</script>

</body>
</html>
