<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report investimento B&B</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="/js/lang.js"></script>
<script type="module" src="/js/firebase-init.js"></script>

<style>

/* ================================
🔥 RENDIMENTOBB – FINTECH UI (PRO)
================================ */

/* ===== RESET ===== */
*{
  box-sizing:border-box;
}

/* ===== BASE ===== */
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  background:
    radial-gradient(circle at 20% 20%,rgba(16,185,129,0.06),transparent 40%),
    radial-gradient(circle at 80% 0%,rgba(59,130,246,0.06),transparent 40%),
    linear-gradient(180deg,#f8fafc,#eef2f7);

  margin:0;
  padding:0;

  color:#0f172a;
}

/* ===== CONTAINER ===== */
.page{
  width:100%;
  max-width:1000px;
  margin:120px auto 80px auto;
  padding:0 20px;
}

/* ===== NAV ===== */
.report-nav{
  display:flex;
  gap:10px;
  margin-bottom:30px;
}

/* ===== BUTTON NAV ===== */
.nav-btn{
  padding:10px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
  transition:all .25s ease;
}

.nav-btn.primary{
  background:#0f172a;
  color:white;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.nav-btn.primary:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.nav-btn.secondary{
  background:#e2e8f0;
  color:#0f172a;
}

.nav-btn.secondary:hover{
  background:#cbd5e1;
}

/* ===== REPORT CARD ===== */
.report{
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);

  padding:40px;
  border-radius:24px;

  box-shadow:
    0 15px 40px rgba(2,6,23,0.08),
    0 40px 120px rgba(2,6,23,0.10);

  border:1px solid rgba(255,255,255,0.6);

  position:relative;
}

/* ===== TITLE ===== */
h1{
  font-size:24px;
  font-weight:700;
  margin-bottom:5px;
}

/* ===== KPI GRID ===== */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-top:25px;
}

/* ===== KPI CARD ===== */
.kpi{
  background:linear-gradient(180deg,#ffffff,#f8fafc);
  padding:18px;
  border-radius:16px;

  border:1px solid #e2e8f0;

  transition:all .25s ease;
  position:relative;
  overflow:hidden;
}

.kpi::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.3),transparent);
  opacity:0;
  transition:.3s;
}

.kpi:hover{
  transform:translateY(-4px);
  box-shadow:0 20px 40px rgba(2,6,23,0.10);
}

.kpi:hover::after{
  opacity:1;
}

.kpi span{
  font-size:12px;
  color:#64748b;
}

.kpi strong{
  display:block;
  margin-top:6px;
  font-size:20px;
  font-weight:700;
}

/* ===== VERDICT (CORE VISUAL) ===== */
.verdict{
  margin-top:35px;
  padding:28px;
  border-radius:18px;

  background:linear-gradient(135deg,#059669,#10b981);

  color:white;

  box-shadow:
    0 15px 40px rgba(16,185,129,0.35),
    inset 0 1px 0 rgba(255,255,255,0.2);

  position:relative;
  overflow:hidden;
}

.verdict::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.2),transparent);
}

.verdict h2{
  font-size:20px;
  margin-bottom:6px;
}

.verdict p{
  opacity:.9;
  font-size:14px;
}

/* ===== CHART ===== */
.chart-box{
  margin-top:35px;
  padding:20px;
  border-radius:16px;

  background:#ffffff;
  border:1px solid #e2e8f0;

  box-shadow:0 10px 30px rgba(2,6,23,0.05);
}

/* ===== CTA BUTTON ===== */
.btn{
  margin-top:30px;

  background:linear-gradient(135deg,#10b981,#059669);
  color:white;

  border:none;
  padding:15px;

  border-radius:14px;

  cursor:pointer;
  width:100%;

  font-weight:600;
  font-size:14px;

  transition:all .25s ease;

  box-shadow:0 10px 25px rgba(16,185,129,0.25);
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 20px 40px rgba(16,185,129,0.40);
}

/* ===== OVERLAY PRO ===== */
.lock-overlay{
  position:absolute;
  inset:0;

  background:rgba(15,23,42,0.75);
  backdrop-filter:blur(14px);

  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  color:white;

  border-radius:24px;
  z-index:10;
  text-align:center;

  padding:30px;
}

.lock-overlay h2{
  font-size:22px;
  margin-bottom:10px;
}

.lock-overlay p{
  opacity:.85;
  font-size:14px;
  margin-bottom:20px;
}

.lock-overlay button{
  background:linear-gradient(135deg,#10b981,#059669);

  border:none;
  padding:13px 24px;

  border-radius:999px;
  color:white;

  font-weight:600;
  cursor:pointer;

  transition:all .25s ease;

  box-shadow:0 10px 25px rgba(16,185,129,0.3);
}

.lock-overlay button:hover{
  transform:translateY(-2px);
  box-shadow:0 20px 40px rgba(16,185,129,0.5);
}

/* ===== MOBILE ===== */
@media (max-width:768px){

  body{
    padding:30px 15px;
  }

  .report{
    padding:25px;
  }

  .kpi-grid{
    grid-template-columns:1fr;
  }

}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.02);}
  100%{transform:scale(1);}
}  

</style>

</head>

<body>

<!-- GLOBAL HEADER -->
<div id="global-header"></div>  

<div class="page">

<!-- NAV -->
<div class="report-nav"
style="justify-content:space-between;align-items:center;">
  
  <div style="display:flex;gap:10px;">
    <a href="/dashboard/" class="nav-btn primary"
       data-it="← Dashboard"
       data-en="← Dashboard">← Dashboard</a>

    <a href="/" class="nav-btn secondary"
       data-it="Home"
       data-en="Home">Home</a>
  </div>

  <div style="font-size:12px;color:#64748b;"
       data-it="Report professionale"
       data-en="Professional report">
    Report professionale
  </div>

</div>

<!-- REPORT -->
<div class="report">

<!-- HEADER REPORT -->
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
  <div>
    <div style="font-weight:700;font-size:18px;">RendimentoBB</div>
    <div style="font-size:12px;color:#64748b;"
         data-it="Investment Intelligence Report"
         data-en="Investment Intelligence Report">
      Investment Intelligence Report
    </div>
  </div>

  <div style="font-size:11px;background:#ecfdf5;color:#059669;padding:6px 10px;border-radius:999px;font-weight:600;">
    LIVE ANALYSIS
  </div>
</div>

<h1 
  data-it="📄 Analisi investimento"
  data-en="📄 Investment analysis">
📄 Analisi investimento
</h1>

<!-- KPI -->
<div class="kpi-grid">
  <div class="kpi">
    <span data-it="Prezzo" data-en="Price">Prezzo</span>
    <strong id="price"></strong>
  </div>

  <div class="kpi">
    <span data-it="Equity" data-en="Equity">Equity</span>
    <strong id="equity"></strong>
  </div>

  <div class="kpi">
    <span data-it="ROI" data-en="ROI">ROI</span>
    <strong id="roi"></strong>
  </div>

  <div class="kpi">
    <span data-it="Rischio" data-en="Risk">Rischio</span>
    <strong id="risk"></strong>
  </div>
</div>

<!-- VERDICT -->
<div class="verdict">
  <h2 id="verdict"></h2>
  <p id="verdict-text"></p>
</div>

<!-- CHART -->
<div class="chart-box">
  <canvas id="roiChart"></canvas>
</div>

<!-- CTA -->
<button class="btn" onclick="generatePDF()"
data-it="📥 Scarica report PDF professionale"
data-en="📥 Download professional PDF report">
📥 Scarica report PDF professionale
</button>

<!-- OVERLAY -->
<div id="upgradeOverlay" class="lock-overlay">
  <h2 data-it="🔒 Report PRO" data-en="🔒 PRO Report">🔒 Report PRO</h2>
  <p data-it="Accesso riservato a investitori e professionisti"
     data-en="Access reserved for investors and professionals">
     Accesso riservato a investitori e professionisti
  </p>
  <button onclick="startPlanPurchase('pro')"
    data-it="🚀 Sblocca PRO"
    data-en="🚀 Unlock PRO">
    🚀 Sblocca PRO
  </button>
</div>

</div>
</div>

<script>

// ================= PARAMS =================
const params = new URLSearchParams(window.location.search);

const price = Number(params.get("price") || 0);
const roi = Number(params.get("roi") || 0);
const equity = Number(params.get("equity") || 0);
const risk = Number(params.get("risk") || 0);

// ================= LANG =================
const lang = window.currentLang || "it";

// ================= USER =================
function checkUserPlan(){

  const plan = String(window.currentPlan || "").toLowerCase();

  isPro =
    plan === "pro" ||
    plan === "pro_yearly";

}

// ================= FORMAT =================
function euro(v){
  return new Intl.NumberFormat(
    lang === "en" ? "en-US" : "it-IT",
    {style:"currency",currency:"EUR"}
  ).format(v);
}

// ================= RENDER =================
function renderData(){
  document.getElementById("price").innerText = euro(price);
  document.getElementById("equity").innerText = euro(equity);
  document.getElementById("roi").innerText = roi.toFixed(1)+"%";
  document.getElementById("risk").innerText = risk+"/100";
}

// ================= VERDICT =================
function renderVerdict(){

  let verdict="", text="";

  if(roi >= 12){
    verdict = "AAA INVESTMENT";
    text = lang==="en"
      ? "Top-tier ROI. Institutional-grade opportunity."
      : "ROI elevato. Opportunità di livello istituzionale.";
  }
  else if(roi >= 8){
    verdict = lang==="en" ? "STRONG INVESTMENT" : "INVESTIMENTO FORTE";
    text = lang==="en"
      ? "High ROI with controlled risk."
      : "ROI elevato con rischio controllato.";
  }
  else if(roi >= 5){
    verdict = lang==="en" ? "OPTIMIZE" : "DA OTTIMIZZARE";
    text = lang==="en"
      ? "Good investment but needs optimization."
      : "Buon investimento ma da ottimizzare.";
  }
  else{
    verdict = lang==="en" ? "HIGH RISK" : "ALTO RISCHIO";
    text = lang==="en"
      ? "Low ROI or unstable fundamentals."
      : "ROI basso o fondamentali instabili.";
  }

  document.getElementById("verdict").innerText = verdict;
  document.getElementById("verdict-text").innerText = text;
}

// ================= CHART =================
let roiChartInstance = null;

function renderChart(){

  const canvas = document.getElementById("roiChart");

  if(roiChartInstance){
    roiChartInstance.destroy();
  }

  roiChartInstance = new Chart(canvas,{
    type:"bar",
    data:{
      labels: lang==="en"
        ? ["ROI","Risk","Benchmark"]
        : ["ROI","Rischio","Benchmark"],
      datasets:[{
        data:[roi, risk, 8],
        backgroundColor:["#10b981","#ef4444","#3b82f6"],
        borderRadius:10
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        y:{beginAtZero:true}
      }
    }
  });
}

// ================= LOCK =================
function applyLock(){

  const overlay = document.getElementById("upgradeOverlay");

  if(!isPro){

  overlay.style.display = "flex";

  // 🔥 pressione psicologica
  setTimeout(()=>{
    overlay.style.animation = "pulse 1.2s infinite";
  },500);

    const btn = document.querySelector(".btn");
    if(btn){
      btn.onclick = null;
      btn.style.opacity = "0.5";
    }

  } else {
    overlay.style.display = "none";
    renderAdvanced();
  }
}

// ================= ADVANCED =================
function renderAdvanced(){

  if(document.getElementById("advancedBox")) return;

  const box = document.createElement("div");
  box.id = "advancedBox";
  box.className = "verdict";

  let score = Math.min(100, Math.max(0, roi*5 - risk));
  const annualProfit = price * (roi/100);
  const breakEven = equity / annualProfit;

  box.innerHTML = `
    <h3>📊 Investment Score</h3>
    <div style="font-size:30px;font-weight:800">${score.toFixed(0)}/100</div>
    <div style="margin-top:10px;font-size:13px">
      ${lang==="en"?"Annual profit":"Profitto annuo"}: ${euro(annualProfit)}<br>
      ${lang==="en"?"Break-even":"Pareggio"}: ${breakEven.toFixed(1)} ${lang==="en"?"years":"anni"}
    </div>
  `;

  document.querySelector(".report").appendChild(box);
}

// ================= PDF – ULTRA PRO (BANK LEVEL) =================
async function generatePDF(){

  if(!isPro){
    document.getElementById("upgradeOverlay").style.display="flex";
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 20;

  const green = [16,185,129];
  const dark = [15,23,42];
  const gray = [100,116,139];

  // ================= HEADER =================
  doc.setFont("helvetica","bold");
  doc.setFontSize(20);
  doc.setTextColor(...dark);
  doc.text("RendimentoBB",20,y);

  doc.setFontSize(11);
  doc.setTextColor(...gray);
  doc.text("Investment Intelligence Report",20,y+8);

  y += 20;

  // ================= KPI =================
  doc.setFillColor(248,250,252);
  doc.roundedRect(20,y,170,60,6,6,"F");

  doc.setFontSize(11);
  doc.setTextColor(...dark);

  doc.text("Property price",25,y+12);
  doc.text(euro(price),120,y+12);

  doc.text("Equity invested",25,y+22);
  doc.text(euro(equity),120,y+22);

  doc.text("ROI",25,y+32);
  doc.text(roi.toFixed(1)+"%",120,y+32);

  doc.text("Risk score",25,y+42);
  doc.text(risk+"/100",120,y+42);

  y += 75;

  // ================= VERDICT =================
  doc.setFillColor(...green);
  doc.roundedRect(20,y,170,30,6,6,"F");

  doc.setTextColor(255,255,255);
  doc.setFontSize(16);
  doc.text(document.getElementById("verdict").innerText,25,y+15);

  y += 45;

  // ================= GRAFICO =================
  const chartCanvas = document.getElementById("roiChart");

  if(chartCanvas){
    const imgData = chartCanvas.toDataURL("image/png");
    doc.addImage(imgData,"PNG",20,y,170,70);
    y += 80;
  }

  // ================= SCORE =================
  let score = Math.min(100, Math.max(0, roi*5 - risk));
  const annualProfit = price * (roi/100);
  const breakEven = equity / annualProfit;

  doc.setTextColor(...dark);
  doc.setFontSize(14);
  doc.text("Investment Score",20,y);

  doc.setFontSize(28);
  doc.setTextColor(...green);
  doc.text(score.toFixed(0)+"/100",20,y+15);

  doc.setFontSize(10);
  doc.setTextColor(...gray);
  doc.text("Annual profit: "+euro(annualProfit),20,y+30);
  doc.text("Break-even: "+breakEven.toFixed(1)+" years",20,y+38);

  y += 50;

  // ================= MORTGAGE SIMULATION =================
  doc.setTextColor(...dark);
  doc.setFontSize(14);
  doc.text("Mortgage Simulation",20,y);

  const loan = price - equity;
  const rate = 0.04;
  const yearlyInterest = loan * rate;

  doc.setFontSize(10);
  doc.text("Loan amount: "+euro(loan),20,y+12);
  doc.text("Avg interest (4%): "+euro(yearlyInterest),20,y+20);
  doc.text("Net after financing: "+euro(annualProfit - yearlyInterest),20,y+28);

  y += 45;

  // ================= MARKET BENCHMARK =================
  doc.setFontSize(14);
  doc.text("Market Benchmark",20,y);

  doc.setFontSize(10);
  doc.setTextColor(...gray);

  doc.text("Average ROI market: 8%",20,y+12);
  doc.text("Your ROI: "+roi.toFixed(1)+"%",20,y+20);

  if(roi > 8){
    doc.setTextColor(...green);
    doc.text("✔ Above market performance",20,y+30);
  } else {
    doc.setTextColor(200,50,50);
    doc.text("⚠ Below market performance",20,y+30);
  }

  y += 45;

  // ================= RISK ANALYSIS =================
  doc.setTextColor(...dark);
  doc.setFontSize(14);
  doc.text("Risk Analysis",20,y);

  doc.setFontSize(10);
  doc.setTextColor(...gray);

  let riskLabel = "Medium";
  if(risk < 40) riskLabel = "Low";
  if(risk > 70) riskLabel = "High";

  doc.text("Risk score: "+risk+"/100 ("+riskLabel+")",20,y+12);

  y += 35;

  // ================= FOOTER =================
  doc.setDrawColor(220,220,220);
  doc.line(20,y,190,y);

  doc.setFontSize(8);
  doc.setTextColor(150,150,150);
  doc.text("Generated by RendimentoBB • Confidential Investment Report",20,y+8);

  // ================= SAVE =================
  doc.save("RendimentoBB-Pro-Report.pdf");
}
// ================= INIT =================
function init(){

  checkUserPlan();
  renderData();
  renderVerdict();
  renderChart();
  applyLock();

  if(typeof applyTranslations === "function"){
    applyTranslations();
  }
}

document.addEventListener("rb_auth_ready", init);
setTimeout(init,800);

</script>

<script src="/js/access-control.js"></script>  
<script src="/js/header.js"></script>
<script src="/js/footer.js"></script>
<!-- GLOBAL FOOTER -->
<div id="global-footer"></div>  
</body>
</html>
