<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title
data-it="Report investimento B&B"
data-en="B&B Investment Report">
Report investimento B&B
</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/lang.js"></script>
<script type="module" src="/js/firebase-init.js"></script>

<style>

/* ===== BASE ===== */
body{
  font-family: system-ui;
  background:#f8fafc;
  margin:0; /* 🔥 CRITICO */
  color:#0f172a;
}

/* ===== NAV ===== */
.report-nav{
  max-width:900px;
  margin:0 auto 20px auto;
  display:flex;
  gap:10px;
}

.nav-btn{
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
}

.nav-btn.primary{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.nav-btn.secondary{
  background:#e2e8f0;
  color:#0f172a;
}

/* ===== CARD ===== */
.report{
  max-width:920px;
  margin:40px auto;
  background:white;
  padding:40px;
  border-radius:24px;
  box-shadow:0 30px 100px rgba(2,6,23,0.12);
  position:relative;
  border:1px solid #e2e8f0;
}

h1{
  font-size:26px;
  margin-bottom:10px;
}
  
/* ===== KPI ===== */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.kpi{
  background:#f8fafc;
  padding:18px;
  border-radius:14px;
}

/* ===== VERDICT ===== */
.verdict{
  margin-top:30px;
  padding:24px;
  border-radius:16px;
  background:linear-gradient(135deg,#10b981,#059669);
  color:white;
}

/* ===== CHART ===== */
.chart-box{
  margin-top:30px;
}

/* ===== BUTTON ===== */
.btn{
  margin-top:25px;
  background:#10b981;
  color:white;
  border:none;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  width:100%;
  font-weight:600;
}

/* ===== OVERLAY PRO ===== */
.lock-overlay{
  position:absolute;
  inset:0;
  background:rgba(15,23,42,0.85);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  border-radius:20px;
  z-index:10;
  text-align:center;
}

.lock-overlay button{
  margin-top:15px;
  background:#10b981;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  color:white;
  font-weight:600;
}

</style>

</head>

<body>

<div id="global-header"></div>  

<script>
setTimeout(() => {
  if(!document.querySelector("#global-header").innerHTML){
    console.warn("⚠️ Header non caricato");
  }
},1000);
</script>  

<div class="report-nav">
  <a href="/dashboard/" class="nav-btn primary"
     data-it="← Dashboard"
     data-en="← Dashboard">← Dashboard</a>

  <a href="/" class="nav-btn secondary"
     data-it="Home"
     data-en="Home">Home</a>
</div>

<div class="report">

<div class="header">
  <div class="logo">RendimentoBB</div>
  <div 
    data-it="Report professionale"
    data-en="Professional report">
    Professional report
  </div>
</div>

<h1 
  data-it="📄 Analisi investimento"
  data-en="📄 Investment analysis">
📄 Analisi investimento
</h1>

<div style="font-size:14px;color:#64748b;margin-bottom:20px"
     data-it="Analisi basata su dati reali di mercato"
     data-en="Analysis based on real market data">
Analisi basata su dati reali di mercato
</div>

<div class="kpi-grid">
  <div class="kpi">
    <span data-it="Prezzo" data-en="Price">Prezzo</span>
    <strong id="price"></strong>
  </div>

  <div class="kpi">
    <span data-it="Equity" data-en="Equity">Equity</span>
    <strong id="equity"></strong>
  </div>

  <div class="kpi">
    <span data-it="ROI" data-en="ROI">ROI</span>
    <strong id="roi"></strong>
  </div>

  <div class="kpi">
    <span data-it="Rischio" data-en="Risk">Rischio</span>
    <strong id="risk"></strong>
  </div>
</div>

<div class="verdict">
  <h2 id="verdict"></h2>
  <p id="verdict-text"></p>
</div>

<div class="chart-box">
  <canvas id="roiChart"></canvas>
</div>

<button class="btn" onclick="generatePDF()"
data-it="📥 Scarica PDF professionale"
data-en="📥 Download professional PDF">
📥 Scarica PDF professionale
</button>

<!-- OVERLAY -->
<div id="upgradeOverlay" class="lock-overlay" style="display:none">
  <h2 
    data-it="🔒 Report PRO"
    data-en="🔒 PRO Report">
    🔒 Report PRO
  </h2>

  <p style="opacity:.8"
     data-it="Questo report è usato da investitori e immobiliari"
     data-en="This report is used by investors and real estate professionals">
    Questo report è usato da investitori e immobiliari
  </p>

  <button onclick="window.location.href='/pricing/'"
    data-it="🚀 Sblocca PRO"
    data-en="🚀 Unlock PRO">
    🚀 Sblocca PRO
  </button>
</div>

</div>

<script>

// ================= PARAMS =================
const params = new URLSearchParams(window.location.search);

const price = Number(params.get("price") || 0);
const roi = Number(params.get("roi") || 0);
const equity = Number(params.get("equity") || 0);
const risk = Number(params.get("risk") || 0);

// ================= LANG =================
const lang = window.currentLang || "it";

// ================= USER =================
let isPro = false;

function checkUserPlan(){

  const plan = window.currentPlan;

  // 🔥 aspetta davvero firebase
  if(!plan){
    console.log("⏳ Piano non ancora pronto...");
    return false;
  }

  console.log("🔥 Piano rilevato:", plan);

  isPro = (
    plan === "pro" ||
    plan === "pro_yearly" 
  );

  return true;
}

// ================= FORMAT =================
function euro(v){
  return new Intl.NumberFormat(lang === "en" ? "en-US" : "it-IT",{
    style:"currency",
    currency:"EUR"
  }).format(v);
}

// ================= RENDER =================
document.getElementById("price").innerText = euro(price);
document.getElementById("equity").innerText = euro(equity);
document.getElementById("roi").innerText = roi.toFixed(1)+"%";
document.getElementById("risk").innerText = risk+"/100";

// ================= VERDICT =================
let verdict="",text="";

if(roi >= 12){
  verdict = "AAA INVESTMENT";
  text = lang === "en"
    ? "Top-tier ROI. Institutional-grade opportunity."
    : "ROI elevato. Opportunità di livello istituzionale.";
}
else if(roi >= 8){
  verdict = lang === "en" ? "STRONG INVESTMENT" : "INVESTIMENTO FORTE";
  text = lang === "en"
    ? "High ROI with controlled risk."
    : "ROI elevato con rischio controllato.";
}
else if(roi >= 5){
  verdict = lang === "en" ? "OPTIMIZE" : "DA OTTIMIZZARE";
  text = lang === "en"
    ? "Good investment but needs optimization."
    : "Buon investimento ma da ottimizzare.";
}
else{
  verdict = lang === "en" ? "HIGH RISK" : "ALTO RISCHIO";
  text = lang === "en"
    ? "Low ROI or unstable fundamentals."
    : "ROI basso o fondamentali instabili.";
}

document.getElementById("verdict").innerText = verdict;
document.getElementById("verdict-text").innerText = text;

// ================= CHART =================
let roiChartInstance = null;

function renderChart(){

  const canvas = document.getElementById("roiChart");
  if(!canvas) return;

  if(roiChartInstance){
    roiChartInstance.destroy();
  }

  roiChartInstance = new Chart(canvas,{
    type:"bar",
    data:{
      labels: lang === "en"
        ? ["ROI","Risk","Benchmark"]
        : ["ROI","Rischio","Benchmark"],
      datasets:[{
        data:[roi, risk, 8],
        borderRadius:8
      }]
    },
    options:{
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:"#0f172a",
          titleColor:"#fff",
          bodyColor:"#fff"
        }
      },
      scales:{
        y:{beginAtZero:true,grid:{color:"#e2e8f0"}},
        x:{grid:{display:false}}
      }
    }
  });
}

// ================= LOCK =================
function applyLock(){

  const overlay = document.getElementById("upgradeOverlay");

  if(!isPro){
    overlay.style.display = "flex";

    const btn = document.querySelector(".btn");
    if(btn){
      btn.onclick = null;
      btn.style.opacity = "0.5";
      btn.style.cursor = "not-allowed";
    }

  } else {
    overlay.style.display = "none";
  }
}

// ================= PDF =================
async function generatePDF(){

  if(!isPro){
    document.getElementById("upgradeOverlay").style.display="flex";
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 20;

  doc.setFont("helvetica","bold");
  doc.setFontSize(22);
  doc.text("RendimentoBB",20,y);

  doc.setFontSize(11);
  doc.text(
    lang === "en"
      ? "Investment Intelligence Report"
      : "Report Intelligenza Investimento",
    20,y+8
  );

  y += 20;

  doc.setFontSize(11);

  doc.text((lang==="en"?"Price":"Prezzo")+": "+euro(price),20,y); y+=8;
  doc.text("Equity: "+euro(equity),20,y); y+=8;
  doc.text("ROI: "+roi.toFixed(1)+"%",20,y); y+=8;
  doc.text((lang==="en"?"Risk":"Rischio")+": "+risk,20,y);

  y += 15;

  let score = Math.min(100, Math.max(0, roi*5 - risk));

  doc.setFontSize(16);
  doc.text((lang==="en"?"Score":"Punteggio")+": "+score.toFixed(0)+"/100",20,y);

  doc.save("RendimentoBB-Report.pdf");
}

// ================= INIT =================
function initReport(){

  const ready = checkUserPlan();

  if(!ready){
    // 🔥 retry intelligente
    setTimeout(initReport, 300);
    return;
  }

  applyLock();
  renderChart();

}

// 🔥 avvio reale
document.addEventListener("rb_auth_ready", initReport);

// fallback
setTimeout(initReport, 500);

</script>

<div id="footer"></div>

<script type="module" src="/js/header.js"></script>
<script src="/js/footer.js" defer></script>
<script>
document.addEventListener("rb_language_changed", () => {
  if(typeof applyTranslations === "function"){
    applyTranslations();
  }
});
</script>  

</body>
</html>
