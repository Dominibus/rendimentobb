<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title
data-it="Report investimento B&B"
data-en="B&B Investment Report">
Report investimento B&B
</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/lang.js"></script>
<script type="module" src="/js/firebase-init.js"></script>

<style>

/* ===== BASE ===== */
body{
  font-family: system-ui;
  background:#f8fafc;
  padding:30px;
  color:#0f172a;
}

/* ===== NAV ===== */
.report-nav{
  max-width:900px;
  margin:0 auto 20px auto;
  display:flex;
  gap:10px;
}

.nav-btn{
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
}

.nav-btn.primary{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.nav-btn.secondary{
  background:#e2e8f0;
  color:#0f172a;
}

/* ===== CARD ===== */
.report{
  max-width:900px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 25px 80px rgba(0,0,0,0.1);
  position:relative;
}

/* ===== KPI ===== */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.kpi{
  background:#f1f5f9;
  padding:16px;
  border-radius:12px;
}

/* ===== VERDICT ===== */
.verdict{
  margin-top:30px;
  padding:20px;
  border-radius:14px;
  background:#ecfdf5;
}

/* ===== CHART ===== */
.chart-box{
  margin-top:30px;
}

/* ===== BUTTON ===== */
.btn{
  margin-top:25px;
  background:#10b981;
  color:white;
  border:none;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  width:100%;
  font-weight:600;
}

/* ===== OVERLAY PRO ===== */
.lock-overlay{
  position:absolute;
  inset:0;
  background:rgba(15,23,42,0.85);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  border-radius:20px;
  z-index:10;
  text-align:center;
}

.lock-overlay button{
  margin-top:15px;
  background:#10b981;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  color:white;
  font-weight:600;
}

</style>

</head>

<body>

<div class="report-nav">
  <a href="/dashboard/" class="nav-btn primary">← Dashboard</a>
  <a href="/" class="nav-btn secondary">Home</a>
</div>

<div class="report">

<div class="header">
  <div class="logo">RendimentoBB</div>
  <div>Professional report</div>
</div>

<h1>📄 Analisi investimento</h1>

<div class="kpi-grid">
  <div class="kpi"><span>Prezzo</span><strong id="price"></strong></div>
  <div class="kpi"><span>Equity</span><strong id="equity"></strong></div>
  <div class="kpi"><span>ROI</span><strong id="roi"></strong></div>
  <div class="kpi"><span>Rischio</span><strong id="risk"></strong></div>
</div>

<div class="verdict">
  <h2 id="verdict"></h2>
  <p id="verdict-text"></p>
</div>

<div class="chart-box">
  <canvas id="roiChart"></canvas>
</div>

<button class="btn" onclick="generatePDF()">
📥 Scarica PDF professionale
</button>

<!-- OVERLAY -->
<div id="upgradeOverlay" class="lock-overlay" style="display:none">
  <h2>🔒 Report PRO</h2>
  <p style="opacity:.8">
    Questo report è usato da investitori e immobiliari
  </p>
  <button onclick="window.location.href='/pricing/'">
    🚀 Sblocca PRO
  </button>
</div>

</div>

<script>

// ================= PARAMS =================
const params = new URLSearchParams(window.location.search);

const price = Number(params.get("price") || 0);
const roi = Number(params.get("roi") || 0);
const equity = Number(params.get("equity") || 0);
const risk = Number(params.get("risk") || 0);

// ================= USER =================
let isPro = false;

function checkUserPlan(){

  const plan = window.currentPlan || "free";

  // 🔥 SOLO PRO SBLOCCA
  if(plan === "pro" || plan === "pro_yearly"){
    isPro = true;
  }

  // sicurezza extra
  if(window.isProUser && window.isProUser()){
    isPro = true;
  }

  console.log("PLAN:", plan, "isPro:", isPro);
}

// ================= FORMAT =================
function euro(v){
  return new Intl.NumberFormat("it-IT",{
    style:"currency",
    currency:"EUR"
  }).format(v);
}

// ================= RENDER BASE =================
document.getElementById("price").innerText = euro(price);
document.getElementById("equity").innerText = euro(equity);
document.getElementById("roi").innerText = roi.toFixed(1)+"%";
document.getElementById("risk").innerText = risk+"/100";

// ================= VERDICT =================
let verdict="",text="";

if(roi >= 12){
  verdict = "AAA INVESTMENT";
  text = "Top-tier ROI. Institutional-grade opportunity.";
}
else if(roi >= 8){
  verdict = "STRONG INVESTMENT";
  text = "High ROI with controlled risk.";
}
else if(roi >= 5){
  verdict = "OPTIMIZE";
  text = "Good investment but needs optimization.";
}
else{
  verdict = "HIGH RISK";
  text = "Low ROI or unstable fundamentals.";
}

document.getElementById("verdict").innerText = verdict;
document.getElementById("verdict-text").innerText = text;

// ================= CHART =================
let roiChartInstance = null;

function renderChart(){

  const canvas = document.getElementById("roiChart");
  if(!canvas) return;

  if(roiChartInstance){
    roiChartInstance.destroy();
  }

  roiChartInstance = new Chart(canvas,{
    type:"bar",
    data:{
      labels:["ROI","Rischio","Benchmark"],
      datasets:[{
        data:[roi, risk, 8],
        borderRadius:8
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true}}
    }
  });
}

// ================= LOCK UI =================
function applyLock(){

  const overlay = document.getElementById("upgradeOverlay");
  const btn = document.querySelector(".btn");

  if(!isPro){

    // 🔥 BLOCCO VISIVO
    overlay.style.display = "flex";

    // 🔥 DISABILITA PDF
    if(btn){
      btn.style.opacity = "0.5";
      btn.style.cursor = "not-allowed";
    }

    // 🔥 CREA TEASER PRO (se non esiste)
    if(!document.getElementById("proTeaser")){
      
      const teaser = document.createElement("div");
      teaser.id = "proTeaser";
      teaser.style.marginTop = "25px";
      teaser.style.padding = "20px";
      teaser.style.borderRadius = "12px";
      teaser.style.background = "#fff7ed";
      teaser.style.textAlign = "center";
      teaser.innerHTML = `
        <strong>🔒 Analisi avanzata PRO</strong><br>
        <span style="font-size:13px;opacity:.7">
        Score investimento, confronto mercato e strategia completa disponibili solo in PRO
        </span>
      `;

      document.querySelector(".report").appendChild(teaser);
    }

  } else {

    overlay.style.display = "none";

    // 🔥 SBLOCCA DATI AVANZATI
    renderAdvanced();
  }
}

// ================= ADVANCED PRO =================
function renderAdvanced(){

  if(document.getElementById("advancedBox")) return;

  const box = document.createElement("div");
  box.id = "advancedBox";
  box.className = "verdict";
  box.style.marginTop = "25px";

  let score = Math.min(100, Math.max(0, roi*5 - risk));
  const annualProfit = price * (roi/100);
  const breakEven = equity / annualProfit;

  box.innerHTML = `
    <h3>📊 Investment Score</h3>
    <div style="font-size:28px;font-weight:700">${score.toFixed(0)}/100</div>

    <div style="margin-top:15px;font-size:13px">
      Annual profit: ${euro(annualProfit)}<br>
      Break-even: ${breakEven.toFixed(1)} years
    </div>
  `;

  document.querySelector(".report").appendChild(box);
}

// ================= PDF =================
async function generatePDF(){

  // 🔒 BLOCCO ASSOLUTO
  if(!isPro){
    document.getElementById("upgradeOverlay").style.display="flex";
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 20;

  doc.setFont("helvetica","bold");
  doc.setFontSize(20);
  doc.text("RendimentoBB",20,y);

  doc.setFontSize(12);
  doc.text("Investment Intelligence Report",20,y+8);

  y += 20;

  doc.text("ROI: " + roi.toFixed(1)+"%",20,y);
  doc.text("Risk: " + risk,20,y+10);

  y += 30;

  let score = Math.min(100, Math.max(0, roi*5 - risk));
  doc.setFontSize(18);
  doc.text("Score: " + score.toFixed(0)+"/100",20,y);

  doc.save("RendimentoBB-Pro-Report.pdf");
}

// ================= INIT =================
document.addEventListener("rb_auth_ready", () => {
  checkUserPlan();
  applyLock();
  renderChart();
});

setTimeout(()=>{
  checkUserPlan();
  applyLock();
  renderChart();
},800);

</script>
</body>
</html>
