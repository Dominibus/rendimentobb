<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report investimento B&B</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="/js/lang.js"></script>
<script type="module" src="/js/firebase-init.js"></script>

<style>

/* ===== BASE ===== */
body{
  font-family: system-ui;
  background:#f8fafc;
  margin:0;
  padding:40px 20px;
  display:flex;
  justify-content:center;
  color:#0f172a;
}

/* ===== CONTAINER ===== */
.page{
  width:100%;
  max-width:920px;
}

/* ===== NAV ===== */
.report-nav{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

/* ===== BUTTON NAV ===== */
.nav-btn{
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
}

.nav-btn.primary{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.nav-btn.secondary{
  background:#e2e8f0;
  color:#0f172a;
}

/* ===== CARD ===== */
.report{
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 25px 80px rgba(0,0,0,0.1);
  position:relative;
}

/* ===== KPI ===== */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.kpi{
  background:#f1f5f9;
  padding:16px;
  border-radius:12px;
}

.kpi span{
  font-size:12px;
  color:#64748b;
}

.kpi strong{
  display:block;
  margin-top:5px;
  font-size:16px;
}

/* ===== VERDICT ===== */
.verdict{
  margin-top:30px;
  padding:20px;
  border-radius:14px;
  background:linear-gradient(135deg,#10b981,#059669);
  color:white;
}

/* ===== CHART ===== */
.chart-box{
  margin-top:30px;
}

/* ===== BUTTON ===== */
.btn{
  margin-top:25px;
  background:#10b981;
  color:white;
  border:none;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  width:100%;
  font-weight:600;
}

/* ===== OVERLAY ===== */
.lock-overlay{
  position:absolute;
  inset:0;
  background:rgba(15,23,42,0.85);
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  border-radius:20px;
  z-index:10;
  text-align:center;
}

/* ===== MOBILE ===== */
@media (max-width:768px){
  .kpi-grid{
    grid-template-columns:1fr;
  }
}

</style>

</head>

<body>

<div class="page">

<div class="report-nav">
  <a href="/dashboard/" class="nav-btn primary">← Dashboard</a>
  <a href="/" class="nav-btn secondary">Home</a>
</div>

<div class="report">

<h1>📄 Analisi investimento</h1>

<div class="kpi-grid">
  <div class="kpi"><span>Prezzo</span><strong id="price"></strong></div>
  <div class="kpi"><span>Equity</span><strong id="equity"></strong></div>
  <div class="kpi"><span>ROI</span><strong id="roi"></strong></div>
  <div class="kpi"><span>Rischio</span><strong id="risk"></strong></div>
</div>

<div class="verdict">
  <h2 id="verdict"></h2>
  <p id="verdict-text"></p>
</div>

<div class="chart-box">
  <canvas id="roiChart"></canvas>
</div>

<button class="btn" onclick="generatePDF()">📥 Scarica PDF</button>

<!-- OVERLAY -->
<div id="upgradeOverlay" class="lock-overlay">
  <h2>🔒 Report PRO</h2>
  <p>Accesso riservato ai piani PRO</p>
  <button onclick="window.location.href='/pricing/'">🚀 Sblocca</button>
</div>

</div>

</div>

<script>

// ================= PARAMS =================
const params = new URLSearchParams(window.location.search);

const price = Number(params.get("price") || 0);
const roi = Number(params.get("roi") || 0);
const equity = Number(params.get("equity") || 0);
const risk = Number(params.get("risk") || 0);

// ================= USER =================
let isPro = false;

function checkUserPlan(){
  const plan = window.currentPlan || "free";

  isPro = (plan === "pro" || plan === "pro_yearly");

  console.log("PLAN:", plan, "| isPro:", isPro);
}

// ================= FORMAT =================
function euro(v){
  return new Intl.NumberFormat("it-IT",{
    style:"currency",
    currency:"EUR"
  }).format(v);
}

// ================= RENDER =================
document.getElementById("price").innerText = euro(price);
document.getElementById("equity").innerText = euro(equity);
document.getElementById("roi").innerText = roi.toFixed(1)+"%";
document.getElementById("risk").innerText = risk+"/100";

// ================= VERDICT =================
let verdict="",text="";

if(roi >= 12){
  verdict = "AAA INVESTMENT";
  text = "Top-tier ROI. Institutional-grade opportunity.";
}
else if(roi >= 8){
  verdict = "STRONG INVESTMENT";
  text = "High ROI with controlled risk.";
}
else if(roi >= 5){
  verdict = "OPTIMIZE";
  text = "Good investment but needs optimization.";
}
else{
  verdict = "HIGH RISK";
  text = "Low ROI or unstable fundamentals.";
}

document.getElementById("verdict").innerText = verdict;
document.getElementById("verdict-text").innerText = text;

// ================= CHART =================
let roiChartInstance = null;

function renderChart(){

  const canvas = document.getElementById("roiChart");

  if(roiChartInstance){
    roiChartInstance.destroy();
  }

  roiChartInstance = new Chart(canvas,{
    type:"bar",
    data:{
      labels:["ROI %","Risk","Benchmark"],
      datasets:[{
        data:[roi, risk, 8],
        backgroundColor:["#10b981","#ef4444","#3b82f6"],
        borderRadius:8
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true}}
    }
  });
}

// ================= LOCK =================
function applyLock(){

  const overlay = document.getElementById("upgradeOverlay");

  if(!isPro){
    overlay.style.display = "flex";

    const btn = document.querySelector(".btn");
    if(btn){
      btn.onclick = null;
      btn.style.opacity = "0.5";
    }
  } else {
    overlay.style.display = "none";
    renderAdvanced();
  }
}

// ================= ADVANCED =================
function renderAdvanced(){

  if(document.getElementById("advancedBox")) return;

  const box = document.createElement("div");

  box.id = "advancedBox";
  box.className = "verdict";

  let score = Math.min(100, Math.max(0, roi*5 - risk));
  const annualProfit = price * (roi/100);
  const breakEven = equity / annualProfit;

  box.innerHTML = `
    <h3>📊 Investment Score</h3>
    <div style="font-size:28px;font-weight:700">${score.toFixed(0)}/100</div>
    <div style="margin-top:15px;font-size:13px">
      Annual profit: ${euro(annualProfit)}<br>
      Break-even: ${breakEven.toFixed(1)} years
    </div>
  `;

  document.querySelector(".report").appendChild(box);
}

// ================= PDF =================
async function generatePDF(){

  if(!isPro){
    document.getElementById("upgradeOverlay").style.display="flex";
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.text("RendimentoBB Report",20,20);
  doc.text("Prezzo: "+euro(price),20,40);
  doc.text("ROI: "+roi.toFixed(1)+"%",20,50);

  doc.save("report.pdf");
}

// ================= INIT =================
document.addEventListener("rb_auth_ready", () => {
  checkUserPlan();
  applyLock();
  renderChart();
});

setTimeout(()=>{
  checkUserPlan();
  applyLock();
  renderChart();
},800);

</script>

</body>
</html>
