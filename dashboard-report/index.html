<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<div style="margin-bottom:20px;display:flex;gap:10px">

<a href="/dashboard/" style="
background:#0f172a;
color:white;
padding:8px 14px;
border-radius:8px;
text-decoration:none;
font-size:13px;
">
← Dashboard
</a>

<a href="/" style="
background:#e2e8f0;
color:#0f172a;
padding:8px 14px;
border-radius:8px;
text-decoration:none;
font-size:13px;
">
Home
</a>

</div>  

<title
data-it="Report investimento B&B"
data-en="B&B Investment Report">
Report investimento B&B
</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/js/lang.js"></script>

<style>

body{
  font-family: system-ui;
  background:#f8fafc;
  padding:30px;
}

.report{
  max-width:900px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 25px 80px rgba(0,0,0,0.1);
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logo{
  font-weight:700;
  color:#10b981;
}

/* KPI GRID */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.kpi{
  background:#f8fafc;
  padding:16px;
  border-radius:12px;
}

.kpi span{
  font-size:12px;
  color:#64748b;
}

.kpi strong{
  display:block;
  font-size:20px;
  margin-top:4px;
}

/* VERDICT */
.verdict{
  margin-top:30px;
  padding:20px;
  border-radius:14px;
  background:rgba(16,185,129,0.08);
}

.verdict h2{
  margin:0;
  font-size:24px;
  color:#10b981;
}

.verdict p{
  margin-top:10px;
  color:#475569;
}

/* SECTION */
.section{
  margin-top:30px;
}

.section h3{
  margin-bottom:10px;
}

/* BUTTON */
.btn{
  margin-top:25px;
  background:#10b981;
  color:white;
  border:none;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  width:100%;
  font-weight:600;
}

</style>

</head>

<body>

<div class="report">

<!-- HEADER -->
<div class="header">
  <div class="logo">RendimentoBB</div>
  <div data-it="Report professionale" data-en="Professional report">
    Report professionale
  </div>
</div>

<h1
data-it="📄 Analisi investimento"
data-en="📄 Investment Analysis">
📄 Analisi investimento
</h1>

<!-- KPI -->
<div class="kpi-grid">

<div class="kpi">
  <span data-it="Prezzo immobile" data-en="Property price"></span>
  <strong id="price"></strong>
</div>

<div class="kpi">
  <span data-it="Equity investita" data-en="Equity invested"></span>
  <strong id="equity"></strong>
</div>

<div class="kpi">
  <span>ROI</span>
  <strong id="roi"></strong>
</div>

<div class="kpi">
  <span data-it="Rischio" data-en="Risk"></span>
  <strong id="risk"></strong>
</div>

</div>

<!-- VERDICT -->
<div class="verdict">
  <h2 id="verdict"></h2>
  <p id="verdict-text"></p>
</div>

<!-- STRATEGY -->
<div class="section">
  <h3 data-it="Strategia consigliata" data-en="Recommended strategy"></h3>
  <p id="strategy"></p>
</div>

<button class="btn" onclick="generatePDF()"
data-it="📥 Scarica PDF professionale"
data-en="📥 Download professional PDF">
📥 Scarica PDF professionale
</button>

</div>

<script>

// ================= PARAMS =================

const params = new URLSearchParams(window.location.search);

const price = Number(params.get("price") || 0);
const roi = Number(params.get("roi") || 0);
const equity = Number(params.get("equity") || 0);
const risk = Number(params.get("risk") || 0);

// ================= FORMAT =================

function euro(v){
  return new Intl.NumberFormat(
    window.currentLang === "en" ? "en-US" : "it-IT",
    {style:"currency", currency:"EUR"}
  ).format(v);
}

// ================= RENDER =================

document.getElementById("price").innerText = euro(price);
document.getElementById("equity").innerText = euro(equity);
document.getElementById("roi").innerText = roi.toFixed(1) + "%";
document.getElementById("risk").innerText = risk + "/100";

// ================= VERDICT =================

let verdict = "";
let text = "";
let strategy = "";

if(roi >= 10){
  verdict = t("✅ INVESTIMENTO FORTE","✅ STRONG INVESTMENT");
  text = t(
    "ROI elevato e rischio controllato.",
    "High ROI and controlled risk."
  );
  strategy = t(
    "Procedere con l'investimento.",
    "Proceed with investment."
  );
}
else if(roi >= 5){
  verdict = t("⚙️ OTTIMIZZARE","⚙️ OPTIMIZE");
  text = t(
    "Buon investimento ma migliorabile.",
    "Good investment but improvable."
  );
  strategy = t(
    "Ottimizzare prezzo e occupazione.",
    "Optimize pricing and occupancy."
  );
}
else{
  verdict = t("❌ EVITARE","❌ AVOID");
  text = t(
    "ROI basso o rischio elevato.",
    "Low ROI or high risk."
  );
  strategy = t(
    "Rivalutare completamente l'investimento.",
    "Re-evaluate investment."
  );
}

document.getElementById("verdict").innerText = verdict;
document.getElementById("verdict-text").innerText = text;
document.getElementById("strategy").innerText = strategy;

// ================= PDF =================

async function generatePDF(){

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 20;

  const green = [16,185,129];
  const dark = [15,23,42];
  const gray = [100,116,139];

  // ================= HEADER =================
  doc.setFontSize(18);
  doc.setTextColor(...dark);
  doc.text("RendimentoBB – Investment Report", 20, y);

  y += 8;

  doc.setFontSize(10);
  doc.setTextColor(...gray);
  doc.text("Professional B&B investment analysis", 20, y);

  y += 15;

  // ================= KPI BOX =================
  doc.setFillColor(248,250,252);
  doc.roundedRect(20, y, 170, 45, 4, 4, "F");

  doc.setFontSize(11);
  doc.setTextColor(...dark);

  doc.text("Property price", 25, y+10);
  doc.text(euro(price), 120, y+10);

  doc.text("Equity", 25, y+18);
  doc.text(euro(equity), 120, y+18);

  doc.text("ROI", 25, y+26);
  doc.text(roi.toFixed(1)+"%", 120, y+26);

  doc.text("Risk", 25, y+34);
  doc.text(risk+"/100", 120, y+34);

  y += 60;

  // ================= VERDICT =================
  let verdictTitle = "";
  let verdictColor = green;
  let verdictText = "";

  if(roi >= 10){
    verdictTitle = "STRONG INVESTMENT";
    verdictText = "High ROI and controlled risk. Excellent candidate.";
  } else if(roi >= 5){
    verdictTitle = "OPTIMIZE";
    verdictColor = [245,158,11];
    verdictText = "Good opportunity but requires optimization.";
  } else{
    verdictTitle = "HIGH RISK";
    verdictColor = [239,68,68];
    verdictText = "Low ROI or high risk.";
  }

  doc.setFillColor(...verdictColor, 0.1);
  doc.roundedRect(20, y, 170, 35, 4, 4, "F");

  doc.setTextColor(...verdictColor);
  doc.setFontSize(16);
  doc.text(verdictTitle, 25, y+12);

  doc.setFontSize(11);
  doc.setTextColor(...dark);
  doc.text(verdictText, 25, y+22);

  y += 50;

  // ================= STRATEGY =================
  doc.setFontSize(14);
  doc.setTextColor(...dark);
  doc.text("Strategic Recommendation", 20, y);

  y += 10;

  doc.setFontSize(11);

  let strategy = "";

  if(roi >= 10){
    strategy = "Proceed with investment. Strong fundamentals.";
  } else if(roi >= 5){
    strategy = "Optimize pricing and occupancy.";
  } else{
    strategy = "Re-evaluate investment conditions.";
  }

  doc.text(strategy, 20, y);

  y += 20;

  // ================= ANALYSIS =================
  doc.setFontSize(14);
  doc.text("Analysis Breakdown", 20, y);

  y += 10;

  doc.setFontSize(11);

  doc.text("• ROI vs market benchmark", 20, y);
  y += 7;
  doc.text("• Risk evaluation", 20, y);
  y += 7;
  doc.text("• Investment sustainability", 20, y);

  y += 20;

  // ================= FOOTER =================
  doc.setFontSize(9);
  doc.setTextColor(...gray);
  doc.text("Generated by RendimentoBB.com", 20, 285);

  doc.save("RendimentoBB-Investment-Report.pdf");
}

</script>

</body>
</html>
