<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title
data-it="Report investimento B&B"
data-en="B&B Investment Report">
Report investimento B&B
</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/lang.js"></script>
<script type="module" src="/js/firebase-init.js"></script>

<style>

/* ===== BASE ===== */
body{
  font-family: system-ui;
  background:#f8fafc;
  padding:30px;
  color:#0f172a;
}

/* ===== NAV ===== */
.report-nav{
  max-width:900px;
  margin:0 auto 20px auto;
  display:flex;
  gap:10px;
}

.nav-btn{
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
}

.nav-btn.primary{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.nav-btn.secondary{
  background:#e2e8f0;
  color:#0f172a;
}

/* ===== CARD ===== */
.report{
  max-width:900px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 25px 80px rgba(0,0,0,0.1);
  position:relative;
}

/* ===== KPI ===== */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.kpi{
  background:#f1f5f9;
  padding:16px;
  border-radius:12px;
}

/* ===== VERDICT ===== */
.verdict{
  margin-top:30px;
  padding:20px;
  border-radius:14px;
  background:#ecfdf5;
}

/* ===== CHART ===== */
.chart-box{
  margin-top:30px;
}

/* ===== BUTTON ===== */
.btn{
  margin-top:25px;
  background:#10b981;
  color:white;
  border:none;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  width:100%;
  font-weight:600;
}

/* ===== OVERLAY PRO ===== */
.lock-overlay{
  position:absolute;
  inset:0;
  background:rgba(15,23,42,0.85);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  border-radius:20px;
  z-index:10;
  text-align:center;
}

.lock-overlay button{
  margin-top:15px;
  background:#10b981;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  color:white;
  font-weight:600;
}

</style>

</head>

<body>

<div class="report-nav">
  <a href="/dashboard/" class="nav-btn primary">← Dashboard</a>
  <a href="/" class="nav-btn secondary">Home</a>
</div>

<div class="report">

<div class="header">
  <div class="logo">RendimentoBB</div>
  <div>Professional report</div>
</div>

<h1>📄 Analisi investimento</h1>

<div class="kpi-grid">
  <div class="kpi"><span>Prezzo</span><strong id="price"></strong></div>
  <div class="kpi"><span>Equity</span><strong id="equity"></strong></div>
  <div class="kpi"><span>ROI</span><strong id="roi"></strong></div>
  <div class="kpi"><span>Rischio</span><strong id="risk"></strong></div>
</div>

<div class="verdict">
  <h2 id="verdict"></h2>
  <p id="verdict-text"></p>
</div>

<div class="chart-box">
  <canvas id="roiChart"></canvas>
</div>

<button class="btn" onclick="generatePDF()">
📥 Scarica PDF professionale
</button>

<!-- OVERLAY -->
<div id="upgradeOverlay" class="lock-overlay" style="display:none">
  <h2>🔒 Report PRO</h2>
  <p style="opacity:.8">
    Questo report è usato da investitori e immobiliari
  </p>
  <button onclick="window.location.href='/pricing/'">
    🚀 Sblocca PRO
  </button>
</div>

</div>

<script>

// ================= PARAMS =================
const params = new URLSearchParams(window.location.search);

const price = Number(params.get("price") || 0);
const roi = Number(params.get("roi") || 0);
const equity = Number(params.get("equity") || 0);
const risk = Number(params.get("risk") || 0);

// ================= USER =================
let isPro = false;

function checkUserPlan(){

  if(
    window.currentPlan === "pro" ||
    window.currentPlan === "pro_yearly" ||
    (window.isProUser && window.isProUser())
  ){
    isPro = true;
  }
}

// ================= FORMAT =================
function euro(v){
  return new Intl.NumberFormat("it-IT",{
    style:"currency",
    currency:"EUR"
  }).format(v);
}

// ================= RENDER =================
document.getElementById("price").innerText = euro(price);
document.getElementById("equity").innerText = euro(equity);
document.getElementById("roi").innerText = roi.toFixed(1)+"%";
document.getElementById("risk").innerText = risk+"/100";

// ================= VERDICT =================
let verdict="",text="";

if(roi >= 12){
  verdict = "AAA INVESTMENT";
  text = "Top-tier ROI. Institutional-grade opportunity.";
}
else if(roi >= 8){
  verdict = "STRONG INVESTMENT";
  text = "High ROI with controlled risk.";
}
else if(roi >= 5){
  verdict = "OPTIMIZE";
  text = "Good investment but needs optimization.";
}
else{
  verdict = "HIGH RISK";
  text = "Low ROI or unstable fundamentals.";
}

document.getElementById("verdict").innerText = verdict;
document.getElementById("verdict-text").innerText = text;

// ================= CHART =================
function renderChart(){
  new Chart(document.getElementById("roiChart"),{
    type:"bar",
    data:{
      labels:["ROI","Rischio","Benchmark"],
      datasets:[{
        data:[roi, risk, 8],
        borderRadius:8
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true}}
    }
  });
}

// ================= LOCK =================
function applyLock(){
  const overlay = document.getElementById("upgradeOverlay");

  if(!isPro){
    overlay.style.display = "flex";
  } else {
    overlay.style.display = "none";
  }
}

// ================= PDF =================
async function generatePDF(){

  if(!isPro){
    document.getElementById("upgradeOverlay").style.display="flex";
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.text("RendimentoBB Report",20,20);
  doc.text("ROI: " + roi + "%",20,40);
  doc.text("Risk: " + risk,20,50);

  doc.save("report.pdf");
}

// ================= INIT =================
document.addEventListener("rb_auth_ready", () => {
  checkUserPlan();
  applyLock();
  renderChart();
});

setTimeout(()=>{
  checkUserPlan();
  applyLock();
  renderChart();
},1000);

</script>

</body>
</html>
