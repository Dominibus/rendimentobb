<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title
data-it="Report investimento B&B"
data-en="B&B Investment Report">
Report investimento B&B
</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/js/lang.js"></script>
<script type="module" src="/js/firebase-init.js"></script>

<style>

/* ===== BASE ===== */
body{
  font-family: system-ui;
  background:#f8fafc;
  padding:30px;
  color:#0f172a;
}

/* ===== NAV ===== */
.report-nav{
  max-width:900px;
  margin:0 auto 20px auto;
  display:flex;
  gap:10px;
}

.nav-btn{
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
  transition:.2s ease;
}

.nav-btn.primary{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.nav-btn.secondary{
  background:#e2e8f0;
  color:#0f172a;
}

.nav-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(0,0,0,0.1);
}

/* ===== CARD ===== */
.report{
  max-width:900px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 25px 80px rgba(0,0,0,0.1);
}

/* ===== HEADER ===== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-weight:800;
  color:#10b981;
}

/* ===== KPI ===== */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.kpi{
  background:#f1f5f9;
  padding:16px;
  border-radius:12px;
}

.kpi span{
  font-size:12px;
  color:#64748b;
}

.kpi strong{
  display:block;
  font-size:20px;
  margin-top:4px;
}

/* ===== VERDICT ===== */
.verdict{
  margin-top:30px;
  padding:20px;
  border-radius:14px;
  background:#ecfdf5;
}

/* ===== LOCK ===== */
.lock{
  margin-top:20px;
  padding:14px;
  background:#fff7ed;
  border-radius:10px;
  color:#9a3412;
  font-size:13px;
  text-align:center;
}

/* ===== BUTTON ===== */
.btn{
  margin-top:25px;
  background:#10b981;
  color:white;
  border:none;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  width:100%;
  font-weight:600;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 25px rgba(16,185,129,0.3);
}

</style>

</head>

<body>

<!-- NAV -->
<div class="report-nav">
  <a href="/dashboard/" class="nav-btn primary">← Dashboard</a>
  <a href="/" class="nav-btn secondary">Home</a>
</div>

<div class="report">

<div class="header">
  <div class="logo">RendimentoBB</div>
  <div data-it="Report professionale" data-en="Professional report"></div>
</div>

<h1 data-it="📄 Analisi investimento" data-en="📄 Investment Analysis"></h1>

<!-- KPI -->
<div class="kpi-grid">
  <div class="kpi"><span data-it="Prezzo immobile" data-en="Property price"></span><strong id="price"></strong></div>
  <div class="kpi"><span data-it="Equity investita" data-en="Equity invested"></span><strong id="equity"></strong></div>
  <div class="kpi"><span>ROI</span><strong id="roi"></strong></div>
  <div class="kpi"><span data-it="Rischio" data-en="Risk"></span><strong id="risk"></strong></div>
</div>

<!-- VERDICT -->
<div class="verdict">
  <h2 id="verdict"></h2>
  <p id="verdict-text"></p>
</div>

<div id="lock-msg" class="lock" style="display:none"></div>

<button class="btn" onclick="generatePDF()"
data-it="📥 Scarica PDF professionale"
data-en="📥 Download professional PDF">
</button>

</div>

<script>

// ================= PARAMS =================
const params = new URLSearchParams(window.location.search);

const price = Number(params.get("price") || 0);
const roi = Number(params.get("roi") || 0);
const equity = Number(params.get("equity") || 0);
const risk = Number(params.get("risk") || 0);

// ================= USER PLAN (REAL FIX) =================
let isPro = false;

function checkUserPlan(){

  if(
    window.currentPlan === "pro" ||
    window.currentPlan === "pro_yearly"
  ){
    isPro = true;
  }

  // 🔥 fallback sicurezza
  if(window.isProUser && window.isProUser()){
    isPro = true;
  }
}

// aspetta firebase
document.addEventListener("rb_auth_ready", () => {
  checkUserPlan();
  applyLockState();
});

setTimeout(()=>{
  checkUserPlan();
  applyLockState();
},1000);

// ================= FORMAT =================
function euro(v){
  return new Intl.NumberFormat(
    window.currentLang === "en" ? "en-US" : "it-IT",
    {style:"currency", currency:"EUR"}
  ).format(v);
}

// ================= RENDER =================
document.getElementById("price").innerText = euro(price);
document.getElementById("equity").innerText = euro(equity);
document.getElementById("roi").innerText = roi.toFixed(1)+"%";
document.getElementById("risk").innerText = risk+"/100";

// ================= VERDICT =================
let verdict="",text="";

if(roi >= 12){
  verdict = "AAA INVESTMENT";
  text = "Top-tier ROI. Institutional-grade opportunity.";
}
else if(roi >= 8){
  verdict = "STRONG INVESTMENT";
  text = "High ROI with controlled risk. Funding-ready.";
}
else if(roi >= 5){
  verdict = "OPTIMIZE";
  text = "Good investment but needs optimization.";
}
else{
  verdict = "HIGH RISK";
  text = "Low ROI or unstable fundamentals.";
}

document.getElementById("verdict").innerText = verdict;
document.getElementById("verdict-text").innerText = text;

// ================= LOCK STATE =================
function applyLockState(){

  const lock = document.getElementById("lock-msg");

  if(!isPro){

    lock.style.display="block";
    lock.innerText =
      "🔒 Full bank-grade PDF available only for PRO users";

  } else {
    lock.style.display="none";
  }
}

// ================= PDF ULTRA PRO =================
async function generatePDF(){

  if(!isPro){
    alert("Upgrade to PRO to unlock full investment report");
    window.location.href = "/";
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 20;

  // ================= COLORS =================
  const green = [16,185,129];
  const dark = [15,23,42];
  const gray = [100,116,139];

  // ================= HEADER =================
  doc.setFont("helvetica","bold");
  doc.setFontSize(20);
  doc.setTextColor(...dark);
  doc.text("RendimentoBB",20,y);

  doc.setFontSize(12);
  doc.setTextColor(...gray);
  doc.text("Investment Intelligence Report",20,y+8);

  y += 20;

  // ================= KPI CARD =================
  doc.setFillColor(248,250,252);
  doc.roundedRect(20,y,170,55,6,6,"F");

  doc.setFontSize(11);
  doc.setTextColor(...dark);

  doc.text("Property price",25,y+10);
  doc.text(euro(price),120,y+10);

  doc.text("Equity invested",25,y+18);
  doc.text(euro(equity),120,y+18);

  doc.text("ROI",25,y+26);
  doc.text(roi.toFixed(1)+"%",120,y+26);

  doc.text("Risk score",25,y+34);
  doc.text(risk+"/100",120,y+34);

  y += 70;

  // ================= VERDICT =================
  let verdictColor = green;
  let verdictTitle = verdict;
  let verdictDesc = text;

  doc.setFillColor(...verdictColor);
  doc.roundedRect(20,y,170,30,6,6,"F");

  doc.setTextColor(255,255,255);
  doc.setFontSize(16);
  doc.text(verdictTitle,25,y+13);

  doc.setFontSize(10);
  doc.text(verdictDesc,25,y+23);

  y += 45;

  // ================= SCORE =================
  let score = Math.min(100, Math.max(0, roi*5 - risk));

  doc.setTextColor(...dark);
  doc.setFontSize(14);
  doc.text("Investment Score",20,y);

  doc.setFontSize(28);
  doc.text(score.toFixed(0)+"/100",20,y+12);

  y += 25;

  // ================= ADVANCED METRICS =================
  const annualProfit = (price * (roi/100));
  const breakEvenYears = equity / annualProfit;

  doc.setFontSize(12);
  doc.text("Financial Metrics",20,y);

  y += 10;

  doc.setFontSize(10);

  doc.text("Estimated annual profit: " + euro(annualProfit),20,y); y+=6;
  doc.text("Break-even time: " + breakEvenYears.toFixed(1) + " years",20,y); y+=6;
  doc.text("Capital efficiency: HIGH",20,y);

  y += 15;

  // ================= STRATEGY =================
  doc.setFontSize(12);
  doc.text("Strategic Recommendation",20,y);

  y += 8;

  let strategy = "";

  if(roi >= 12){
    strategy = "Proceed immediately. Institutional-grade asset.";
  }
  else if(roi >= 8){
    strategy = "Proceed with investment. Strong fundamentals.";
  }
  else if(roi >= 5){
    strategy = "Optimize pricing and occupancy strategy.";
  }
  else{
    strategy = "Re-evaluate investment conditions.";
  }

  doc.setFontSize(10);
  doc.text(strategy,20,y);

  y += 15;

  // ================= ANALYSIS =================
  doc.setFontSize(12);
  doc.text("Analysis Breakdown",20,y);

  y += 8;

  doc.setFontSize(10);
  doc.text("• ROI vs market benchmark",20,y); y+=6;
  doc.text("• Risk and sustainability analysis",20,y); y+=6;
  doc.text("• Financial viability assessment",20,y); y+=6;
  doc.text("• Bank funding compatibility",20,y);

  // ================= FOOTER =================
  doc.setFontSize(9);
  doc.setTextColor(...gray);
  doc.text("Generated by RendimentoBB.com",20,285);

  doc.save("RendimentoBB-Investment-Report.pdf");
}

</script>

</body>
</html>
