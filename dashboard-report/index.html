<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title
data-it="Report investimento B&B"
data-en="B&B Investment Report">
Report investimento B&B
</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/lang.js"></script>
<script type="module" src="/js/firebase-init.js"></script>

<style>

/* ===== BASE ===== */
body{
  font-family: system-ui;
  background:#f8fafc;
  padding:30px;
  color:#0f172a;
}

/* ===== NAV ===== */
.report-nav{
  max-width:900px;
  margin:0 auto 20px auto;
  display:flex;
  gap:10px;
}

.nav-btn{
  padding:10px 16px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
}

.nav-btn.primary{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.nav-btn.secondary{
  background:#e2e8f0;
  color:#0f172a;
}

/* ===== CARD ===== */
.report{
  max-width:900px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 25px 80px rgba(0,0,0,0.1);
  position:relative;
}

/* ===== KPI ===== */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.kpi{
  background:#f1f5f9;
  padding:16px;
  border-radius:12px;
}

/* ===== VERDICT ===== */
.verdict{
  margin-top:30px;
  padding:20px;
  border-radius:14px;
  background:#ecfdf5;
}

/* ===== CHART ===== */
.chart-box{
  margin-top:30px;
}

/* ===== BUTTON ===== */
.btn{
  margin-top:25px;
  background:#10b981;
  color:white;
  border:none;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  width:100%;
  font-weight:600;
}

/* ===== OVERLAY PRO ===== */
.lock-overlay{
  position:absolute;
  inset:0;
  background:rgba(15,23,42,0.85);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  border-radius:20px;
  z-index:10;
  text-align:center;
}

.lock-overlay button{
  margin-top:15px;
  background:#10b981;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  color:white;
  font-weight:600;
}

</style>

</head>

<body>

<div class="report-nav">
  <a href="/dashboard/" class="nav-btn primary">← Dashboard</a>
  <a href="/" class="nav-btn secondary">Home</a>
</div>

<div class="report">

<div class="header">
  <div class="logo">RendimentoBB</div>
  <div>Professional report</div>
</div>

<h1>📄 Analisi investimento</h1>

<div class="kpi-grid">
  <div class="kpi"><span>Prezzo</span><strong id="price"></strong></div>
  <div class="kpi"><span>Equity</span><strong id="equity"></strong></div>
  <div class="kpi"><span>ROI</span><strong id="roi"></strong></div>
  <div class="kpi"><span>Rischio</span><strong id="risk"></strong></div>
</div>

<div class="verdict">
  <h2 id="verdict"></h2>
  <p id="verdict-text"></p>
</div>

<div class="chart-box">
  <canvas id="roiChart"></canvas>
</div>

<button class="btn" onclick="generatePDF()">
📥 Scarica PDF professionale
</button>

<!-- OVERLAY -->
<div id="upgradeOverlay" class="lock-overlay" style="display:none">
  <h2>🔒 Report PRO</h2>
  <p style="opacity:.8">
    Questo report è usato da investitori e immobiliari
  </p>
  <button onclick="window.location.href='/pricing/'">
    🚀 Sblocca PRO
  </button>
</div>

</div>

<script>

// ================= PARAMS =================
const params = new URLSearchParams(window.location.search);

const price = Number(params.get("price") || 0);
const roi = Number(params.get("roi") || 0);
const equity = Number(params.get("equity") || 0);
const risk = Number(params.get("risk") || 0);

// ================= USER =================
let isPro = false;

function checkUserPlan(){

  if(
    window.currentPlan === "pro" ||
    window.currentPlan === "pro_yearly" ||
    (window.isProUser && window.isProUser())
  ){
    isPro = true;
  }
}

// ================= FORMAT =================
function euro(v){
  return new Intl.NumberFormat("it-IT",{
    style:"currency",
    currency:"EUR"
  }).format(v);
}

// ================= RENDER BASE =================
document.getElementById("price").innerText = euro(price);
document.getElementById("equity").innerText = euro(equity);
document.getElementById("roi").innerText = roi.toFixed(1)+"%";
document.getElementById("risk").innerText = risk+"/100";

// ================= VERDICT =================
let verdict="",text="";

if(roi >= 12){
  verdict = "AAA INVESTMENT";
  text = "Top-tier ROI. Institutional-grade opportunity.";
}
else if(roi >= 8){
  verdict = "STRONG INVESTMENT";
  text = "High ROI with controlled risk.";
}
else if(roi >= 5){
  verdict = "OPTIMIZE";
  text = "Good investment but needs optimization.";
}
else{
  verdict = "HIGH RISK";
  text = "Low ROI or unstable fundamentals.";
}

document.getElementById("verdict").innerText = verdict;
document.getElementById("verdict-text").innerText = text;

// ================= CHART FIX =================
let roiChartInstance = null;

function renderChart(){

  const canvas = document.getElementById("roiChart");
  if(!canvas) return;

  if(roiChartInstance){
    roiChartInstance.destroy();
  }

  roiChartInstance = new Chart(canvas,{
    type:"bar",
    data:{
      labels:["ROI","Rischio","Benchmark"],
      datasets:[{
        data:[roi, risk, 8],
        borderRadius:8
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true}}
    }
  });
}

// ================= LOCK STRATEGICO =================
function applyLock(){

  const overlay = document.getElementById("upgradeOverlay");

  if(!isPro){

    overlay.style.display = "flex";

    // 🔥 NASCONDI DATI AVANZATI (SE PRESENTI)
    document.querySelectorAll(".pro-only").forEach(el=>{
      el.style.filter = "blur(6px)";
      el.style.pointerEvents = "none";
      el.style.opacity = "0.5";
    });

  } else {
    overlay.style.display = "none";
  }
}

// ================= PDF =================
async function generatePDF(){

  // 🔒 BLOCCO TOTALE
  if(!isPro){
    document.getElementById("upgradeOverlay").style.display="flex";
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 20;

  const green = [16,185,129];
  const dark = [15,23,42];
  const gray = [100,116,139];

  // HEADER
  doc.setFont("helvetica","bold");
  doc.setFontSize(20);
  doc.setTextColor(...dark);
  doc.text("RendimentoBB",20,y);

  doc.setFontSize(12);
  doc.setTextColor(...gray);
  doc.text("Investment Intelligence Report",20,y+8);

  y += 20;

  // KPI
  doc.setFillColor(248,250,252);
  doc.roundedRect(20,y,170,55,6,6,"F");

  doc.setFontSize(11);
  doc.setTextColor(...dark);

  doc.text("Property price",25,y+10);
  doc.text(euro(price),120,y+10);

  doc.text("Equity invested",25,y+18);
  doc.text(euro(equity),120,y+18);

  doc.text("ROI",25,y+26);
  doc.text(roi.toFixed(1)+"%",120,y+26);

  doc.text("Risk score",25,y+34);
  doc.text(risk+"/100",120,y+34);

  y += 70;

  // VERDICT
  doc.setFillColor(...green);
  doc.roundedRect(20,y,170,30,6,6,"F");

  doc.setTextColor(255,255,255);
  doc.setFontSize(16);
  doc.text(verdict,25,y+13);

  doc.setFontSize(10);
  doc.text(text,25,y+23);

  y += 45;

  // SCORE
  let score = Math.min(100, Math.max(0, roi*5 - risk));

  doc.setTextColor(...dark);
  doc.setFontSize(14);
  doc.text("Investment Score",20,y);

  doc.setFontSize(28);
  doc.text(score.toFixed(0)+"/100",20,y+12);

  y += 25;

  // METRICHE
  const annualProfit = (price * (roi/100));
  const breakEvenYears = equity / annualProfit;

  doc.setFontSize(12);
  doc.text("Financial Metrics",20,y);

  y += 10;

  doc.setFontSize(10);
  doc.text("Estimated annual profit: " + euro(annualProfit),20,y); y+=6;
  doc.text("Break-even time: " + breakEvenYears.toFixed(1) + " years",20,y);

  doc.setFontSize(9);
  doc.setTextColor(...gray);
  doc.text("Generated by RendimentoBB.com",20,285);

  doc.save("RendimentoBB-Investment-Report.pdf");
}

// ================= INIT =================
document.addEventListener("rb_auth_ready", () => {
  checkUserPlan();
  applyLock();
  renderChart();
});

setTimeout(()=>{
  checkUserPlan();
  applyLock();
  renderChart();
},800);

</script>
</body>
</html>
