<script>

function updateInvestmentScore(score){

const circle = document.getElementById("score-circle");

circle.innerText = score;

circle.classList.remove("score-good","score-medium","score-bad");

if(score >= 75){
circle.classList.add("score-good");
}

else if(score >= 50){
circle.classList.add("score-medium");
}

else{
circle.classList.add("score-bad");
}

}

function updatePreviewMetrics(roi,risk){

const roiEl = document.getElementById("roi-preview");
const riskEl = document.getElementById("risk-preview");

if(roiEl) roiEl.innerText = roi + "%";
if(riskEl) riskEl.innerText = risk + "/100";

}

</script>

<script>

/* checkout stripe */

window.buyPro = function(){

  const user = window.currentUser;

  if(!user){
    alert(
window.currentLang === "en"
? "You must login first."
: "Devi effettuare il login."
);
    window.location.href = "/login/";
    return;
  }

  const uid = user.uid;

  const stripeUrl =
  "https://buy.stripe.com/aFaeVc9vedBwft5fCGgMw00?client_reference_id=" + uid;

  window.location.href = stripeUrl;

}

</script>

<script>

function applyPaywall(){

  if(window.currentPlan === "pro"){

    console.log("Utente PRO - paywall disattivato");
    
    document.querySelectorAll('[data-locked]').forEach(el => el.remove());

    document.querySelectorAll(
      "#revenue-forecast, #market-comparison, #occupancy-sensitivity, #strategic-insight"
    ).forEach(card=>{
      card.dataset.locked = "false";

      card.style.opacity = "1";
      card.style.pointerEvents = "auto";

      const lock = card.querySelector('[data-locked]');
      if(lock){
        lock.remove();
      }
    });

    return;
  }

  const proSections = [
    "revenue-forecast",
    "market-comparison",
    "occupancy-sensitivity",
    "strategic-insight"
  ];

  proSections.forEach(id => {

    const card = document.getElementById(id);
    if(!card) return;

    if(card.dataset.locked === "true") return;

    card.dataset.locked = "true";

    card.style.opacity = "0.4";
    card.style.pointerEvents = "none";
    card.style.position = "relative";

    const lock = document.createElement("div");
    lock.setAttribute("data-locked","true");

    lock.innerHTML = `
    <div style="
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:15px;
      background:rgba(255,255,255,0.85);
      backdrop-filter:blur(4px);
      border-radius:16px;
      pointer-events:none;
    ">
      <div style="font-weight:600;font-size:16px;"
        data-it="🔒 Funzione PRO"
        data-en="🔒 PRO Feature">
      </div>

      <button onclick="buyPro()" class="btn btn-primary"
        style="pointer-events:auto"
        data-it="🔓 Sblocca versione PRO – 29€"
        data-en="🔓 Unlock PRO version – €29">
      </button>
    </div>
    `;

    card.appendChild(lock);

    if(typeof applyLanguage === "function"){
      applyLanguage();
    }

  });

}


// quando Firebase carica il piano
document.addEventListener("rb_plan_loaded", applyPaywall);


// applica comunque il paywall se utente non loggato
document.addEventListener("DOMContentLoaded", () => {

  if(!window.currentUser){
    window.currentPlan = "free";
    applyPaywall();
  }

});

document.addEventListener("DOMContentLoaded", () => {

const citySelect = document.getElementById("market-city");
const savedCity = localStorage.getItem("selected_city");

if(citySelect && savedCity){

citySelect.value = savedCity;
applyMarketData(savedCity);

}

});


// ================= CITY FROM URL (HOME → SIMULATORE) =================

document.addEventListener("DOMContentLoaded", () => {

const params = new URLSearchParams(window.location.search);
const city = params.get("city");

if(!city) return;

window.currentCity = city;

// salva città selezionata
localStorage.setItem("selected_city", city);

// seleziona nel dropdown
const citySelect = document.getElementById("market-city");

if(citySelect){
citySelect.value = city;
applyMarketData(city);
}

});

</script>
