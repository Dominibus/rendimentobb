<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title data-it="Login – RendimentoBB" data-en="Login – RendimentoBB">
Login – RendimentoBB
</title>

<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/favicon.png">

<style>
body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
}

.lang-btn{
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.2);
color:white;
padding:5px 10px;
border-radius:6px;
cursor:pointer;
font-size:12px;
}
.lang-btn.active{
background:#10b981;
border-color:#10b981;
}

.login-wrapper{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.login-card{
background:white;
color:#0f172a;
padding:50px;
border-radius:20px;
width:360px;
box-shadow:0 40px 80px rgba(0,0,0,0.25);
text-align:center;
}

.auth-tabs{
display:flex;
gap:10px;
margin-bottom:12px;
}

.auth-tab{
flex:1;
padding:10px;
border-radius:10px;
border:1px solid #e2e8f0;
background:#f1f5f9;
cursor:pointer;
}

.auth-tab.active{
background:#10b981;
color:white;
}
</style>
</head>

<body>

<main class="login-wrapper">

<!-- LANGUAGE -->
<div style="position:absolute;top:20px;right:20px;display:flex;gap:8px;">
<button onclick="changeLang('it')" class="lang-btn" id="btn-it">IT</button>
<button onclick="changeLang('en')" class="lang-btn" id="btn-en">EN</button>
</div>

<div class="login-card">

<h2 id="auth-title">Accesso</h2>

<div id="auth-subtitle" style="font-size:13px;color:#64748b;margin-bottom:10px;">
Accedi al tuo account
</div>

<div style="font-size:12px;color:#10b981;margin-bottom:10px;">
✔️ Gratis – nessuna carta richiesta
</div>

<div id="login-message"></div>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<div class="auth-tabs">
<button id="tab-login" class="auth-tab active">Accedi</button>
<button id="tab-register" class="auth-tab">Registrati</button>
</div>

<button id="authBtn" class="btn btn-primary" style="width:100%;">Accedi</button>

</div>
</main>

<!-- LANG -->
<script src="/js/lang.js"></script>

<!-- FIREBASE -->
<script type="module">
import { app } from "/js/firebase-init.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const auth = getAuth(app);

let mode = "login";

const title = document.getElementById("auth-title");
const subtitle = document.getElementById("auth-subtitle");
const tabLogin = document.getElementById("tab-login");
const tabRegister = document.getElementById("tab-register");
const btn = document.getElementById("authBtn");

// SWITCH
tabLogin.onclick = () => { mode="login"; updateUI(); };
tabRegister.onclick = () => { mode="register"; updateUI(); };

// UI
function updateUI(){

  const lang = localStorage.getItem("rb_lang") || "it";

  if(mode==="login"){
    title.innerText = lang==="en"?"Login":"Accesso";
    subtitle.innerText = lang==="en"?"Access your account":"Accedi al tuo account";
    btn.innerText = lang==="en"?"Login":"Accedi";
  }else{
    title.innerText = lang==="en"?"Create account":"Crea account";
    subtitle.innerText = lang==="en"?"Sign up in 10 seconds":"Registrati gratis";
    btn.innerText = lang==="en"?"Sign up":"Registrati";
  }

  tabLogin.classList.toggle("active",mode==="login");
  tabRegister.classList.toggle("active",mode==="register");

  // active lang button
  document.getElementById("btn-it").classList.toggle("active",lang==="it");
  document.getElementById("btn-en").classList.toggle("active",lang==="en");
}

// AUTH
btn.onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    alert("Inserisci email e password");
    return;
  }

  try{
    if(mode==="login"){
      await signInWithEmailAndPassword(auth,email,password);
    }else{
      await createUserWithEmailAndPassword(auth,email,password);
    }

    window.location.href="/tool/";

  }catch(e){
    alert(e.message);
  }
};

// LANGUAGE FIX DEFINITIVO
window.changeLang = function(lang){
  localStorage.setItem("rb_lang",lang);
  updateUI();
};

// INIT
setTimeout(updateUI,100);

</script>

</body>
</html>
