<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">  

<title data-it="Login – RendimentoBB" data-en="Login – RendimentoBB">
Login – RendimentoBB
</title>

<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/favicon.png">

<style>

/* ================= BASE ================= */
body{
margin:0;
font-family:Inter,system-ui;

background:
radial-gradient(circle at 20% 20%, rgba(16,185,129,0.15), transparent 40%),
radial-gradient(circle at 80% 80%, rgba(59,130,246,0.15), transparent 40%),
linear-gradient(135deg,#0f172a,#020617);

color:white;
overflow-x:hidden;
}

/* =========================================
🔥 LANGUAGE SWITCH – FIX TOTALE (iPhone SAFE)
========================================= */

.lang-switch{

  display: inline-flex;
  align-items: center;

  background: rgba(255,255,255,0.1);
  border-radius: 999px;

  padding: 4px;

  width: auto;
  max-width: 160px;

  margin: 0 auto;

  position: relative;

  overflow: hidden;
}

/* BOTTONI */
.lang-btn{

  flex: 1;

  text-align: center;

  padding: 6px 10px;

  font-size: 13px;
  border-radius: 999px;

  cursor: pointer;

  z-index: 2;

  white-space: nowrap;
}

/* ATTIVO */
.lang-btn.active{
  background: linear-gradient(135deg,#10b981,#059669);
  color: white;
}

/* NON ATTIVO */
.lang-btn:not(.active){
  color: #cbd5f5;
  background: transparent;
}

.lang-switch::before,
.lang-switch::after{
  display:none !important;
}  

/* BOTTONI */
.lang-btn{
  padding: 6px 12px;
  font-size: 13px;

  border-radius: 999px;

  white-space: nowrap;
  flex-shrink: 0;
}
/* BOTTONI */
.lang-btn{
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
color:white;

padding:6px 12px;
border-radius:999px;

cursor:pointer;
font-size:12px;

transition:all .2s ease;
white-space:nowrap;
}

.lang-btn:hover{
background:rgba(255,255,255,0.2);
}

.lang-btn.active{
background:#10b981;
border-color:#10b981;
}

/* ================= LAYOUT ================= */
.login-wrapper{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

/* ================= CARD ================= */
.login-card{
background:rgba(255,255,255,0.96);
backdrop-filter:blur(16px);
color:#0f172a;

padding:50px 40px;
border-radius:28px;

width:100%;
max-width:400px;

box-shadow:
0 40px 100px rgba(0,0,0,0.5),
0 0 60px rgba(16,185,129,0.15);

text-align:center;

animation:fadeIn .6s ease;

/* 🔥 FIX IOS CLICK BUG */
transform:translateZ(0);
isolation:isolate;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

/* ================= TITLE ================= */
h1{
margin:0;
font-size:26px;
font-weight:700;
}

/* ================= INPUT ================= */
input{
width:100%;
padding:14px;
margin-bottom:14px;

border-radius:14px;
border:1px solid #cbd5e1;

font-size:14px;
}

input:focus{
outline:none;
border-color:#10b981;
box-shadow:0 0 0 4px rgba(16,185,129,.2);
}

/* ================= TABS ================= */
.auth-tabs{
display:flex;
gap:10px;
margin-bottom:14px;
}

.auth-tab{
flex:1;
padding:10px;

border-radius:12px;
border:1px solid #e2e8f0;

background:#f1f5f9;
cursor:pointer;
transition:.2s;
font-weight:600;
}

.auth-tab.active{
background:#10b981;
color:white;
}

/* ================= BUTTON ================= */
.btn{
background:linear-gradient(135deg,#10b981,#059669);
color:white;

padding:15px;
border:none;
border-radius:14px;

width:100%;
font-weight:700;

cursor:pointer;

box-shadow:0 12px 30px rgba(16,185,129,0.4);
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 20px 40px rgba(16,185,129,0.5);
}

/* ================= MESSAGE ================= */
.message{
margin-bottom:12px;
font-size:13px;
}

/* ================= BACK ================= */
.back-home{
margin-top:20px;
display:inline-block;
font-size:13px;
color:#64748b;
text-decoration:none;
transition:.2s;
}

.back-home:hover{
color:#0f172a;
transform:translateX(-4px);
}

/* ================= MOBILE ================= */
@media (max-width:480px){

.login-card{
padding:30px 20px;
border-radius:20px;
}

h1{
font-size:22px;
}

/* 🔥 ancora più sicuro su mobile */
.lang-switch{
    position: relative !important;
    max-width: 140px;
    left: auto !important;
    right: auto !important;
    transition: all .25s ease;
    transform: none !important;

    margin: 10px auto 0 auto;

    width: fit-content;
  }

  .lang-btn{
    font-size: 12px;
    padding: 6px 8px;
  }

  .lang-btn.active{
  box-shadow: 0 6px 20px rgba(16,185,129,0.35);
  transform: scale(1.05);
}

}

#switch-action:hover{
  text-decoration: underline;
  opacity: 0.85;
}  

</style>
</head>

<body>

<!-- LANGUAGE SWITCH -->
<div class="lang-switch">
  <button onclick="changeLang('it')" class="lang-btn" id="btn-it">IT</button>
  <button onclick="changeLang('en')" class="lang-btn" id="btn-en">EN</button>
</div>

<main class="login-wrapper">

<div class="login-card">

<h1 id="auth-title">Accesso</h1>

<div id="auth-subtitle" style="font-size:13px;color:#64748b;margin-bottom:10px;">
Accedi al tuo account
</div>

<!-- 🔥 VALUE MESSAGE (CONVERSION BOOST) -->
<div style="font-size:12px;color:#10b981;margin-bottom:14px;"
data-it="⚡ Accesso gratuito • Il 72% degli investitori perde soldi senza analisi"
data-en="⚡ Free access • 72% of investors lose money without analysis">
⚡ Accesso gratuito • Il 72% degli investitori perde soldi senza analisi
</div>

<div id="login-message" class="message"></div>

<!-- 🔥 NAME (REGISTER ONLY) -->
<input id="name" type="text"
placeholder="Nome"
data-it="Nome"
data-en="Name">

<!-- 🔥 ROLE (REGISTER ONLY) -->
<select id="role"
style="width:100%;padding:14px;margin-bottom:14px;border-radius:14px;border:1px solid #cbd5e1;">

  <option value=""
    data-it="Seleziona profilo"
    data-en="Select profile">
    Seleziona profilo
  </option>

  <option value="investor"
    data-it="Investitore"
    data-en="Investor">
    Investitore
  </option>

  <option value="agency"
    data-it="Agenzia immobiliare"
    data-en="Real estate agency">
    Agenzia immobiliare
  </option>

  <option value="broker"
    data-it="Broker mutui"
    data-en="Mortgage broker">
    Broker mutui
  </option>

  <option value="curious"
    data-it="Curioso / studio"
    data-en="Curious / research">
    Curioso / studio
  </option>

</select>

<!-- 🔥 EMAIL -->
<input id="email" type="email"
placeholder="Email"
data-it="Email"
data-en="Email">

<!-- 🔥 PASSWORD -->
<input id="password" type="password"
placeholder="Password"
data-it="Password"
data-en="Password">

<!-- 🔥 SWITCH (STRIPE STYLE CLEAN) -->
<div style="
  display:flex;
  justify-content:center;
  gap:6px;
  margin-bottom:18px;
  font-size:13px;
  color:#64748b;
">

  <span id="switch-text"
    data-it="Non hai un account?"
    data-en="Don't have an account?">
  </span>

  <span id="switch-action"
    data-it="Registrati"
    data-en="Sign up"
    style="color:#10b981; cursor:pointer; font-weight:600; transition:0.2s;">
  </span>

</div>

<!-- 🔥 TRUST -->
<div style="margin-bottom:12px;font-size:12px;color:#64748b;">
  <span 
    data-it="🔒 Accesso sicuro • Nessuna carta richiesta"
    data-en="🔒 Secure access • No credit card required">
    🔒 Accesso sicuro • Nessuna carta richiesta
  </span>
</div>

<!-- 🔥 CTA -->
<button id="authBtn" class="btn">Login</button>

<!-- 🔥 ACTIONS -->
<div style="margin-top:12px;font-size:13px;">

  <div id="forgot-password"
    style="cursor:pointer;color:#10b981;margin-bottom:8px;"
    data-it="🔑 Password dimenticata?"
    data-en="🔑 Forgot password?">
    🔑 Password dimenticata?
  </div>

  <div id="delete-account"
    style="cursor:pointer;color:#ef4444;display:none;"
    data-it="🗑 Elimina account"
    data-en="🗑 Delete account">
    🗑 Elimina account
  </div>

</div>

<!-- 🔙 BACK -->
<a href="/" class="back-home"
   data-it="← Torna alla Home"
   data-en="← Back to Home">
← Torna alla Home
</a>

</div>

</main>

<script src="/js/lang.js"></script>

<script type="module">

import { app } from "/js/firebase-init.js";
import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
sendPasswordResetEmail,
deleteUser,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const auth = getAuth(app);

let mode="login";

const title=document.getElementById("auth-title");
const subtitle=document.getElementById("auth-subtitle");
const btn=document.getElementById("authBtn");
const messageBox=document.getElementById("login-message");

// ===== LANG =====
window.changeLang = function(lang){

if(window.setLang){
window.setLang(lang);
}

updateUI();

document.getElementById("btn-it").classList.toggle("active",lang==="it");
document.getElementById("btn-en").classList.toggle("active",lang==="en");

};

// ===== SWITCH =====
const switchText = document.getElementById("switch-text");
const switchAction = document.getElementById("switch-action");

switchAction.onclick = () => {
  mode = mode === "login" ? "register" : "login";
  updateUI();
};

// ===== UI =====
function updateUI(){

const lang=window.RB_LANG?.current||"it";

title.innerText = mode==="login"
? (lang==="en"?"Login":"Accesso")
: (lang==="en"?"Create account":"Crea account");

subtitle.innerText = mode==="login"
? (lang==="en"?"Access your account":"Accedi al tuo account")
: (lang==="en"?"Sign up in 10 seconds":"Registrati gratis in 10 secondi");

btn.innerText = mode==="login"
? (lang==="en"?"Login":"Accedi")
: (lang==="en"?"Sign up":"Registrati");

  // 🔥 CTA più aggressiva in register
if(mode === "register"){
  btn.style.background = "linear-gradient(135deg,#f59e0b,#ef4444)";
}else{
  btn.style.background = "linear-gradient(135deg,#10b981,#059669)";
}

// ================= 🔥 UX SMART =================
const isRegister = mode === "register";

document.getElementById("name").style.display = isRegister ? "block" : "none";
document.getElementById("role").style.display = isRegister ? "block" : "none";  

const t = (it,en)=> lang==="en"?en:it;

document.getElementById("email").placeholder = t("Email","Email");
document.getElementById("password").placeholder = t("Password","Password");
document.getElementById("name").placeholder = t("Nome","Name");

// ================= 🔥 SWITCH TEXT (BILINGUE)
if(mode === "login"){
  switchText.innerText = t("Non hai un account?","Don't have an account?");
  switchAction.innerText = t("Registrati","Sign up");
}else{
  switchText.innerText = t("Hai già un account?","Already have an account?");
  switchAction.innerText = t("Accedi","Login");
}  

// 🔥 ri-applica traduzioni globali
if(window.applyStaticTranslations){
  window.applyStaticTranslations();
}  

}

if(window.applyStaticTranslations){
  window.applyStaticTranslations();
}  

// ===== AUTH =====
btn.onclick=async()=>{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value.trim();

if(!email||!password){
showError("empty");
return;
}

try{

  if(mode==="login"){

    await signInWithEmailAndPassword(auth,email,password);

    // 🔥 FLAG LOGIN
    localStorage.setItem("just_logged", "1");

  }else{

    const userCredential = await createUserWithEmailAndPassword(auth,email,password);

    // 🔥 FLAG REGISTER
    localStorage.setItem("just_logged", "1");

    const user = userCredential.user;
    const leadSource = localStorage.getItem("lead_source") || "direct";  

    const name = document.getElementById("name")?.value || "";
    const role = document.getElementById("role")?.value || "unknown";

    const db = getFirestore(app);
    const pageSource = window.location.pathname;

    await setDoc(doc(db, "users", user.uid), {
      email,
      name,
      role: "user",
      profileRole: role,
      plan: "free",
      source: pageSource,
      funnel: leadSource,
      intentScore:
        role === "investor" ? 100 :
        role === "agency" ? 80 :
        role === "broker" ? 90 :
        30,
      createdAt: new Date(),
      lastLogin: new Date(),
      leadConverted: true
    });

    if(mode === "register" && role === "investor"){
  localStorage.setItem("show_investor_modal", "1");
}

    try{
      await fetch("/api/send-lead", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          email,
          name,
          role,
          type: "auth",
          source: pageSource,
          funnel: leadSource,
          lang: window.currentLang || "it"
        })
      });
    }catch(e){
      console.warn("Lead auth non inviato", e);
    }

    localStorage.removeItem("lead_source");

  }

  // 🔥 REDIRECT (RESTA FUORI dall’if)
  const redirect = localStorage.getItem("login_redirect");
  const selectedCity = localStorage.getItem("selected_city");

  localStorage.removeItem("login_redirect");

  if(selectedCity){
    localStorage.removeItem("selected_city");
    window.location.href = "/immobili/" + selectedCity;
    return;
  }

  if(redirect){
    window.location.href = redirect;
    return;
  }

  window.location.href = "/dashboard/";

}catch(e){
  showError(e.code);
}

};

// ================= RESET PASSWORD =================
document.getElementById("forgot-password").onclick = async ()=>{

  const email = document.getElementById("email").value.trim();

  if(!email){
    showError("empty");
    return;
  }

  try{

    await sendPasswordResetEmail(auth, email);

    showSuccess(
      "📩 Email inviata per il reset password",
      "📩 Password reset email sent"
    );

  }catch(e){
    showError(e.code);
  }

};  

// ================= DELETE ACCOUNT =================
document.getElementById("delete-account").onclick = async ()=>{

  const user = auth.currentUser;

  if(!user){
    alert("Devi essere loggato");
    return;
  }

  const confirmDelete = confirm(
    window.RB_LANG?.current === "en"
    ? "Are you sure you want to delete your account?"
    : "Sei sicuro di voler eliminare il tuo account?"
  );

  if(!confirmDelete) return;

  try{

    await deleteUser(user);

    alert(
      window.RB_LANG?.current === "en"
      ? "Account deleted"
      : "Account eliminato"
    );

    window.location.href = "/";

  }catch(e){

    alert(
      window.RB_LANG?.current === "en"
      ? "Re-login required"
      : "Effettua di nuovo il login prima"
    );

  }

};

// ================= AUTH STATE =================
onAuthStateChanged(auth, (user)=>{
  document.getElementById("delete-account").style.display = user ? "block" : "none";
});  

// ===== ERROR =====
function showError(code){

const lang=window.RB_LANG?.current||"it";

const map={
empty:{it:"Inserisci email e password",en:"Enter email and password"},
"auth/invalid-email":{it:"Email non valida",en:"Invalid email"},
"auth/user-not-found":{it:"Utente non trovato",en:"User not found"},
"auth/wrong-password":{it:"Password errata",en:"Wrong password"}
};

const msg=map[code]||{it:"Errore",en:"Error"};

messageBox.innerHTML=`
<div style="background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;">
${lang==="en"?msg.en:msg.it}
</div>`;

}

function showSuccess(it, en){

  const lang = window.RB_LANG?.current || "it";

  messageBox.innerHTML = `
  <div style="background:#dcfce7;color:#166534;padding:10px;border-radius:10px;">
  ${lang==="en"?en:it}
  </div>
  `;

}  

updateUI();

</script>

</body>
</html>
