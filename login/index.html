<!-- 🔥 FIREBASE AUTH -->
<script type="module">

import { app } from "/js/firebase-init.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const auth = getAuth(app);

// ================= STATE =================

let mode = "login";

// ================= ELEMENTS =================

const title = document.getElementById("auth-title");
const subtitle = document.getElementById("auth-subtitle");

const tabLogin = document.getElementById("tab-login");
const tabRegister = document.getElementById("tab-register");

const messageBox = document.getElementById("login-message");
const btn = document.getElementById("authBtn");

// ================= SWITCH MODE =================

tabLogin.onclick = () => {
  mode = "login";
  updateUI();
};

tabRegister.onclick = () => {
  mode = "register";
  updateUI();
};

// ================= UI =================

function updateUI(){

  if(mode === "login"){

    title.innerText = "Accesso";
    subtitle.innerText = "Accedi al tuo account";

    btn.innerText = "Accedi";

    messageBox.innerHTML = "";

  }else{

    title.innerText = "Crea account";
    subtitle.innerText = "Registrati gratis in 10 secondi";

    btn.innerText = "Registrati";

    messageBox.innerHTML = `
      <div style="
        background:#ecfdf5;
        color:#065f46;
        padding:10px;
        border-radius:8px;
        font-size:13px;
      ">
        ✔️ Gratis<br>
        ✔️ Nessuna carta richiesta<br>
        ✔️ Accesso immediato
      </div>
    `;
  }

  tabLogin.classList.toggle("active", mode === "login");
  tabRegister.classList.toggle("active", mode === "register");

  tabLogin.classList.toggle("btn-primary", mode === "login");
  tabRegister.classList.toggle("btn-primary", mode === "register");

  if(typeof setLang === "function"){
    setLang(window.RB_LANG?.current || "it");
  }
}

// INIT
updateUI();

// ================= AUTH ACTION =================

btn.onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    showError("empty");
    return;
  }

  // loading state
  btn.disabled = true;
  btn.innerText = "⏳...";

  try{

    if(mode === "login"){
      await signInWithEmailAndPassword(auth,email,password);
    }else{
      await createUserWithEmailAndPassword(auth,email,password);
    }

    // redirect smart
    const redirect = localStorage.getItem("redirect_after_login") || "/tool/";
    window.location.href = redirect;

  }catch(e){
    showError(e.code);
  }

  btn.disabled = false;
  updateUI();
};

// ================= ERROR HANDLER =================

function showError(code){

  const lang = window.RB_LANG?.current || "it";

  const errors = {
    empty: {
      it: "Inserisci email e password",
      en: "Enter email and password"
    },
    "auth/invalid-email": {
      it: "Email non valida",
      en: "Invalid email"
    },
    "auth/email-already-in-use": {
      it: "Email già registrata → fai login",
      en: "Email already registered"
    },
    "auth/weak-password": {
      it: "Password troppo debole (min 6 caratteri)",
      en: "Weak password (min 6 characters)"
    },
    "auth/user-not-found": {
      it: "Utente non trovato",
      en: "User not found"
    },
    "auth/wrong-password": {
      it: "Password errata",
      en: "Wrong password"
    }
  };

  const msg = errors[code] || {
    it: "Errore imprevisto",
    en: "Unexpected error"
  };

  messageBox.innerHTML = `
    <div style="
      background:#fee2e2;
      color:#991b1b;
      padding:12px;
      border-radius:8px;
      font-size:13px;
      margin-top:10px;
    ">
      ${lang === "en" ? msg.en : msg.it}
    </div>
  `;
}

</script>

<script src="/js/lang.js" defer></script>
<script type="module" src="/js/header.js"></script>
<script src="/js/footer.js" defer></script>
