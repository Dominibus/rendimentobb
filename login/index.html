<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login – RendimentoBB</title>

<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon.png">  

<style>

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
}

.login-wrapper{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:40px 20px;
}

.login-card{
background:white;
color:#0f172a;
padding:50px;
border-radius:20px;
width:360px;
box-shadow:0 40px 80px rgba(0,0,0,0.25);
text-align:center;
}

.login-card h2{
margin-bottom:20px;
font-weight:800;
}

.login-card input{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #cbd5e1;
font-size:14px;
}

.login-card input:focus{
outline:none;
border-color:#10b981;
box-shadow:0 0 0 3px rgba(16,185,129,.2);
}

.auth-tabs{
display:flex;
gap:10px;
margin-bottom:15px;
}

.auth-tab{
flex:1;
padding:10px;
border-radius:10px;
border:1px solid #e2e8f0;
background:#f1f5f9;
cursor:pointer;
}

.auth-tab.active{
background:#10b981;
color:white;
}

.back-link{
margin-top:20px;
font-size:13px;
}

.back-link a{
color:#64748b;
text-decoration:none;
}

.back-link a:hover{
color:#0f172a;
}

</style>

</head>

<body>

<main class="login-wrapper">

<div class="login-card">

<h2 id="auth-title">Accesso</h2>

<div id="auth-subtitle" style="font-size:13px;color:#64748b;margin-bottom:10px;">
Accedi al tuo account
</div>

<div style="font-size:12px;color:#10b981;margin-bottom:10px;">
✔️ Gratis – nessuna carta richiesta
</div>

<div id="login-message" style="font-size:13px;margin-bottom:10px;"></div>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<div class="auth-tabs">
<button id="tab-login" class="auth-tab active">Accedi</button>
<button id="tab-register" class="auth-tab">Registrati</button>
</div>

<button id="authBtn" class="btn btn-primary" style="width:100%;">
Continua
</button>

<div class="back-link">
<a href="/">← Torna alla Home</a>
</div>

</div>

</main>

<!-- 🔥 FIREBASE AUTH -->
<script type="module">

import { app } from "/js/firebase-init.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const auth = getAuth(app);

// ================= STATE =================
let mode = "login";

// ================= ELEMENTS =================
const title = document.getElementById("auth-title");
const subtitle = document.getElementById("auth-subtitle");
const tabLogin = document.getElementById("tab-login");
const tabRegister = document.getElementById("tab-register");
const messageBox = document.getElementById("login-message");
const btn = document.getElementById("authBtn");

// ================= SWITCH =================
tabLogin.onclick = () => {
  mode = "login";
  updateUI();
};

tabRegister.onclick = () => {
  mode = "register";
  updateUI();
};

// ================= UI =================
function updateUI(){

  if(mode === "login"){
    title.innerText = "Accesso";
    subtitle.innerText = "Accedi al tuo account";
    btn.innerText = "Accedi";
    messageBox.innerHTML = "";
  }else{
    title.innerText = "Crea account";
    subtitle.innerText = "Registrati gratis in 10 secondi";
    btn.innerText = "Registrati";
    messageBox.innerHTML = `
      <div style="color:#10b981;">
        ✔️ Gratis<br>
        ✔️ Nessuna carta richiesta<br>
        ✔️ Accesso immediato
      </div>
    `;
  }

  tabLogin.classList.toggle("active", mode === "login");
  tabRegister.classList.toggle("active", mode === "register");
}

updateUI();

// ================= AUTH =================
btn.onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    showError("Inserisci email e password");
    return;
  }

  try{

    if(mode === "login"){
      await signInWithEmailAndPassword(auth,email,password);
    }else{
      await createUserWithEmailAndPassword(auth,email,password);
    }

    window.location.href = "/tool/";

  }catch(e){
    showError(e.message);
  }

};

// ================= ERROR =================
function showError(msg){
  messageBox.innerHTML = `
    <div style="
      background:#fee2e2;
      color:#991b1b;
      padding:10px;
      border-radius:8px;
    ">
      ${msg}
    </div>
  `;
}

</script>

<script src="/js/lang.js" defer></script>

</body>
</html>
