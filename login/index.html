<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title data-it="Login – RendimentoBB" data-en="Login – RendimentoBB">
Login – RendimentoBB
</title>

<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/favicon.png">

<style>

/* ===== BACKGROUND ===== */
body{
background:
radial-gradient(circle at 20% 20%, rgba(16,185,129,0.15), transparent 40%),
radial-gradient(circle at 80% 80%, rgba(59,130,246,0.15), transparent 40%),
linear-gradient(135deg,#0f172a,#020617);
color:white;
font-family:system-ui;
}

/* ===== LANGUAGE ===== */
.lang-btn{
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
color:white;
padding:6px 12px;
border-radius:8px;
cursor:pointer;
font-size:12px;
transition:.2s;
}

.lang-btn:hover{
background:rgba(255,255,255,0.2);
}

.lang-btn.active{
background:#10b981;
border-color:#10b981;
}

/* ===== CARD ===== */
.login-wrapper{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.login-card{
background:rgba(255,255,255,0.96);
backdrop-filter:blur(14px);
color:#0f172a;
padding:50px;
border-radius:24px;
width:380px;
box-shadow:
0 30px 80px rgba(0,0,0,0.4),
0 0 40px rgba(16,185,129,0.15);
text-align:center;
animation:fadeIn .6s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

/* ===== INPUT ===== */
input{
width:100%;
padding:14px;
margin-bottom:14px;
border-radius:12px;
border:1px solid #cbd5e1;
}

input:focus{
outline:none;
border-color:#10b981;
box-shadow:0 0 0 4px rgba(16,185,129,.2);
}

/* ===== TABS ===== */
.auth-tabs{
display:flex;
gap:10px;
margin-bottom:14px;
}

.auth-tab{
flex:1;
padding:10px;
border-radius:10px;
border:1px solid #e2e8f0;
background:#f1f5f9;
cursor:pointer;
transition:.2s;
}

.auth-tab.active{
background:#10b981;
color:white;
}

/* ===== BUTTON ===== */
.btn{
background:linear-gradient(135deg,#10b981,#059669);
color:white;
padding:14px;
border:none;
border-radius:12px;
width:100%;
font-weight:600;
cursor:pointer;
box-shadow:0 10px 25px rgba(16,185,129,0.3);
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 15px 35px rgba(16,185,129,0.4);
}

/* ===== BACK LINK ===== */
.back-home{
margin-top:18px;
display:inline-block;
font-size:13px;
color:#64748b;
text-decoration:none;
transition:.2s;
}

.back-home:hover{
color:#0f172a;
transform:translateX(-4px);
}

</style>
</head>

<body>

<div style="position:absolute;top:20px;right:20px;display:flex;gap:8px;">
<button onclick="changeLang('it')" class="lang-btn" id="btn-it">IT</button>
<button onclick="changeLang('en')" class="lang-btn" id="btn-en">EN</button>
</div>

<main class="login-wrapper">

<div class="login-card">

<h2 id="auth-title" data-it="Accesso" data-en="Login">Accesso</h2>

<div id="auth-subtitle"
data-it="Accedi al tuo account"
data-en="Access your account"
style="font-size:13px;color:#64748b;margin-bottom:10px;">
Accedi al tuo account
</div>

<div style="font-size:12px;color:#10b981;margin-bottom:10px;"
data-it="✔️ Gratis – nessuna carta richiesta"
data-en="✔️ Free – no credit card required">
✔️ Gratis – nessuna carta richiesta
</div>

<div id="login-message"></div>

<input id="email" type="email"
data-placeholder-it="Email"
data-placeholder-en="Email">

<input id="password" type="password"
data-placeholder-it="Password"
data-placeholder-en="Password">

<div class="auth-tabs">
<button id="tab-login" class="auth-tab active">Login</button>
<button id="tab-register" class="auth-tab">Sign up</button>
</div>

<button id="authBtn" class="btn">Login</button>

<!-- 🔥 BACK HOME -->
<a href="/" class="back-home"
data-it="← Torna alla Home"
data-en="← Back to Home">
← Torna alla Home
</a>

</div>

</main>

<!-- LANG -->
<script src="/js/lang.js"></script>

<!-- AUTH -->
<script type="module">

import { app } from "/js/firebase-init.js";
import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const auth = getAuth(app);

let mode="login";

const title=document.getElementById("auth-title");
const subtitle=document.getElementById("auth-subtitle");
const tabLogin=document.getElementById("tab-login");
const tabRegister=document.getElementById("tab-register");
const btn=document.getElementById("authBtn");
const messageBox=document.getElementById("login-message");

// ===== LANG =====
window.changeLang = function(lang){

if(window.setLang){
window.setLang(lang);
}

updateUI();

document.getElementById("btn-it").classList.toggle("active",lang==="it");
document.getElementById("btn-en").classList.toggle("active",lang==="en");

};

// ===== SWITCH =====
tabLogin.onclick=()=>{mode="login";updateUI();}
tabRegister.onclick=()=>{mode="register";updateUI();}

// ===== UI =====
function updateUI(){

const lang=window.RB_LANG?.current||"it";

title.innerText = mode==="login"
? (lang==="en"?"Login":"Accesso")
: (lang==="en"?"Create account":"Crea account");

subtitle.innerText = mode==="login"
? (lang==="en"?"Access your account":"Accedi al tuo account")
: (lang==="en"?"Sign up in 10 seconds":"Registrati gratis in 10 secondi");

btn.innerText = mode==="login"
? (lang==="en"?"Login":"Accedi")
: (lang==="en"?"Sign up":"Registrati");

tabLogin.classList.toggle("active",mode==="login");
tabRegister.classList.toggle("active",mode==="register");

}

// ===== AUTH =====
btn.onclick=async()=>{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value.trim();

if(!email||!password){
showError("empty");
return;
}

try{

if(mode==="login"){
await signInWithEmailAndPassword(auth,email,password);
}else{
await createUserWithEmailAndPassword(auth,email,password);
}

window.location.href="/tool/";

}catch(e){
showError(e.code);
}

};

// ===== ERROR =====
function showError(code){

const lang=window.RB_LANG?.current||"it";

const map={
empty:{it:"Inserisci email e password",en:"Enter email and password"},
"auth/invalid-email":{it:"Email non valida",en:"Invalid email"},
"auth/user-not-found":{it:"Utente non trovato",en:"User not found"},
"auth/wrong-password":{it:"Password errata",en:"Wrong password"}
};

const msg=map[code]||{it:"Errore",en:"Error"};

messageBox.innerHTML=`
<div style="background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;">
${lang==="en"?msg.en:msg.it}
</div>`;

}

updateUI();

</script>

</body>
</html>
