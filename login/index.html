<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">  

<title data-it="Login – RendimentoBB" data-en="Login – RendimentoBB">
Login – RendimentoBB
</title>

<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/favicon.png">

<style>

/* ================= BASE ================= */
body{
margin:0;
font-family:Inter,system-ui;

background:
radial-gradient(circle at 20% 20%, rgba(16,185,129,0.15), transparent 40%),
radial-gradient(circle at 80% 80%, rgba(59,130,246,0.15), transparent 40%),
linear-gradient(135deg,#0f172a,#020617);

color:white;
overflow-x:hidden;
}

/* =========================================
🔥 LANGUAGE SWITCH – FIX TOTALE (iPhone SAFE)
========================================= */

.lang-switch{

  display: inline-flex;
  align-items: center;

  background: rgba(255,255,255,0.1);
  border-radius: 999px;

  padding: 4px;

  width: auto;
  max-width: 160px;

  margin: 0 auto;

  position: relative;

  overflow: hidden;
}

/* BOTTONI */
.lang-btn{

  flex: 1;

  text-align: center;

  padding: 6px 10px;

  font-size: 13px;
  border-radius: 999px;

  cursor: pointer;

  z-index: 2;

  white-space: nowrap;
}

/* ATTIVO */
.lang-btn.active{
  background: linear-gradient(135deg,#10b981,#059669);
  color: white;
}

/* NON ATTIVO */
.lang-btn:not(.active){
  color: #cbd5f5;
  background: transparent;
}

.lang-switch::before,
.lang-switch::after{
  display:none !important;
}  

/* BOTTONI */
.lang-btn{
  padding: 6px 12px;
  font-size: 13px;

  border-radius: 999px;

  white-space: nowrap;
  flex-shrink: 0;
}
/* BOTTONI */
.lang-btn{
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
color:white;

padding:6px 12px;
border-radius:999px;

cursor:pointer;
font-size:12px;

transition:all .2s ease;
white-space:nowrap;
}

.lang-btn:hover{
background:rgba(255,255,255,0.2);
}

.lang-btn.active{
background:#10b981;
border-color:#10b981;
}

/* ================= LAYOUT ================= */
.login-wrapper{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

/* ================= CARD ================= */
.login-card{
background:rgba(255,255,255,0.96);
backdrop-filter:blur(16px);
color:#0f172a;

padding:50px 40px;
border-radius:28px;

width:100%;
max-width:400px;

box-shadow:
0 40px 100px rgba(0,0,0,0.5),
0 0 60px rgba(16,185,129,0.15);

text-align:center;

animation:fadeIn .6s ease;

/* 🔥 FIX IOS CLICK BUG */
transform:translateZ(0);
isolation:isolate;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

/* ================= TITLE ================= */
h2{
margin:0;
font-size:26px;
font-weight:700;
}

/* ================= INPUT ================= */
input{
width:100%;
padding:14px;
margin-bottom:14px;

border-radius:14px;
border:1px solid #cbd5e1;

font-size:14px;
}

input:focus{
outline:none;
border-color:#10b981;
box-shadow:0 0 0 4px rgba(16,185,129,.2);
}

/* ================= TABS ================= */
.auth-tabs{
display:flex;
gap:10px;
margin-bottom:14px;
}

.auth-tab{
flex:1;
padding:10px;

border-radius:12px;
border:1px solid #e2e8f0;

background:#f1f5f9;
cursor:pointer;
transition:.2s;
font-weight:600;
}

.auth-tab.active{
background:#10b981;
color:white;
}

/* ================= BUTTON ================= */
.btn{
background:linear-gradient(135deg,#10b981,#059669);
color:white;

padding:15px;
border:none;
border-radius:14px;

width:100%;
font-weight:700;

cursor:pointer;

box-shadow:0 12px 30px rgba(16,185,129,0.4);
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 20px 40px rgba(16,185,129,0.5);
}

/* ================= MESSAGE ================= */
.message{
margin-bottom:12px;
font-size:13px;
}

/* ================= BACK ================= */
.back-home{
margin-top:20px;
display:inline-block;
font-size:13px;
color:#64748b;
text-decoration:none;
transition:.2s;
}

.back-home:hover{
color:#0f172a;
transform:translateX(-4px);
}

/* ================= MOBILE ================= */
@media (max-width:480px){

.login-card{
padding:30px 20px;
border-radius:20px;
}

h2{
font-size:22px;
}

/* 🔥 ancora più sicuro su mobile */
.lang-switch{
    position: relative !important;
    max-width: 140px;
    left: auto !important;
    right: auto !important;
    transition: all .25s ease;
    transform: none !important;

    margin: 10px auto 0 auto;

    width: fit-content;
  }

  .lang-btn{
    font-size: 12px;
    padding: 6px 8px;
  }

  .lang-btn.active{
  box-shadow: 0 6px 20px rgba(16,185,129,0.35);
  transform: scale(1.05);
}

}

</style>
</head>

<body>

<!-- LANGUAGE SWITCH -->
<div class="lang-switch">
<button onclick="changeLang('it')" class="lang-btn" id="btn-it">IT</button>
<button onclick="changeLang('en')" class="lang-btn" id="btn-en">EN</button>
</div>

<main class="login-wrapper">

<div class="login-card">

<h2 id="auth-title">Accesso</h2>

<div id="auth-subtitle" style="font-size:13px;color:#64748b;margin-bottom:10px;">
Accedi al tuo account
</div>

<div style="font-size:12px;color:#10b981;margin-bottom:12px;">
✔️ Gratis – nessuna carta richiesta
</div>

<div id="login-message" class="message"></div>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<div class="auth-tabs">
<button id="tab-login" class="auth-tab active">Login</button>
<button id="tab-register" class="auth-tab">Sign up</button>
</div>

<button id="authBtn" class="btn">Login</button>

<a href="/" class="back-home">
← Torna alla Home
</a>

</div>

</main>

<script src="/js/lang.js"></script>

<script type="module">

import { app } from "/js/firebase-init.js";
import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const auth = getAuth(app);

let mode="login";

const title=document.getElementById("auth-title");
const subtitle=document.getElementById("auth-subtitle");
const tabLogin=document.getElementById("tab-login");
const tabRegister=document.getElementById("tab-register");
const btn=document.getElementById("authBtn");
const messageBox=document.getElementById("login-message");

// ===== LANG =====
window.changeLang = function(lang){

if(window.setLang){
window.setLang(lang);
}

updateUI();

document.getElementById("btn-it").classList.toggle("active",lang==="it");
document.getElementById("btn-en").classList.toggle("active",lang==="en");

};

// ===== SWITCH =====
tabLogin.onclick=()=>{mode="login";updateUI();}
tabRegister.onclick=()=>{mode="register";updateUI();}

// ===== UI =====
function updateUI(){

const lang=window.RB_LANG?.current||"it";

title.innerText = mode==="login"
? (lang==="en"?"Login":"Accesso")
: (lang==="en"?"Create account":"Crea account");

subtitle.innerText = mode==="login"
? (lang==="en"?"Access your account":"Accedi al tuo account")
: (lang==="en"?"Sign up in 10 seconds":"Registrati gratis in 10 secondi");

btn.innerText = mode==="login"
? (lang==="en"?"Login":"Accedi")
: (lang==="en"?"Sign up":"Registrati");

tabLogin.classList.toggle("active",mode==="login");
tabRegister.classList.toggle("active",mode==="register");

}

// ===== AUTH =====
btn.onclick=async()=>{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value.trim();

if(!email||!password){
showError("empty");
return;
}

try{

if(mode==="login"){
await signInWithEmailAndPassword(auth,email,password);
}else{
await createUserWithEmailAndPassword(auth,email,password);
}

// 🔥 REDIRECT INTELLIGENTE SaaS
const redirect = localStorage.getItem("login_redirect");
const selectedCity = localStorage.getItem("selected_city");

// pulizia
localStorage.removeItem("login_redirect");

  console.log("🔥 LOGIN SUCCESS → redirect intelligente");

// =====================
// 🎯 PRIORITÀ REDIRECT
// =====================

// 1. Se viene da immobili città
if(selectedCity){
  localStorage.removeItem("selected_city");
  window.location.href = "/immobili/" + selectedCity;
  return;
}

// 2. Se viene da pagina specifica
if(redirect){
  window.location.href = redirect;
  return;
}

// 3. fallback PRO SaaS
window.location.href = "/dashboard/";

}catch(e){
showError(e.code);
}

};

// ===== ERROR =====
function showError(code){

const lang=window.RB_LANG?.current||"it";

const map={
empty:{it:"Inserisci email e password",en:"Enter email and password"},
"auth/invalid-email":{it:"Email non valida",en:"Invalid email"},
"auth/user-not-found":{it:"Utente non trovato",en:"User not found"},
"auth/wrong-password":{it:"Password errata",en:"Wrong password"}
};

const msg=map[code]||{it:"Errore",en:"Error"};

messageBox.innerHTML=`
<div style="background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;">
${lang==="en"?msg.en:msg.it}
</div>`;

}

updateUI();

</script>

</body>
</html>
