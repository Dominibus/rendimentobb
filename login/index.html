<!-- 🔥 FIREBASE AUTH -->
<script type="module">

import { app } from "/js/firebase-init.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const auth = getAuth(app);

// ================= INIT =================

let mode = "login";

const title = document.getElementById("auth-title");
const subtitle = document.getElementById("auth-subtitle");

const tabLogin = document.getElementById("tab-login");
const tabRegister = document.getElementById("tab-register");

const messageBox = document.getElementById("login-message");

// ================= SWITCH =================

tabLogin.onclick = () => {
  mode = "login";
  updateUI();
};

tabRegister.onclick = () => {
  mode = "register";
  updateUI();
};

// ================= UI =================

function updateUI(){

  if(mode === "login"){

    title.setAttribute("data-it","Accesso");
    title.setAttribute("data-en","Login");

    subtitle.setAttribute("data-it","Accedi al tuo account");
    subtitle.setAttribute("data-en","Access your account");

    messageBox.innerHTML = "";

  }else{

    title.setAttribute("data-it","Crea account");
    title.setAttribute("data-en","Create account");

    subtitle.setAttribute("data-it","Registrati gratis in 10 secondi");
    subtitle.setAttribute("data-en","Sign up in 10 seconds");

    messageBox.innerHTML = `
      <div style="font-size:13px;color:#10b981;">
        ✔️ Gratis<br>
        ✔️ Nessuna carta richiesta<br>
        ✔️ Accesso immediato
      </div>
    `;
  }

  tabLogin.classList.toggle("active", mode === "login");
  tabRegister.classList.toggle("active", mode === "register");

  if(typeof setLang === "function"){
    setLang(window.RB_LANG.current);
  }
}

updateUI();

// ================= AUTH =================

document.getElementById("authBtn").onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    showError("empty");
    return;
  }

  try{

    if(mode === "login"){
      await signInWithEmailAndPassword(auth,email,password);
    }else{
      await createUserWithEmailAndPassword(auth,email,password);
    }

    window.location.href = "/tool/";

  }catch(e){
    showError(e.code);
  }

};

// ================= ERROR =================

function showError(code){

  const lang = window.RB_LANG?.current || "it";

  const errors = {
    empty: {
      it: "Inserisci email e password",
      en: "Enter email and password"
    },
    "auth/invalid-email": {
      it: "Email non valida",
      en: "Invalid email"
    },
    "auth/email-already-in-use": {
      it: "Email già registrata → fai login",
      en: "Email already registered"
    },
    "auth/weak-password": {
      it: "Password troppo debole",
      en: "Weak password"
    },
    "auth/user-not-found": {
      it: "Utente non trovato",
      en: "User not found"
    },
    "auth/wrong-password": {
      it: "Password errata",
      en: "Wrong password"
    }
  };

  const msg = errors[code] || {
    it: "Errore",
    en: "Error"
  };

  messageBox.innerHTML = `
    <div style="
      background:#fee2e2;
      color:#991b1b;
      padding:10px;
      border-radius:8px;
      font-size:13px;
    ">
      ${lang === "en" ? msg.en : msg.it}
    </div>
  `;
}

</script>

<script src="/js/lang.js" defer></script>
<script type="module" src="/js/header.js"></script>
<script src="/js/footer.js" defer></script>  

</body>
</html>
