<script type="module">

import { upgradeToPro } from "/js/firebase-init.js";

document.addEventListener("DOMContentLoaded", () => {

const params = new URLSearchParams(window.location.search);

const uid =
params.get("client_reference_id") ||
params.get("uid");

const statusEl = document.getElementById("status-msg");

// 🔥 helper traduzione centralizzata
function t(it, en){
  return (window.currentLang === "en") ? en : it;
}

// 🔥 redirect intelligente
function smartRedirect(){
  setTimeout(()=>{
    if(window.currentPlan === "pro" || window.currentPlan === "investor"){
      window.location.href = "/dashboard/";
    }else{
      window.location.href = "/tool/";
    }
  }, 2500);
}

// 🔥 set status UI
function setStatus(text, color="#94a3b8"){
  if(statusEl){
    statusEl.innerText = text;
    statusEl.style.color = color;
  }
}

// 🔥 traduzioni globali subito
if(window.applyTranslations) applyTranslations();

// ================= MAIN =================

if(uid){

  // 🔥 TEST MODE
  if(uid === "test123"){
    console.warn("TEST MODE - nessun upgrade reale");

    setStatus(
      t(
        "Modalità test attiva (nessun upgrade reale)",
        "Test mode active (no real upgrade)"
      ),
      "#f59e0b"
    );

    smartRedirect();
  }

  else{

    setStatus(
      t(
        "Attivazione in corso...",
        "Activating your account..."
      )
    );

    upgradeToPro(uid)
    .then(()=>{
      console.log("PRO attivato");

      setStatus(
        t(
          "Attivazione completata con successo",
          "Activation completed successfully"
        ),
        "#10b981"
      );

      smartRedirect();
    })
    .catch(err=>{
      console.error("Errore upgrade PRO:", err);

      setStatus(
        t(
          "Accesso già attivo o sincronizzazione in corso",
          "Access already active or syncing in progress"
        ),
        "#10b981"
      );

      smartRedirect();
    });

  }

}else{

  console.warn("UID non trovato nell'URL");

  setStatus(
    t(
      "ID utente non trovato",
      "User ID not found"
    ),
    "#ef4444"
  );

}

});

</script>
