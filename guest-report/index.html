<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
  <title>Segnala un problema · RendimentoBB</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#eefbf7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 14px;background:radial-gradient(circle at top,#d9fff1 0,#f8fafc 48%,#eef2f7 100%)}
    main{width:min(100%,560px);margin:auto}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:20px;font-weight:900;color:#047857}.lang{display:flex;gap:6px}.lang button{border:1px solid #a7f3d0;background:#fff;border-radius:999px;padding:7px 10px;font-weight:800;color:#047857}.lang button[aria-pressed=true]{background:#10b981;color:#fff}
    .card{background:#fff;border:1px solid #dbe3ee;border-radius:22px;padding:22px;box-shadow:0 20px 50px rgba(15,23,42,.1)}h1{margin:0;font-size:26px;line-height:1.15}.intro{color:#64748b;line-height:1.5;margin:9px 0 18px}.stay{padding:13px;border-radius:14px;background:#ecfdf5;border:1px solid #a7f3d0;margin-bottom:18px;color:#065f46;line-height:1.45}.field{margin-top:14px}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;background:#fff;padding:12px;font:inherit}select{height:48px}textarea{min-height:130px;resize:vertical}.help{font-size:12px;color:#64748b;margin-top:5px}.trap{position:absolute;left:-9999px;opacity:0}
    button[type=submit]{width:100%;margin-top:18px;border:0;border-radius:13px;padding:14px;background:#10b981;color:#fff;font-size:15px;font-weight:900;cursor:pointer}button[disabled]{opacity:.55;cursor:wait}.status{display:none;margin-top:15px;padding:13px;border-radius:12px;line-height:1.45}.status.error{display:block;background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.status.success{display:block;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}footer{text-align:center;color:#64748b;font-size:11px;margin-top:15px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="logo">RendimentoBB</div><div class="lang"><button id="lang-it" type="button" aria-pressed="true">IT</button><button id="lang-en" type="button" aria-pressed="false">EN</button></div></div>
    <section class="card">
      <h1 data-it="🛎️ Segnala un problema" data-en="🛎️ Report an issue">🛎️ Segnala un problema</h1>
      <p class="intro" data-it="Comunica rapidamente un problema relativo al tuo soggiorno. La segnalazione sarà inviata direttamente all’host." data-en="Quickly report an issue with your stay. Your report will be sent directly to the host.">Comunica rapidamente un problema relativo al tuo soggiorno. La segnalazione sarà inviata direttamente all’host.</p>
      <div id="stay-context" class="stay" data-it="Verifica del collegamento…" data-en="Checking your link…">Verifica del collegamento…</div>
      <form id="guest-report-form" hidden>
        <div class="field"><label for="category" data-it="Categoria" data-en="Category">Categoria</label><select id="category" required><option value="maintenance" data-it="Manutenzione" data-en="Maintenance">Manutenzione</option><option value="cleaning" data-it="Pulizia" data-en="Cleaning">Pulizia</option><option value="access" data-it="Accesso / check-in" data-en="Access / check-in">Accesso / check-in</option><option value="noise" data-it="Rumore" data-en="Noise">Rumore</option><option value="comfort" data-it="Comfort / dotazioni" data-en="Comfort / amenities">Comfort / dotazioni</option><option value="other" data-it="Altro" data-en="Other">Altro</option></select></div>
        <div class="field"><label for="priority" data-it="Quanto è urgente?" data-en="How urgent is it?">Quanto è urgente?</label><select id="priority" required><option value="low" data-it="Bassa · può attendere" data-en="Low · can wait">Bassa · può attendere</option><option value="medium" data-it="Media · da gestire presto" data-en="Medium · handle soon">Media · da gestire presto</option><option value="high" data-it="Alta · limita il soggiorno" data-en="High · affects the stay">Alta · limita il soggiorno</option><option value="urgent" data-it="Urgente · serve assistenza immediata" data-en="Urgent · immediate help needed">Urgente · serve assistenza immediata</option></select></div>
        <div class="field"><label for="note" data-it="Descrivi il problema" data-en="Describe the issue">Descrivi il problema</label><textarea id="note" minlength="10" maxlength="500" required data-it-placeholder="Indica cosa è successo e dove…" data-en-placeholder="Tell us what happened and where…" placeholder="Indica cosa è successo e dove…"></textarea><div class="help" data-it="Non inserire dati di pagamento o documenti personali." data-en="Do not include payment or identity document details.">Non inserire dati di pagamento o documenti personali.</div></div>
        <div class="trap" aria-hidden="true"><label for="website">Website</label><input id="website" tabindex="-1" autocomplete="off"></div>
        <button id="submit-button" type="submit" data-it="Invia segnalazione" data-en="Send report">Invia segnalazione</button>
      </form>
      <div id="form-status" class="status" role="status" aria-live="polite"></div>
    </section>
    <footer data-it="Portale ospite protetto · RendimentoBB" data-en="Secure guest portal · RendimentoBB">Portale ospite protetto · RendimentoBB</footer>
  </main>
  <script src="/js/guest-report.js?v=20260908-guest-portal-v20-1" defer></script>
</body>
</html>
