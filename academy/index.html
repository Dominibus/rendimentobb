<style>

/* ===== GLOBAL FIX ===== */
.academy-page main{
padding-top:40px;
}

/* ===== HERO MODERNO ===== */
.hero-academy{
padding:100px 20px 80px;
background:
linear-gradient(rgba(15,23,42,0.35), rgba(15,23,42,0.55)),
url("/img/naples-bg.jpg") center/cover;
text-align:center;
color:white;
position:relative;
}

/* glow effect */
.hero-academy::before{
content:"";
position:absolute;
top:-100px;
left:50%;
transform:translateX(-50%);
width:600px;
height:600px;
background:radial-gradient(circle, rgba(16,185,129,0.25), transparent 70%);
filter:blur(80px);
z-index:0;
}

.hero-academy *{
position:relative;
z-index:2;
}

/* ===== HEADLINE ===== */
.hero-academy h1{
font-size:38px;
font-weight:800;
line-height:1.2;
max-width:800px;
margin:auto;
}

.hero-academy p{
margin-top:15px;
font-size:18px;
opacity:0.9;
}

/* ===== STACK ===== */
.stack{
max-width:720px;
margin:50px auto;
display:flex;
flex-direction:column;
gap:20px;
}

/* ===== BOX GLASS ===== */
.box{
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
color:#0f172a;
padding:22px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
transition:all .25s ease;
}

.box:hover{
transform:translateY(-4px);
}

.box-light{
background:rgba(241,245,249,0.9);
}

/* ===== CTA PREMIUM ===== */
.cta{
background:linear-gradient(135deg,#10b981,#059669);
color:white;
padding:28px;
border-radius:18px;
text-align:center;
box-shadow:0 20px 50px rgba(16,185,129,0.3);
}

.cta p{
font-weight:600;
}

.cta .btn{
margin-top:12px;
display:inline-block;
padding:12px 22px;
border-radius:10px;
background:white;
color:#059669;
font-weight:700;
transition:all .2s;
}

.cta .btn:hover{
transform:scale(1.05);
}

/* ===== SECTION TITLE ===== */
.section-title{
text-align:center;
font-size:28px;
font-weight:700;
margin-top:80px;
}

/* ===== GRID ===== */
.cards{
max-width:1100px;
margin:50px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
padding:0 20px;
}

/* ===== CARD SAAS ===== */
.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.06);
position:relative;
transition:all .25s ease;
border:1px solid #f1f5f9;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0 25px 60px rgba(0,0,0,0.1);
}

/* badge PRO */
.card::after{
content:"PRO";
position:absolute;
top:12px;
right:12px;
background:#10b981;
color:white;
font-size:10px;
padding:5px 8px;
border-radius:6px;
font-weight:600;
}

/* ===== CTA FINAL ===== */
.cta-final{
text-align:center;
margin:100px 0 80px;
}

.cta-final h3{
font-size:26px;
margin-bottom:20px;
}

.cta-final .btn{
padding:14px 28px;
font-size:16px;
}

</style>
