<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lead Command Center – RendimentoBB</title>

<link rel="stylesheet" href="/css/style.css">

<style>

body{
background:#f8fafc;
font-family:Inter,system-ui;
}

.container{
max-width:1200px;
margin:0 auto;
padding:40px 20px;
}

h1{
font-size:34px;
font-weight:800;
}

.subtitle{
color:#64748b;
margin-bottom:30px;
}

/* KPI */
.kpi-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:25px;
}

.kpi{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.kpi-title{
font-size:13px;
color:#64748b;
}

.kpi-value{
font-size:28px;
font-weight:800;
margin-top:6px;
}

/* CARD */
.card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 15px 40px rgba(0,0,0,0.06);
}

/* FILTER */
.filter{
margin-bottom:20px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.filter button{
padding:8px 14px;
border:none;
border-radius:999px;
cursor:pointer;
background:#e2e8f0;
font-weight:600;
}

.filter button.active{
background:#10b981;
color:white;
}

/* LEAD */
.lead{
border-bottom:1px solid #e2e8f0;
padding:16px 0;
display:flex;
justify-content:space-between;
align-items:center;
}

.lead.hot{
background:#ecfdf5;
border-left:4px solid #10b981;
padding-left:12px;
}

.lead:last-child{
border:none;
}

.lead-meta{
font-size:13px;
color:#64748b;
margin-top:4px;
}

/* BADGE */
.badge{
color:white;
padding:5px 12px;
border-radius:999px;
font-size:12px;
font-weight:700;
}

.priority{
font-size:11px;
font-weight:700;
margin-top:4px;
}

/* STATE */
.loader{
text-align:center;
padding:20px;
color:#64748b;
}

</style>

</head>

<body>

<div id="global-header"></div>  

<script src="/js/lang.js"></script>
  
<script type="module" src="/js/header.js"></script>
<script src="/js/ui-system.js" defer></script>  
<script type="module" src="/js/footer.js"></script> 

<div class="container">

<h1>🚀 Lead Command Center</h1>
<div class="subtitle">
Monitoraggio monetizzazione + performance in tempo reale
</div>

<!-- KPI -->
<div class="kpi-grid">

  <div class="kpi">
    <div class="kpi-title">Lead Totali</div>
    <div id="totalLeads" class="kpi-value">0</div>
  </div>

  <div class="kpi">
    <div class="kpi-title">Revenue</div>
    <div id="totalValue" class="kpi-value">€0</div>
  </div>

  <div class="kpi">
    <div class="kpi-title">Valore Medio</div>
    <div id="avgValue" class="kpi-value">€0</div>
  </div>

  <div class="kpi">
    <div class="kpi-title">Lead HOT</div>
    <div id="hotLeads" class="kpi-value">0</div>
  </div>

  <div class="kpi">
    <div class="kpi-title">Top città</div>
    <div id="topCity" class="kpi-value">-</div>
  </div>

</div>

<!-- LISTA -->
<div class="card">

  <h2>🔥 Live Leads</h2>

  <div class="filter">
    <button class="active" data-filter="all">All</button>
    <button data-filter="hot">HOT</button>
    <button data-filter="warm">WARM</button>
    <button data-filter="cold">COLD</button>
  </div>

  <div id="leadList" class="loader">Caricamento...</div>

</div>

</div>

<div id="global-footer"></div>

<script type="module">

import { auth, db } from "/js/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
collection,
getDocs,
query,
orderBy,
limit
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

// ================= ADMIN =================
function isAdmin(user){
  const email = (user?.email || "").toLowerCase();
  const role = (window.userRole || "").toLowerCase();
  return email === "rendimentobb@gmail.com" || role === "admin";
}

// ================= FORMAT € =================
function formatCurrency(v){
  return new Intl.NumberFormat("it-IT", {
    style:"currency",
    currency:"EUR"
  }).format(v || 0);
}

// ================= DATE =================
function formatDate(ts){
  if(!ts) return "-";

  const d = ts.seconds
    ? new Date(ts.seconds * 1000)
    : new Date(ts);

  return d.toLocaleString("it-IT");
}

let currentFilter = "all";
let leadsData = [];
let loading = false;

// ================= AUTH =================
onAuthStateChanged(auth, async (user)=>{

  if(!user || !isAdmin(user)){
    document.body.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f172a;color:white;">
      🔒 Admin only
    </div>`;
    return;
  }

  await loadLeads();

  setInterval(()=>{
    if(!loading) loadLeads();
  }, 10000);

});

// ================= LOAD =================
async function loadLeads(){

  loading = true;

  try{

    const q = query(
      collection(db,"leads"),
      orderBy("createdAt","desc"),
      limit(150)
    );

    const snap = await getDocs(q);

    leadsData = snap.docs.map(d => d.data());

    render();

  }catch(e){
    console.error("🔥 Load leads error:", e);
  }

  loading = false;
}

// ================= RENDER =================
function render(){

  const listEl = document.getElementById("leadList");

  const filtered = leadsData
    .filter(l=>{
      const score = (l.score || "cold").toLowerCase();
      return currentFilter === "all" || score === currentFilter;
    })
    .slice(0,50);

  listEl.innerHTML = `
    <div style="font-size:12px;color:#64748b;margin-bottom:10px">
      ${filtered.length} visibili / ${leadsData.length} totali
    </div>
  `;

  if(filtered.length === 0){
    listEl.innerHTML += "<div class='loader'>Nessun lead</div>";
    return;
  }

  filtered.forEach(d=>{

    const score = (d.score || "cold").toLowerCase();

    const roi = Number(d.roi || 0).toFixed(1);

    const badgeColor =
      score === "hot" ? "#10b981" :
      score === "warm" ? "#f59e0b" :
      "#64748b";

    listEl.innerHTML += `
    <div class="lead ${score}">

      <div>
        <b>${d.email || "⚠️ no email"}</b>

        <div class="lead-meta">
          ${d.type || "-"} • ${d.city || "-"} • ROI ${roi}%
        </div>

        <div class="lead-meta">
          ${formatDate(d.createdAt)}
        </div>
      </div>

      <div style="text-align:right">

        <div class="badge" style="background:${badgeColor}">
          ${score.toUpperCase()}
        </div>

        <div style="font-size:18px;font-weight:900;margin-top:6px">
          ${formatCurrency(d.value)}
        </div>

        <div style="margin-top:8px;display:flex;gap:6px;justify-content:flex-end">

          <button onclick="copyEmail('${d.email}')"
            style="padding:6px 10px;border-radius:8px;border:none;background:#e2e8f0;cursor:pointer;">
            📋
          </button>

          <a href="mailto:${d.email}"
            style="padding:6px 10px;border-radius:8px;background:#10b981;color:white;text-decoration:none;">
            ✉️
          </a>

        </div>

      </div>

    </div>
    `;
  });

  updateKPI();
}

// ================= KPI =================
function updateKPI(){

  const total = leadsData.length;

  const totalValue = leadsData.reduce((a,l)=>a+Number(l.value||0),0);

  const avg = total ? Math.round(totalValue / total) : 0;

  const hot = leadsData.filter(l=> (l.score||"") === "hot").length;

  const cityMap = {};

  leadsData.forEach(l=>{
    const c = l.city || "unknown";
    cityMap[c] = (cityMap[c]||0)+1;
  });

  const topCity = Object.keys(cityMap)
    .sort((a,b)=>cityMap[b]-cityMap[a])[0] || "-";

  document.getElementById("totalLeads").innerText = total;
  document.getElementById("totalValue").innerText = formatCurrency(totalValue);
  document.getElementById("avgValue").innerText = formatCurrency(avg);
  document.getElementById("hotLeads").innerText = hot;
  document.getElementById("topCity").innerText = topCity;
}

// ================= COPY =================
window.copyEmail = function(email){
  if(!email) return;
  navigator.clipboard.writeText(email);
};

// ================= FILTER =================
document.querySelectorAll(".filter button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".filter button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    currentFilter = btn.dataset.filter;
    render();
  });
});

</script>

</body>
</html>
