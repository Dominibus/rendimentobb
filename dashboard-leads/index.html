<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title data-it="Centro gestione lead – RendimentoBB" data-en="Lead Management Center – RendimentoBB">Centro gestione lead – RendimentoBB</title>

<link rel="icon" href="/img/favicon.png">

<link rel="stylesheet" href="/css/style.css">

<style>

body{
background:#f8fafc;
font-family:Inter,system-ui;
}

  /* ============================= */
/* 🔥 LEADS TYPO FIX */
/* ============================= */

h1,
h2{
background:transparent !important;
color:#0f172a !important;
opacity:1 !important;
filter:none !important;
-webkit-text-fill-color:#0f172a !important;
letter-spacing:-0.5px;
}

h1{
font-size:42px;
font-weight:900;
line-height:1.1;
margin-bottom:6px;
}

h2{
font-size:34px;
font-weight:800;
margin-bottom:18px;
}

.subtitle{
font-size:16px;
color:#475569;
font-weight:500;
margin-bottom:35px;
}

.card h2{
display:flex;
align-items:center;
gap:10px;
color:#111827 !important;
}

.container{
max-width:1200px;
margin:0 auto;
padding:40px 20px;
}

h1{
font-size:34px;
font-weight:800;
}

.subtitle{
color:#64748b;
margin-bottom:30px;
}

/* KPI */
.kpi-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:25px;
}

.kpi{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.kpi-title{
font-size:13px;
color:#475569;
font-weight:600;
}

.kpi-value{
font-size:28px;
font-weight:800;
margin-top:6px;
}

/* CARD */
.card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 15px 40px rgba(0,0,0,0.06);
}

/* FILTER */
.filter{
margin-bottom:20px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.filter button{
padding:8px 14px;
border:none;
border-radius:999px;
cursor:pointer;
background:#e2e8f0;
font-weight:600;
}

.filter button.active{
background:#10b981;
color:white;
}

/* LEAD */
.lead{
border-bottom:1px solid #e2e8f0;
padding:16px 0;
display:flex;
justify-content:space-between;
align-items:center;
}

.lead.hot{
background:#ecfdf5;
border-left:4px solid #10b981;
padding-left:12px;
}

.lead.extreme{
background:#fff7ed;
border-left:4px solid #f97316;
padding-left:12px;
}

.lead:last-child{
border:none;
}

.lead-meta{
font-size:13px;
color:#475569;
margin-top:4px;
font-weight:500;
}

/* BADGE */
.lead .badge{
position:static;
top:auto;
left:auto;
transform:none;
display:inline-flex;
align-items:center;
color:white;
padding:5px 12px;
border-radius:999px;
font-size:12px;
font-weight:700;
}

.priority{
font-size:11px;
font-weight:700;
margin-top:4px;
}

/* STATE */
.loader{
text-align:center;
padding:20px;
color:#475569;
font-weight:600;
}

</style>

</head>

<body>

<div id="global-header"></div>  

<script src="/js/lang.js"></script>
  
<script type="module" src="/js/header.js"></script>
<script src="/js/ui-system.js" defer></script>  
<script type="module" src="/js/footer.js"></script> 

<div class="container">

<h1 data-it="Centro gestione lead" data-en="Lead Management Center">Centro gestione lead</h1>
<div class="subtitle"
data-it="Priorità, valore potenziale e provenienza dei lead"
data-en="Lead priority, potential value and acquisition source">
Priorità, valore potenziale e provenienza dei lead
</div>

<!-- KPI -->
<div class="kpi-grid">

  <div class="kpi">
    <div class="kpi-title" data-it="Lead totali" data-en="Total leads">Lead totali</div>
    <div id="totalLeads" class="kpi-value">0</div>
  </div>

  <div class="kpi">
    <div class="kpi-title" data-it="Valore potenziale" data-en="Potential value">Valore potenziale</div>
    <div id="totalValue" class="kpi-value">€0</div>
  </div>

  <div class="kpi">
    <div class="kpi-title" data-it="Valore medio lead" data-en="Average lead value">Valore medio lead</div>
    <div id="avgValue" class="kpi-value">€0</div>
  </div>

  <div class="kpi">
    <div class="kpi-title" data-it="Lead prioritari" data-en="Priority leads">Lead prioritari</div>
    <div id="hotLeads" class="kpi-value">0</div>
  </div>

  <div class="kpi">
    <div class="kpi-title" data-it="Città principale" data-en="Top city">Città principale</div>
    <div id="topCity" class="kpi-value">-</div>
  </div>

</div>

<!-- LISTA -->
<div class="card">

  <h2 data-it="Lead recenti" data-en="Recent leads">Lead recenti</h2>

  <div class="filter">
    <button class="active" data-filter="all" data-it="Tutti" data-en="All">Tutti</button>
    <button data-filter="priority" data-it="Prioritari" data-en="Priority">Prioritari</button>
    <button data-filter="warm">WARM</button>
    <button data-filter="cold">COLD</button>
  </div>

  <div id="leadList" class="loader">Caricamento...</div>

</div>

</div>

<div id="global-footer"></div>

<script type="module">

import { auth, db } from "/js/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
collection,
getDocs,
query,
orderBy,
limit
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

// ================= ADMIN =================
function isAdmin(user){
  const email = (user?.email || "").toLowerCase();
  const role = (window.userRole || "").toLowerCase();
  return email === "rendimentobb@gmail.com" || role === "admin";
}

// ================= FORMAT € =================
function formatCurrency(v){
  return new Intl.NumberFormat("it-IT", {
    style:"currency",
    currency:"EUR"
  }).format(v || 0);
}

// ================= DATE =================
function formatDate(ts){
  if(!ts) return "-";

  const d = ts.seconds
    ? new Date(ts.seconds * 1000)
    : new Date(ts);

  return d.toLocaleString("it-IT");
}

function formatCity(value){
  const city = String(value || "").trim();
  if(!city) return "-";
  return city
    .toLocaleLowerCase("it-IT")
    .replace(/(^|[\s'-])\p{L}/gu, letter => letter.toLocaleUpperCase("it-IT"));
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>'"]/g, character => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "'":"&#39;",
    '"':"&quot;"
  })[character]);
}

function translate(it, en){
  return window.currentLang === "en" ? en : it;
}

let currentFilter = "all";
let leadsData = [];
let loading = false;

// ================= AUTH =================
onAuthStateChanged(auth, async (user)=>{

  if(!user || !isAdmin(user)){
    document.body.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f172a;color:white;">
      🔒 Admin only
    </div>`;
    return;
  }

  await loadLeads();

  setInterval(()=>{
    if(!loading) loadLeads();
  }, 10000);

});

// ================= LOAD =================
async function loadLeads(){

  loading = true;

  try{

    const q = query(
      collection(db,"leads"),
      orderBy("createdAt","desc"),
      limit(150)
    );

    const snap = await getDocs(q);

    leadsData = snap.docs.map(d => d.data());

    render();

  }catch(e){
    console.error("🔥 Load leads error:", e);
  }

  loading = false;
}

// ================= RENDER =================
function render(){

  const listEl = document.getElementById("leadList");

  const filtered = leadsData
    .filter(l=>{
      const score = (l.score || "cold").toLowerCase();
      return currentFilter === "all" ||
        (currentFilter === "priority" && ["extreme", "hot"].includes(score)) ||
        score === currentFilter;
    })
    .slice(0,50);

  listEl.innerHTML = `
    <div style="font-size:12px;color:#64748b;margin-bottom:10px">
      ${translate(
        `${filtered.length} lead recenti mostrati su ${leadsData.length}`,
        `${filtered.length} recent leads shown out of ${leadsData.length}`
      )}
    </div>
  `;

  if(filtered.length === 0){
    listEl.innerHTML += `<div class="loader">${translate("Nessun lead", "No leads")}</div>`;
    return;
  }

  filtered.forEach(d=>{

    const score = (d.score || "cold").toLowerCase();

    const roi = Number(d.roi || 0).toLocaleString(
      window.currentLang === "en" ? "en-US" : "it-IT",
      { minimumFractionDigits:1, maximumFractionDigits:1 }
    );

    const email = String(d.email || "").trim();

    const badgeColor =
      score === "extreme" ? "#f97316" :
      score === "hot" ? "#10b981" :
      score === "warm" ? "#f59e0b" :
      "#64748b";

    listEl.innerHTML += `
    <div class="lead ${score}">

      <div>
        <b>${escapeHTML(email || translate("Email assente", "Missing email"))}</b>

        <div class="lead-meta">
          ${escapeHTML(
            d.lastType ||
            d.type ||
            (Array.isArray(d.typesVisited) ? d.typesVisited.at(-1) : "") ||
            translate("Analisi", "Analysis")
          )} • ${escapeHTML(formatCity(d.city))} • ROI ${roi}%
        </div>

        <div class="lead-meta">
          ${formatDate(d.createdAt)}
        </div>
      </div>

      <div style="text-align:right">

        <div class="badge" style="background:${badgeColor}">
          ${score.toUpperCase()}
        </div>

        <div style="font-size:18px;font-weight:900;margin-top:6px">
          ${formatCurrency(d.value)}
        </div>

        <div style="margin-top:8px;display:flex;gap:6px;justify-content:flex-end">

          <button class="copy-email" data-email="${escapeHTML(email)}"
            type="button"
            title="${translate("Copia email", "Copy email")}"
            aria-label="${translate("Copia email", "Copy email")}"
            style="padding:6px 10px;border-radius:8px;border:none;background:#e2e8f0;cursor:pointer;">
            📋
          </button>

          <a href="mailto:${encodeURIComponent(email)}"
            title="${translate("Contatta lead", "Contact lead")}"
            aria-label="${translate("Contatta lead", "Contact lead")}"
            style="padding:6px 10px;border-radius:8px;background:#10b981;color:white;text-decoration:none;">
            ✉️
          </a>

        </div>

      </div>

    </div>
    `;
  });

  updateKPI();
}

// ================= KPI =================
function updateKPI(){

  const total = leadsData.length;

  const totalValue = leadsData.reduce((a,l)=>a+Number(l.value||0),0);

  const avg = total ? Math.round(totalValue / total) : 0;

  const priority = leadsData.filter(l=>
    ["extreme", "hot"].includes((l.score || "").toLowerCase())
  ).length;

  const cityMap = {};

  leadsData.forEach(l=>{
    const c = formatCity(l.city || translate("Non indicata", "Unknown"));
    cityMap[c] = (cityMap[c]||0)+1;
  });

  const topCity = Object.keys(cityMap)
    .sort((a,b)=>cityMap[b]-cityMap[a])[0] || "-";

  document.getElementById("totalLeads").innerText = total;
  document.getElementById("totalValue").innerText = formatCurrency(totalValue);
  document.getElementById("avgValue").innerText = formatCurrency(avg);
  document.getElementById("hotLeads").innerText = priority;
  document.getElementById("topCity").innerText = topCity;
}

// ================= COPY =================
window.copyEmail = function(email){
  if(!email) return;
  navigator.clipboard.writeText(email);
};

document.getElementById("leadList").addEventListener("click", event => {
  const button = event.target.closest(".copy-email");
  if(button) window.copyEmail(button.dataset.email);
});

// ================= FILTER =================
document.querySelectorAll(".filter button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".filter button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    currentFilter = btn.dataset.filter;
    render();
  });
});

document.addEventListener("rb_language_changed", render);

</script>

</body>
</html>
