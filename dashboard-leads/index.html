<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Leads – RendimentoBB</title>

<link rel="stylesheet" href="/css/style.css">

<style>

body{
background:#f8fafc;
}

.container{
max-width:1200px;
margin:0 auto;
padding:40px 20px;
}

h1{
font-size:32px;
font-weight:800;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:14px;
margin-bottom:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.lead{
border-bottom:1px solid #e2e8f0;
padding:10px 0;
}

.lead:last-child{
border:none;
}

.badge{
background:#10b981;
color:white;
padding:4px 10px;
border-radius:999px;
font-size:12px;
}

</style>

</head>

<body>

<script type="module" src="/js/header.js"></script>
<script type="module" src="/js/footer.js"></script>  

<div id="global-header"></div>

<div class="container">

<h1>📊 Dashboard Leads</h1>

<div style="margin-bottom:20px; color:#64748b;">
Dashboard interna per la gestione dei lead qualificati generati dal sistema RendimentoBB.
</div>  

<!-- KPI -->
<div class="card" style="display:flex;gap:20px">

  <div style="flex:1">
    <div style="color:#64748b">Lead Totali</div>
    <div id="totalLeads" style="font-size:26px;font-weight:800">0</div>
  </div>

  <div style="flex:1">
    <div style="color:#64748b">Valore Totale</div>
    <div id="totalValue" style="font-size:26px;font-weight:800">€0</div>
  </div>

</div>

<!-- LISTA -->
<div class="card">
  <h2>🔥 Lead in tempo reale</h2>
  <div id="leadList">Caricamento...</div>
</div>

</div>

<div id="global-footer"></div>

<script type="module">

import { auth, db } from "/js/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
collection,
getDocs,
query,
orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

// ================= ADMIN CHECK =================

function isAdmin(user){
  return user?.email === "rendimentobb@gmail.com";
}

// ================= AUTH =================

onAuthStateChanged(auth, (user)=>{

  if(!user || !isAdmin(user)){
    alert("Accesso riservato admin");
    window.location.href = "/";
    return;
  }

  loadLeads();

});

// ================= LOAD LEADS =================

async function loadLeads(){

  const q = query(
    collection(db,"leads"),
    orderBy("createdAt","desc")
  );

  const snap = await getDocs(q);

  let html = "";
  let totalValue = 0;
  let totalLeads = 0;

  snap.forEach(doc=>{

    const d = doc.data();

    totalLeads++;
    totalValue += d.value || 0;

    const badgeColor =
      d.score === "hot" ? "#10b981" :
      d.score === "warm" ? "#f59e0b" :
      "#64748b";

    html += `
    <div class="lead" style="display:flex;justify-content:space-between;align-items:center">

      <div>
        <b>${d.email}</b>
        <div style="font-size:13px;color:#64748b;margin-top:4px">
          ${d.type || "-"} | ${d.city || "-"} | ROI ${d.roi || "-"}%
        </div>
      </div>

      <div style="text-align:right">

        <div class="badge" style="background:${badgeColor}">
          ${d.score?.toUpperCase() || "—"}
        </div>

        <div style="font-weight:700;margin-top:6px">
          €${d.value || 0}
        </div>

      </div>

    </div>
    `;

  });

  document.getElementById("leadList").innerHTML = html || "Nessun lead";

  // ================= KPI =================

  document.getElementById("totalLeads").innerText = totalLeads;
  document.getElementById("totalValue").innerText = "€" + totalValue;

}

</script>

</body>
</html>
