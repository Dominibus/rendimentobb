<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Leads – RendimentoBB</title>

<link rel="stylesheet" href="/css/style.css">

<style>

body{
background:#f8fafc;
font-family:Inter,system-ui;
}

/* ===== CONTAINER ===== */
.container{
max-width:1200px;
margin:0 auto;
padding:40px 20px;
}

h1{
font-size:32px;
font-weight:800;
}

.subtitle{
color:#64748b;
margin-bottom:30px;
}

/* ===== KPI GRID ===== */
.kpi-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.kpi{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.kpi-title{
color:#64748b;
font-size:13px;
}

.kpi-value{
font-size:28px;
font-weight:800;
margin-top:6px;
}

/* ===== CARD ===== */
.card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 15px 40px rgba(0,0,0,0.06);
}

/* ===== FILTER ===== */
.filter{
margin-bottom:20px;
display:flex;
gap:10px;
}

.filter button{
padding:8px 14px;
border:none;
border-radius:999px;
cursor:pointer;
background:#e2e8f0;
font-weight:600;
}

.filter button.active{
background:#10b981;
color:white;
}

/* ===== LEAD ===== */
.lead{
border-bottom:1px solid #e2e8f0;
padding:16px 0;
display:flex;
justify-content:space-between;
align-items:center;
}

.lead:last-child{
border:none;
}

.lead-left b{
font-size:15px;
}

.lead-meta{
font-size:13px;
color:#64748b;
margin-top:4px;
}

/* ===== BADGE ===== */
.badge{
color:white;
padding:5px 12px;
border-radius:999px;
font-size:12px;
font-weight:700;
}

/* ===== VALUE ===== */
.value{
font-weight:800;
margin-top:6px;
font-size:16px;
}

/* ===== STATES ===== */
.loader{
text-align:center;
padding:20px;
color:#64748b;
}

.error{
color:#ef4444;
padding:20px;
text-align:center;
}

</style>

</head>

<body>

<script type="module" src="/js/header.js"></script>
<script type="module" src="/js/footer.js"></script>  

<div id="global-header"></div>

<div class="container">

<h1>📊 Lead Engine Dashboard</h1>
<div class="subtitle">
Sistema di monetizzazione lead in tempo reale
</div>

<!-- KPI -->
<div class="kpi-grid">

  <div class="kpi">
    <div class="kpi-title">Lead Totali</div>
    <div id="totalLeads" class="kpi-value">0</div>
  </div>

  <div class="kpi">
    <div class="kpi-title">Valore Totale</div>
    <div id="totalValue" class="kpi-value">€0</div>
  </div>

  <div class="kpi">
    <div class="kpi-title">Valore Medio</div>
    <div id="avgValue" class="kpi-value">€0</div>
  </div>

  <div class="kpi">
    <div class="kpi-title">Lead HOT</div>
    <div id="hotLeads" class="kpi-value">0</div>
  </div>

</div>

<!-- LISTA -->
<div class="card">

  <h2>🔥 Lead in tempo reale</h2>

  <!-- FILTER -->
  <div class="filter">
    <button class="active" data-filter="all">Tutti</button>
    <button data-filter="hot">HOT</button>
    <button data-filter="warm">WARM</button>
    <button data-filter="cold">COLD</button>
  </div>

  <div id="leadList" class="loader">Caricamento...</div>

</div>

</div>

<div id="global-footer"></div>

<script type="module">

import { auth, db } from "/js/firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
collection,
getDocs,
query,
orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

// ================= ADMIN =================
function isAdmin(user){
  return user?.email === "rendimentobb@gmail.com";
}

// ================= FILTER STATE =================
let currentFilter = "all";
let leadsData = [];

// ================= AUTH =================
onAuthStateChanged(auth, async (user)=>{

  if(!user || !isAdmin(user)){
    alert("Accesso riservato admin");
    window.location.href = "/";
    return;
  }

  await loadLeads();

});

// ================= LOAD =================
async function loadLeads(){

  const listEl = document.getElementById("leadList");

  const q = query(
    collection(db,"leads"),
    orderBy("createdAt","desc")
  );

  const snap = await getDocs(q);

  leadsData = [];

  snap.forEach(doc=>{
    leadsData.push(doc.data());
  });

  render();

}

// ================= RENDER =================
function render(){

  const listEl = document.getElementById("leadList");

  let totalValue = 0;
  let totalLeads = 0;
  let hotCount = 0;

  const filtered = leadsData.filter(l=>{
    return currentFilter === "all" || l.score === currentFilter;
  });

  let html = "";

  filtered.forEach(d=>{

    const roi = Number(d.roi || 0).toFixed(1);

    totalLeads++;
    totalValue += Number(d.value || 0);

    if(d.score === "hot") hotCount++;

    const badgeColor =
      d.score === "hot" ? "#10b981" :
      d.score === "warm" ? "#f59e0b" :
      "#64748b";

    html += `
    <div class="lead">

      <div class="lead-left">
        <b>${d.email || "—"}</b>
        <div class="lead-meta">
          ${d.type || "-"} • ${d.city || "-"} • ROI ${roi}%
        </div>
      </div>

      <div style="text-align:right">

        <div class="badge" style="background:${badgeColor}">
          ${(d.score || "cold").toUpperCase()}
        </div>

        <div class="value">
          €${d.value || 0}
        </div>

      </div>

    </div>
    `;

  });

  listEl.innerHTML = html || "<div class='loader'>Nessun lead</div>";

  // KPI GLOBALI (su TUTTI i dati)
  const totalAll = leadsData.length;
  const valueAll = leadsData.reduce((acc,l)=> acc + Number(l.value||0),0);
  const avg = totalAll ? Math.round(valueAll / totalAll) : 0;
  const hotAll = leadsData.filter(l=>l.score==="hot").length;

  document.getElementById("totalLeads").innerText = totalAll;
  document.getElementById("totalValue").innerText = "€" + valueAll;
  document.getElementById("avgValue").innerText = "€" + avg;
  document.getElementById("hotLeads").innerText = hotAll;

}

// ================= FILTER UI =================
document.querySelectorAll(".filter button").forEach(btn=>{
  btn.addEventListener("click", ()=>{

    document.querySelectorAll(".filter button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    currentFilter = btn.dataset.filter;
    render();

  });
});

</script>

</body>
</html>
