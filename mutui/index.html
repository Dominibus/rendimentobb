<head>

Mutuo B&B

<link rel="stylesheet" href="/css/style.css">

<style>

/* =====================================
🔥 RENDIMENTOBB – MUTUI UI FINAL PRODUCTION
(SILICON VALLEY CLEAN + FIX REALI)
===================================== */

:root{
  --rb-bg:#f8fafc;
  --rb-surface:#ffffff;
  --rb-dark:#0f172a;
  --rb-muted:#64748b;

  --rb-primary:#10b981;
  --rb-primary-dark:#059669;

  --rb-danger:#ef4444;

  --rb-border:#e2e8f0;

  --rb-radius:16px;
  --rb-radius-lg:20px;

  --rb-shadow-sm:0 4px 12px rgba(2,6,23,.06);
  --rb-shadow-md:0 20px 50px rgba(2,6,23,.10);
  --rb-shadow-lg:0 60px 140px rgba(2,6,23,.18);
}

/* ===== BASE ===== */
body{
  padding-top:60px;
  background:linear-gradient(to bottom,#f8fafc,#e2e8f0);
  font-family:Inter,system-ui;
  color:var(--rb-dark);
}

/* =====================================
🔥 HERO – FIX VISIBILITY (CRITICO)
===================================== */

.hero-mutui{
  position:relative;
  padding:140px 20px 120px;
  text-align:center;

  background:
    linear-gradient(rgba(2,6,23,.35),rgba(2,6,23,.55)),
    url("/img/milan-bg.jpg") center/cover;

  overflow:hidden;
}

.hero-mutui::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 30% 30%, rgba(16,185,129,0.18), transparent 60%);
  z-index:1;
}

.hero-mutui h1{
  position:relative;
  z-index:2;
  color:#ffffff !important;
  font-size:48px;
  font-weight:800;
  margin-bottom:15px;
  max-width:900px;
  margin-inline:auto;
  text-shadow:0 10px 30px rgba(0,0,0,.8);
}

.hero-mutui p{
  position:relative;
  z-index:2;
  font-size:18px;
  color:#e2e8f0 !important;
}

/* =====================================
🔥 TOOL BOX
===================================== */

.tool-box{
  max-width:900px;
  margin:-100px auto 0;
  background:var(--rb-surface);
  padding:35px;
  border-radius:var(--rb-radius-lg);
  box-shadow:var(--rb-shadow-lg);
  border:1px solid var(--rb-border);
  position:relative;
  z-index:10;
}

.tool-box h3{
  font-weight:700;
  margin-bottom:14px;
}

/* INPUT */
.tool-box input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--rb-border);
  margin-bottom:12px;
  transition:.2s;
}

.tool-box input:focus{
  border-color:var(--rb-primary);
  box-shadow:0 0 0 3px rgba(16,185,129,.15);
  outline:none;
}

/* =====================================
🔥 BUTTON (GLOBAL CTA)
===================================== */

.btn-main{
  width:100%;
  padding:14px;
  border:none;
  border-radius:999px;

  background:linear-gradient(135deg,#10b981,#059669);
  color:#fff;

  font-weight:700;
  font-size:15px;

  box-shadow:0 12px 30px rgba(16,185,129,.35);
  cursor:pointer;

  transition:.25s;

  position:relative;
  z-index:2;
}

.btn-main:hover{
  transform:translateY(-2px);
  box-shadow:0 20px 45px rgba(16,185,129,.45);
}

/* =====================================
🔥 KPI GRID
===================================== */

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-top:22px;
}

.kpi{
  background:var(--rb-bg);
  padding:20px;
  border-radius:14px;
  text-align:center;
  border:1px solid var(--rb-border);
  box-shadow:var(--rb-shadow-sm);
}

.kpi div{
  font-size:22px;
  font-weight:700;
}

.kpi small{
  color:var(--rb-muted);
}

/* =====================================
🔥 ALERT
===================================== */

.roi-alert{
  margin-top:15px;
  padding:14px;
  border-radius:10px;
  display:none;
  font-weight:600;
  text-align:center;
}

.roi-bad{
  background:#fee2e2;
  color:#b91c1c;
}

.roi-good{
  background:#dcfce7;
  color:#166534;
}

/* =====================================
🔥 EXTRA BOX
===================================== */

.extra-box{
  display:none;
  margin-top:20px;
  padding:22px;
  border-radius:14px;
  background:linear-gradient(135deg,#111827,#1e293b);
  color:#fff;
  box-shadow:var(--rb-shadow-md);
}

#decision-box{
  display:none;
  margin-top:15px;
  padding:20px;
  border-radius:14px;
  background:#fff;
  border:1px solid var(--rb-border);
  box-shadow:var(--rb-shadow-sm);
}

/* =====================================
🔥 BANK CARDS
===================================== */

#banks{
  margin-top:20px;
}

.bank-card{
  background:#fff;
  padding:22px;
  border-radius:16px;
  margin-top:15px;
  border:1px solid var(--rb-border);
  box-shadow:var(--rb-shadow-sm);
  transition:.25s;
}

.bank-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--rb-shadow-md);
}

.bank-card.best{
  border:2px solid var(--rb-primary);
  background:linear-gradient(to bottom,#f0fdf4,#ffffff);
}

.bank-card h3{
  margin-bottom:6px;
}

.bank-card p{
  color:#334155;
}

.bank-card small{
  color:var(--rb-muted);
}

.bank-card strong{
  color:var(--rb-primary);
}

/* =====================================
🔥 LEAD BOX
===================================== */

.lead-box{
  margin-top:70px;
  padding:45px;
  background:linear-gradient(180deg,#ffffff,#f8fafc);
  border-radius:var(--rb-radius-lg);
  text-align:center;
  box-shadow:var(--rb-shadow-lg);
  border:1px solid var(--rb-border);
}

.lead-box h2{
  font-weight:700;
  margin-bottom:15px;
}

.success-msg{
  display:none;
  margin-top:15px;
  font-weight:600;
  color:var(--rb-primary);
}

/* =====================================
🔥 MODAL FIX (CRITICO CLICK)
===================================== */

#upgrade-modal{
  pointer-events:auto;
  z-index:9999;
}

#upgrade-modal > div{
  position:relative;
  z-index:10000;
}

/* =====================================
🔥 MOBILE
===================================== */

@media(max-width:768px){

  .hero-mutui{
    padding:100px 20px 80px;
  }

  .hero-mutui h1{
    font-size:30px;
  }

  .hero-mutui p{
    font-size:15px;
  }

  .tool-box{
    margin-top:-60px;
    padding:20px;
  }

  .kpi-grid{
    grid-template-columns:1fr;
  }
}

#upgrade-modal{
  pointer-events:auto;
}

#upgrade-modal > div{
  pointer-events:auto;
}

/* 🔥 SBLOCCA CLICK GLOBALI */
button, .btn-main{
  pointer-events:auto !important;
  z-index:10;
}

</style>
</head>

<body>

<div id="global-header"></div>

<section class="hero-mutui">
<h1
data-it="🔥 Il mutuo può farti perdere migliaia di euro"

🔥 Il mutuo può farti perdere migliaia di euro

<p

Simula l’impatto reale su ROI, profitto e rischio in meno di 30 secondi

<div class="container">

<!-- 🔥 EXTRA -->

</div>

<!-- LEAD -->
<div class="lead-box">

<h2 data-it="Ricevi offerte reali"

<input id="email"
placeholder="Email"

<input id="phone"

data-it-placeholder="Telefono"

<button class="btn-main"

data-en="Get offers"

</div>

</div>

<div id="global-footer"></div>

<script src="/js/lang.js" defer></script>
 
<script type="module" src="/js/header.js"></script>
<script src="/js/ui-system.js" defer></script>  
<script src="/js/footer.js" defer></script>

<script>

function getAccess(){

  const plan = String(window.currentPlan || "").toLowerCase();

  return {
    isPro: plan === "pro" || plan === "pro_yearly",
    isInvestor: plan === "investor",
    isLogged: !!window.currentUser
  };

} 

/* ================= LANG ================= */
function t(it,en){
return (window.currentLang === "en") ? en : it;
}

/* ================= CALCOLO ================= */
function calculate(){

console.log("🔥 CALCULATE TRIGGERED");
  
const amount = parseFloat(document.getElementById("amount").value || 200000);
const rate   = parseFloat(document.getElementById("rate").value || 3.5);
const years  = parseFloat(document.getElementById("years").value || 20);
const income = parseFloat(document.getElementById("income").value || 30000);

const monthlyRate = rate/100/12;
const n = years*12;

const monthly = amount * (monthlyRate / (1 - Math.pow(1+monthlyRate,-n)));
const yearly = monthly*12;

const roi = ((income - yearly)/income*100);

/* ===== ALERT ===== */
const alertBox = document.getElementById("roi-alert");
alertBox.style.display="block";

if(roi < 0){
  alertBox.className="roi-alert roi-bad";
  alertBox.innerHTML = t(
  "⚠️ Questo mutuo sta distruggendo il tuo profitto",
  "⚠️ This mortgage is destroying your profit"
);
}else{
  alertBox.className="roi-alert roi-good";
  alertBox.innerHTML = t(
    "✅ Mutuo sostenibile",
    "✅ Sustainable mortgage"
  );
}

/* ===== KPI ===== */
document.getElementById("monthly").innerText = lockValue("€"+monthly.toFixed(0));
document.getElementById("yearly").innerText  = lockValue("€"+yearly.toFixed(0));
document.getElementById("impact").innerText  = lockValue(roi.toFixed(1), "%");

document.querySelector(".lead-box").scrollIntoView({
  behavior:"smooth"
});  

/* ===== EXTRA ===== */
renderExtra(roi, yearly);

// 🔥 FORCE EXTRA VISIBILITY (FIX)
const extraBox = document.getElementById("extra");

if(extraBox){
  extraBox.style.display = "block";
}

/* ===== BANK ===== */
renderBanks(amount);

renderDecision(roi);
  
}

function lockValue(value, suffix=""){

  const access = getAccess();

  // 🔓 PRO vede tutto
  if(access.isPro){
    return value + suffix;
  }

  // 🔥 preview intelligente (conversione)
  const fake = Math.round(value * 0.75);

  return fake + suffix + " 🔒";
}

/* ================= EXTRA ================= */
function renderExtra(roi, yearly){

const extra = document.getElementById("extra");

if(!extra){
  console.error("❌ #extra NON trovato");
  return;
}

extra.innerHTML = ""; // reset sicurezza

const loss = yearly * 0.3;
const access = getAccess();

/* ===== BLOCCO PRINCIPALE LEAD ===== */
extra.innerHTML = `

<div style="
  background:linear-gradient(135deg,#111827,#1e293b);
  color:white;
  padding:18px;
  border-radius:14px;
  text-align:center;
  font-weight:700;
  font-size:16px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
">

  ⚠️ ${
    access.isPro
    ? t("Stai perdendo","You are losing")
    : t("Potresti perdere","You could lose")
  }

  <div style="
    font-size:28px;
    margin:10px 0;
    color:#f87171;
    font-weight:800;
  ">
    ${
  access.isPro
  ? "€"+loss.toFixed(0)+"/anno"
  : "€"+Math.round(loss * 0.7)+"/anno 🔒 (" + t("dato stimato","estimated") + ")"
}
  </div>

  <div style="
    font-size:14px;
    color:#cbd5f5;
    margin-bottom:15px;
    font-weight:500;
  ">
    ${
      t(
        "a causa di un mutuo non ottimizzato",
        "due to a non-optimized mortgage"
      )
    }
  </div>

  ${
    access.isInvestor || access.isPro
    ? `
    <button class="btn-main"
      style="max-width:280px"
      onclick="document.getElementById('banks').scrollIntoView({behavior:'smooth'})">
      🏦 ${t("Contatta banca ORA","Contact bank NOW")}
    </button>
    `
    : `
    <button class="btn-main"
      style="max-width:280px"
      onclick="handleUpgradeClick()">
      🔓 ${t("Sblocca offerte banche","Unlock bank offers")}
    </button>
    `
  }

</div>

`;
}

function renderDecision(roi){

const box = document.getElementById("decision-box");
box.style.display = "block";

let verdict, color;

if(roi < 5){
  verdict = t(
    "❌ NON fare questo mutuo",
    "❌ DO NOT take this mortgage"
  );
  color = "#ef4444";
}
else if(roi < 12){
  verdict = t(
    "⚠️ Operazione rischiosa",
    "⚠️ Risky investment"
  );
  color = "#f59e0b";
}
else{
  verdict = t(
    "✅ Mutuo sostenibile",
    "✅ Sustainable investment"
  );
  color = "#10b981";
}

box.innerHTML = `
<div style="text-align:center;font-weight:700;font-size:18px;color:${color}">
${verdict}
</div>

<div style="margin-top:10px;text-align:center;color:#64748b">
${t(
  "Questa è una valutazione reale basata sui dati inseriti",
  "This is a real evaluation based on your data"
)}
</div>
`;
}  


/* ================= BANCHE ================= */
function renderBanks(amount){

const banks = [
{name:"Intesa Sanpaolo", rate:3.1},
{name:"UniCredit", rate:3.3},
{name:"Credit Agricole", rate:3.4},
{name:"BNL BNP Paribas", rate:3.5},
{name:"Banco BPM", rate:3.7}
];

banks.sort((a,b)=>a.rate-b.rate);

/* HEADER */
let html = "<h3 style='margin-top:40px'>🏦 " +
t("Migliori mutui disponibili","Best mortgage options") +
"</h3>";

/* PAYWALL HEADER */
const access = getAccess();

if(!access.isInvestor && !access.isPro){
  html += `
  <div style="
    background:#111827;
    color:white;
    padding:20px;
    border-radius:14px;
    margin-top:20px;
    text-align:center;
  ">
    🔒 ${t(
      "Le migliori offerte reali sono disponibili nel piano Investor",
      "Real mortgage offers are available in Investor plan"
    )}

    <div style="margin-top:15px;">
      <button class="btn-main"
        style="max-width:280px"
        onclick="handleUpgradeClick()">
        🔓 ${t("Sblocca tutte le offerte","Unlock all offers")}
      </button>

      <div style="margin-top:8px;font-size:13px;color:#9ca3af">
        ${t(
          "Accesso immediato alle migliori banche",
          "Instant access to best banks"
        )}
      </div>
    </div>
  </div>
  `;
}

/* LISTA */
banks.forEach((b,i)=>{

const monthlyRate = b.rate/100/12;
const n = 20*12;
const monthly = amount * (monthlyRate / (1 - Math.pow(1+monthlyRate,-n)));
const yearly = monthly * 12;

const access = getAccess();
const locked = !access.isInvestor && !access.isPro;

html += `
<div class="bank-card ${i===0?"best":""}">

<h3>${b.name}</h3>

<div style="font-size:26px;font-weight:800;color:#10b981">
  ${b.rate}%
</div>

<div style="font-size:13px;color:#64748b;margin-bottom:10px">
  ${t("Tasso fisso medio","Average fixed rate")}
</div>

<div style="font-size:14px;margin-bottom:10px;color:#0f172a">
  ${
    locked
    ? `🔒 ${t("Sblocca per vedere il costo reale","Unlock to see real cost")}`
    : `💸 ${t("Costo annuo","Yearly cost")}: <strong>€${yearly.toFixed(0)}</strong>`
  }
</div>

${i===0 ? `
<div style="
  background:#dcfce7;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
  font-weight:600;
  color:#166534;
">
  ${
    locked
    ? `🔒 ${t("Sblocca per vedere quanto puoi risparmiare","Unlock to see your savings")}`
    : `💰 ${t("Puoi risparmiare fino a","You can save up to")} <strong>€${(yearly*0.15).toFixed(0)}/anno</strong>`
  }

  <div style="margin:15px 0;border-top:1px solid #e2e8f0;"></div>
  <span style="font-size:12px;color:#166534">
    ⏳ ${t("Offerta limitata","Limited offer")}
  </span>
</div>
` : ""}

${
locked
? `
<button class="btn-main"
onclick="handleUpgradeClick()">
${t("Sblocca ora","Unlock now")}
</button>
`
: `
<button class="btn-main"
onclick="selectMortgage(${b.rate}, '${b.name}')">
${t("Seleziona mutuo","Select mortgage")}
</button>
`
}

</div>
`;

});

/* RENDER */
document.getElementById("banks").innerHTML = html;

}

/* ================= NAV ================= */
function goToPricing(){
  window.location.href = "/#pricing";
}

async function startPlanPurchase(plan){

  console.log("🚀 START PURCHASE:", plan);

  const access = getAccess();

  // 🔥 SE INVESTOR → NON deve vedere popup
  if(access.isInvestor){
    alert("Hai già accesso Investor");
    return;
  }

  // 🔥 SE NON LOGGATO → popup
  if(!access.isLogged){

  alert(
    t(
      "🔓 Accedi per sbloccare le offerte reali",
      "🔓 Login to unlock real offers"
    )
  );

  // salva intento (importantissimo per funnel)
  localStorage.setItem("pending_plan", plan);

  window.location.href = "/login/";

  return;
}

  try{

    const res = await fetch("/api/create-checkout-session",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ 
  plan,
  uid: window.currentUser?.uid || null,
  email: window.currentUser?.email || null
})
    });

    const data = await res.json();

    if(data.url){
      window.location.href = data.url;
    }else{
      alert("Errore pagamento (no URL)");
    }

  }catch(e){
    console.error("❌ Checkout error:", e);
    alert("Errore connessione pagamento");
  }
}
  function showUpgradeModal(){
  document.getElementById("upgrade-modal").style.display = "flex";
}

function closeUpgradeModal(){
  document.getElementById("upgrade-modal").style.display = "none";
}
  
/* ================= SELECT ================= */
function selectMortgage(rate, bank){

  const access = getAccess();

  // 🔥 PRO → simulatore
  if(access.isPro){
    localStorage.setItem("mortgage_rate",rate);
    window.location.href="/tool/";
    return;
  }

  // 🔥 INVESTOR → contatto diretto (NO lead interno)
  if(access.isInvestor){

  saveLeadFromBank(bank, rate);

  alert(
    t(
      "🏦 Richiesta inviata. Ti contatterà un consulente mutui.",
      "🏦 Request sent. A mortgage advisor will contact you."
    )
  );

  return;
}

  // 🔥 FREE → lead
  saveLeadFromBank(bank, rate);
}
async function saveLeadFromBank(bank, rate){

  const access = getAccess();


  const email = document.getElementById("email").value || "";
  const phone = document.getElementById("phone").value || "";

  const payload = {
  type:"mutui",
  email,
  phone,
  bank,
  rate,
  source:"bank_click",

  city: window.currentCity || "unknown",
  roi: 0,
  amount: parseFloat(document.getElementById("amount").value || 0),
  years: parseFloat(document.getElementById("years").value || 0),

  plan: window.currentPlan || "free"
};

  if(!email){
  alert("Inserisci email prima");
  return;
}try{

    await fetch("/api/send-lead",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });

    await fetch("/api/send-lead-email",{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body: JSON.stringify({
    email,
    type:"mutui",
    bank,
    rate,
    lang: window.currentLang || "it"
  })
});

    await fetch("/api/send-lead-partner",{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body: JSON.stringify(payload)
});

    alert(
      t(
        "🏦 Ti contatterà un consulente mutui",
        "🏦 A mortgage advisor will contact you"
      )
    );

  }catch(e){
    console.error(e);
  }

}  

function handleUpgradeClick(){

  const access = getAccess();

  if(access.isInvestor){
    alert("Hai già accesso Investor");
    return;
  }

  startPlanPurchase('investor');
}  

/* ================= LEAD ================= */
async function saveLead(){

const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;

if(!email){
alert(t("Inserisci email","Enter email"));
return;
}

const impactEl = document.getElementById("impact");
const roiValue = impactEl && !isNaN(parseFloat(impactEl.innerText))
  ? parseFloat(impactEl.innerText)
  : 0;

const payload = {
