<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title
data-it="Comparatore Mutui – RendimentoBB"
data-en="Mortgage Comparator – RendimentoBB">
Comparatore Mutui – RendimentoBB
</title>

<link rel="stylesheet" href="/css/style.css">

<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon.png">  

</head>

<body>

<div id="global-header"></div>  

<main>

<section class="hero-mutui-premium">

  <div class="hero-overlay"></div>

  <div class="container">

    <div class="hero-content">

      <div class="hero-badge">
        🏦 Mortgage Intelligence Engine
      </div>

      <h1
        data-it="Comparatore Mutui Intelligente"
        data-en="Smart Mortgage Comparator">
        Comparatore Mutui Intelligente
      </h1>

      <p
        data-it="Confronta i migliori mutui e scopri l’impatto reale sul ROI del tuo investimento B&B."
        data-en="Compare the best mortgages and discover real ROI impact.">
        Confronta i migliori mutui e scopri l’impatto reale sul ROI del tuo investimento B&B.
      </p>

      <div class="hero-trust">
        🔥 +1.200 investitori stanno analizzando mutui ora
      </div>

    </div>

  </div>

</section>


<!-- ================= CONTENUTO ================= -->

<div class="container main-spacing">

<!-- ================= TOOL ================= -->

<div id="mortgage" class="tool-card premium-card">

<h3
data-it="🏦 Comparatore Mutui"
data-en="🏦 Mortgage Comparator">
🏦 Comparatore Mutui
</h3>

<p class="tool-sub">
<span data-it="Simula e confronta i mutui in pochi secondi"
      data-en="Simulate and compare mortgages in seconds">
Simula e confronta i mutui in pochi secondi
</span>
</p>

<div class="form-grid">

<div class="input-group">
<label data-it="Importo Mutuo (€)" data-en="Mortgage Amount (€)">
Importo Mutuo (€)
</label>
<input type="number" id="mortgageAmount" placeholder="100000">
</div>

<div class="input-group">
<label data-it="Durata (anni)" data-en="Duration (years)">
Durata (anni)
</label>
<input type="number" id="mortgageYears" value="20">
</div>

<div class="input-group">
<label data-it="Tasso Banca A (%)" data-en="Bank A Rate (%)">
Tasso Banca A (%)
</label>
<input type="number" id="rateA" value="3.2" step="0.1">
</div>

<div class="input-group">
<label data-it="Tasso Banca B (%)" data-en="Bank B Rate (%)">
Tasso Banca B (%)
</label>
<input type="number" id="rateB" value="3.6">
</div>

<div class="input-group">
<label data-it="Tasso Banca C (%)" data-en="Bank C Rate (%)">
Tasso Banca C (%)
</label>
<input type="number" id="rateC" value="4.1">
</div>

</div>

<button onclick="runMortgageComparison()" class="btn premium-btn">
Confronta Mutui
</button>

</div>

<!-- ================= RESULTS ================= -->

<div id="mortgage-results" class="results-spacing"></div>

</div>

</main>

<div id="global-footer"></div>

<!-- ================= SCRIPT ================= -->

<script src="/js/lang.js" defer></script>
<script type="module" src="/js/header.js"></script>
<script src="/js/footer.js" defer></script>

<script type="module" src="/js/mortgage-rates.js"></script>
<script type="module" src="/js/firebase-init.js"></script>
<script type="module" src="/js/app.js"></script>

<script>

function selectMortgage(rate){

const amount = document.getElementById("mortgageAmount")?.value || 0;
const years = document.getElementById("mortgageYears")?.value || 20;

localStorage.setItem("mortgage_rate", rate);
localStorage.setItem("mortgage_amount", amount);
localStorage.setItem("mortgage_years", years);

window.location.href = "/tool/";

}

</script>

</body>
</html>
