<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title data-it="Mutuo B&B – Simulatore ROI + confronto banche"
data-en="B&B Mortgage – ROI simulator + bank comparison">
Mutuo B&B
</title>

<meta name="description"
data-it="Calcola il vero impatto del mutuo sul tuo investimento B&B. Confronta banche reali e scopri se stai perdendo soldi."
data-en="Calculate real mortgage impact on your B&B investment. Compare real banks and avoid losing money.">

<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/favicon.png">

<style>

/* ===== BACKGROUND ===== */
body{
padding-top:60px;
background:
radial-gradient(circle at 20% 20%, rgba(16,185,129,0.08), transparent 40%),
radial-gradient(circle at 80% 80%, rgba(59,130,246,0.08), transparent 40%),
linear-gradient(to bottom,#f8fafc,#e2e8f0);
}

/* ===== HERO ===== */
.hero-mutui{
padding:120px 20px;
text-align:center;
color:white;
background:
linear-gradient(rgba(15,23,42,0.6), rgba(15,23,42,0.8)),
url("/img/milan-bg.jpg") center/cover;
}

.hero-mutui h1{
font-size:44px;
font-weight:800;
}

.hero-mutui p{
color:#cbd5f5;
}

/* ===== TOOL ===== */
.tool-box{
max-width:900px;
margin:-80px auto 0;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 30px 80px rgba(0,0,0,0.1);
}

/* INPUT */
input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #e2e8f0;
margin-bottom:10px;
}

/* BUTTON */
.btn-main{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#10b981,#059669);
color:white;
font-weight:600;
cursor:pointer;
}

/* KPI */
.kpi-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-top:20px;
}

.kpi{
background:#f8fafc;
padding:20px;
border-radius:14px;
text-align:center;
}

/* ALERT */
.roi-alert{
margin-top:20px;
padding:15px;
border-radius:12px;
font-weight:600;
display:none;
}

.roi-bad{background:#fee2e2;color:#b91c1c;}
.roi-good{background:#dcfce7;color:#166534;}

/* BANK */
.bank-card{
background:white;
padding:20px;
border-radius:16px;
margin-top:15px;
border:1px solid #e2e8f0;
}

.bank-card.best{
border:2px solid #10b981;
}

/* LEAD */
.lead-box{
margin-top:60px;
padding:40px;
background:white;
border-radius:20px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,0.08);
}

.success-msg{
color:#10b981;
display:none;
margin-top:10px;
}

</style>

</head>

<body>

<div id="global-header"></div>

<section class="hero-mutui">
<h1 data-it="Il mutuo può distruggere il tuo ROI"
data-en="A mortgage can destroy your ROI">
Mutuo B&B
</h1>

<p data-it="Simula prima di perdere migliaia di euro"
data-en="Simulate before losing thousands of euros">
Analisi reale
</p>
</section>

<div class="container">

<div class="tool-box">

<h3 data-it="Simulatore mutuo" data-en="Mortgage simulator">Simulatore</h3>

<input id="amount" placeholder="€ 200000">
<input id="years" placeholder="20">
<input id="rate" placeholder="3.5%">
<input id="income" placeholder="Ricavi annui (€)">

<button class="btn-main" onclick="calculate()">
Calcola impatto
</button>

<div id="roi-alert" class="roi-alert"></div>

<div class="kpi-grid">
<div class="kpi"><div id="monthly">-</div><small>Monthly</small></div>
<div class="kpi"><div id="yearly">-</div><small>Yearly</small></div>
<div class="kpi"><div id="impact">-</div><small>ROI</small></div>
</div>

</div>

<div id="banks"></div>

<div class="lead-box">

<h2 data-it="Ricevi offerte reali"
data-en="Get real offers">
Offerte mutuo
</h2>

<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefono">

<button class="btn-main" onclick="saveLead()">
Ricevi offerte
</button>

<div id="success" class="success-msg">✔ Lead inviato</div>

</div>

</div>

<div id="global-footer"></div>

<script src="/js/lang.js" defer></script>
<script type="module" src="/js/header.js"></script>
<script src="/js/footer.js" defer></script>

<script>

/* ================= CALCOLO ================= */
function calculate(){

const amount = parseFloat(document.getElementById("amount").value || 200000);
const rate = parseFloat(document.getElementById("rate").value || 3.5);
const years = parseFloat(document.getElementById("years").value || 20);
const income = parseFloat(document.getElementById("income").value || 30000);

const monthlyRate = rate/100/12;
const n = years*12;

const monthly = amount * (monthlyRate / (1 - Math.pow(1+monthlyRate,-n)));
const yearly = monthly*12;

const impact = ((income - yearly)/income*100);

const alertBox = document.getElementById("roi-alert");

/* 🔥 FIX ERROR QUI */
if(impact < 0){
  alertBox.style.display="block";
  alertBox.className="roi-alert roi-bad";
  alertBox.innerHTML = "⚠️ Il mutuo sta distruggendo il tuo ROI";
}else{
  alertBox.style.display="block";
  alertBox.className="roi-alert roi-good";
  alertBox.innerHTML = "✅ Mutuo sostenibile";
}

/* KPI */
document.getElementById("monthly").innerText = "€"+monthly.toFixed(0);
document.getElementById("yearly").innerText = "€"+yearly.toFixed(0);
document.getElementById("impact").innerText = impact.toFixed(1)+"%";

/* BANKS */
renderBanks(amount);

}


/* ================= BANCHE REALI ================= */
function renderBanks(amount){

const banks = [
{name:"Intesa Sanpaolo", rate:3.1},
{name:"UniCredit", rate:3.3},
{name:"BNL BNP Paribas", rate:3.5},
{name:"Banco BPM", rate:3.7},
{name:"Credit Agricole", rate:3.4}
];

banks.sort((a,b)=>a.rate-b.rate);

let html="";

banks.forEach((b,i)=>{

html+=`
<div class="bank-card ${i===0?"best":""}">
<h3>${b.name}</h3>
<p>${b.rate}%</p>

<button class="btn-main" onclick="selectMortgage(${b.rate})">
Usa questo mutuo
</button>
</div>
`;

});

document.getElementById("banks").innerHTML = html;

}


/* ================= SELECT ================= */
function selectMortgage(rate){
localStorage.setItem("mortgage_rate",rate);
window.location.href="/tool/";
}


/* ================= LEAD ================= */
function saveLead(){

const email = document.getElementById("email").value;

if(!email) return;

document.getElementById("success").style.display="block";

console.log("🔥 Lead mutuo:", email);

}

</script>

</body>
</html>
