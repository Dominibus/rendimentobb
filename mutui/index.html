<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title data-it="Mutuo B&B – Simulatore ROI + confronto banche"
data-en="B&B Mortgage – ROI simulator + bank comparison">
Mutuo B&B
</title>

<meta name="description"
data-it="Simula mutuo, ROI e confronta banche. Scopri se stai perdendo soldi."
data-en="Simulate mortgage, ROI and compare banks. Avoid losing money.">

<link rel="stylesheet" href="/css/style.css">

<style>

/* =====================================
🔥 MUTUI – SAAS PRODUCTION FINAL
===================================== */

/* ===== BASE ===== */
body{
  padding-top:60px;
  background:linear-gradient(to bottom,#f8fafc,#e2e8f0);
  font-family:Inter,system-ui;
}

/* ===== HERO ===== */
.hero-mutui{
  position:relative;
  padding:140px 20px 120px;
  text-align:center;

  background:
  linear-gradient(rgba(2,6,23,.75), rgba(2,6,23,.9)),
  url("/img/milan-bg.jpg") center/cover;

  overflow:hidden;
}

/* glow effect */
.hero-mutui::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at center, rgba(16,185,129,0.15), transparent 70%);
  pointer-events:none;
}

/* FIX globale override */
.hero-mutui h1,
.hero-mutui p{
  color:white !important;
  position:relative;
  z-index:2;
}

/* titolo */
.hero-mutui h1{
  font-size:42px;
  font-weight:800;
  margin-bottom:15px;
  text-shadow:0 5px 25px rgba(0,0,0,.6);
}

/* sottotitolo */
.hero-mutui p{
  font-size:18px;
  opacity:.95;
  text-shadow:0 3px 15px rgba(0,0,0,.5);
}

/* ===== TOOL BOX ===== */
.tool-box{
  max-width:900px;
  margin:-100px auto 0;

  background:white;
  padding:35px;

  border-radius:20px;

  box-shadow:
  0 40px 100px rgba(2,6,23,.15),
  0 10px 30px rgba(2,6,23,.08);

  position:relative;
  z-index:10;
}

/* ===== INPUT ===== */
.tool-box input{
  width:100%;
  padding:14px;

  border-radius:12px;
  border:1px solid #e2e8f0;

  background:white;
  margin-bottom:12px;

  transition:all .2s ease;
}

.tool-box input:focus{
  border-color:#10b981;
  outline:none;
  box-shadow:0 0 0 3px rgba(16,185,129,.15);
}

/* ===== BUTTON ===== */
.btn-main{
  width:100%;
  padding:14px;

  border:none;
  border-radius:12px;

  background:linear-gradient(135deg,#10b981,#059669);
  color:white;

  font-weight:700;
  letter-spacing:.3px;

  box-shadow:0 10px 25px rgba(16,185,129,.3);
  cursor:pointer;

  transition:all .25s ease;
}

.btn-main:hover{
  transform:translateY(-2px);
  box-shadow:0 15px 35px rgba(16,185,129,.4);
}

/* ===== ALERT ===== */
.roi-alert{
  margin-top:15px;
  padding:14px;
  border-radius:10px;

  display:none;
  font-weight:600;
  text-align:center;
}

.roi-bad{
  background:#fee2e2;
  color:#b91c1c;
}

.roi-good{
  background:#dcfce7;
  color:#166534;
}

/* ===== KPI ===== */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:20px;
}

.kpi{
  background:white;
  padding:20px;

  border-radius:14px;
  text-align:center;

  border:1px solid #e2e8f0;
  box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.kpi div{
  font-size:20px;
  font-weight:700;
  color:#0f172a;
}

/* ===== EXTRA ===== */
.extra-box{
  margin-top:20px;
  padding:20px;

  border-radius:14px;
  background:#f1f5f9;

  border:1px solid #e2e8f0;
}

/* ===== BANCHE ===== */
.bank-card{
  background:white;
  padding:20px;

  border-radius:16px;
  margin-top:15px;

  border:1px solid #e2e8f0;
  box-shadow:0 10px 25px rgba(0,0,0,.05);

  transition:all .25s ease;
}

.bank-card:hover{
  transform:translateY(-3px);
  box-shadow:0 20px 40px rgba(0,0,0,.1);
}

.bank-card.best{
  border:2px solid #10b981;
  box-shadow:0 15px 35px rgba(16,185,129,.2);
}

 /* =====================================
🔥 FIX CONTRASTO MUTUI (CRITICO)
===================================== */

/* TOOL BOX TEXT */
.tool-box h1,
.tool-box h2,
.tool-box h3,
.tool-box p,
.tool-box small,
.tool-box div{
  color:#0f172a !important;
}

/* INPUT TEXT */
.tool-box input{
  color:#0f172a !important;
}

/* EXTRA BOX */
.extra-box{
  color:#0f172a !important;
}

/* KPI LABEL */
.kpi small{
  color:#64748b !important;
}

/* =====================
🏦 BANK CARDS FIX
===================== */

.bank-card h3{
  color:#0f172a !important;
}

.bank-card p{
  color:#0f172a !important;
}

.bank-card{
  color:#0f172a !important;
}

/* BEST CARD */
.bank-card.best{
  background:#f0fdf4;
}

/* =====================
🔥 LEAD BOX
===================== */

.lead-box input{
  color:#0f172a !important;
}

.lead-box{
  color:#0f172a !important;
}

/* =====================
🔥 DECISION BOX
===================== */

#decision-box{
  background:white;
  border:1px solid #e2e8f0;
  color:#0f172a;
}

/* =====================
🔥 TITOLI GENERICI FIX
===================== */

.container h1,
.container h2,
.container h3{
  color:#0f172a !important;
}  

/* ===== LEAD BOX ===== */
.lead-box{
  margin-top:60px;
  padding:45px;

  background:linear-gradient(180deg,#ffffff,#f8fafc);

  border-radius:20px;
  text-align:center;

  box-shadow:
  0 30px 80px rgba(2,6,23,.12);

  border:1px solid #e2e8f0;
}

/* titolo lead */
.lead-box h2{
  color:#0f172a !important;
  font-weight:700;
  margin-bottom:15px;
}

/* messaggio successo */
.success-msg{
  color:#10b981;
  display:none;
  margin-top:15px;
  font-weight:600;
}

.bank-card.locked{
  opacity:0.6;
  filter:blur(2px);
  pointer-events:none;
  position:relative;
}

.bank-card.locked::after{
  content:"🔒 PRO";
  position:absolute;
  top:10px;
  right:10px;
  background:#ef4444;
  color:white;
  font-size:12px;
  padding:4px 8px;
  border-radius:8px;
}  

/* ===== MOBILE ===== */
@media(max-width:768px){

  .hero-mutui{
    padding:100px 20px 80px;
  }

  .hero-mutui h1{
    font-size:28px;
  }

  .hero-mutui p{
    font-size:15px;
  }

  .tool-box{
    margin-top:-60px;
    padding:20px;
  }

  .kpi-grid{
    grid-template-columns:1fr;
  }

  .btn-main{
    width:100%;
  }
}
</style>
</head>

<body>

<div id="global-header"></div>

<section class="hero-mutui">
<h1
data-it="🔥 Il mutuo può farti perdere migliaia di euro"
data-en="🔥 A mortgage can make you lose thousands of euros">
🔥 Il mutuo può farti perdere migliaia di euro
</h1>

<p
data-it="Simula l’impatto reale su ROI, profitto e rischio in meno di 30 secondi"
data-en="Simulate the real impact on ROI, profit and risk in under 30 seconds">
Simula l’impatto reale su ROI, profitto e rischio in meno di 30 secondi
</p>
</section>

<div class="container">

<div class="tool-box">

<h3 data-it="Simulatore mutuo" data-en="Mortgage simulator"></h3>

<input id="amount" placeholder="€ 200000">
<input id="years" placeholder="20">
<input id="rate" placeholder="3.5%">
<input id="income" placeholder="Ricavi annui">

<button class="btn-main"
data-it="Calcola impatto"
data-en="Calculate impact"
onclick="calculate()"></button>

<div id="roi-alert" class="roi-alert"></div>

<div class="kpi-grid">
<div class="kpi"><div id="monthly">-</div><small data-it="Rata mensile" data-en="Monthly payment">Rata mensile</small></div>
<div class="kpi"><div id="yearly">-</div><small data-it="Costo annuo mutuo" data-en="Yearly mortgage cost">Costo annuo mutuo</small></div>
<div class="kpi"><div id="impact">-</div><small data-it="Impatto ROI" data-en="ROI impact">Impatto ROI</small></div>
</div>

<!-- 🔥 EXTRA -->
<div id="extra" class="extra-box"></div>
<div id="decision-box" class="extra-box" style="display:none;"></div>
  
</div>

<div id="banks"></div>

<!-- LEAD -->
<div class="lead-box">

<h2 data-it="Ricevi offerte reali"
data-en="Get real offers"></h2>

<input id="email"
placeholder="Email"
data-it-placeholder="Email"
data-en-placeholder="Email">

<input id="phone"
placeholder="Telefono"
data-it-placeholder="Telefono"
data-en-placeholder="Phone">

<button class="btn-main"
data-it="Ricevi offerte"
data-en="Get offers"
onclick="saveLead()"></button>

<div id="success" class="success-msg"
data-it="✔ Richiesta inviata"
data-en="✔ Request sent">
✔ Richiesta inviata
</div>

</div>

</div>

<div id="global-footer"></div>

<script src="/js/lang.js" defer></script>
<script type="module" src="/js/header.js"></script>
<script src="/js/ui-system.js" defer></script>  
<script src="/js/footer.js" defer></script>

<script>

function isProUser(){
  return ["investor","pro","pro_yearly"].includes(window.currentPlan);
}  

/* ================= LANG ================= */
function t(it,en){
return (window.currentLang === "en") ? en : it;
}

/* ================= CALCOLO ================= */
function calculate(){

const amount = parseFloat(document.getElementById("amount").value || 200000);
const rate   = parseFloat(document.getElementById("rate").value || 3.5);
const years  = parseFloat(document.getElementById("years").value || 20);
const income = parseFloat(document.getElementById("income").value || 30000);

const monthlyRate = rate/100/12;
const n = years*12;

const monthly = amount * (monthlyRate / (1 - Math.pow(1+monthlyRate,-n)));
const yearly  = monthly*12;

const roi = ((income - yearly)/income*100);

/* ===== ALERT ===== */
const alertBox = document.getElementById("roi-alert");
alertBox.style.display="block";

if(roi < 0){
  alertBox.className="roi-alert roi-bad";
  alertBox.innerHTML = t(
  "⚠️ Questo mutuo sta distruggendo il tuo profitto",
  "⚠️ This mortgage is destroying your profit"
);
}else{
  alertBox.className="roi-alert roi-good";
  alertBox.innerHTML = t(
    "✅ Mutuo sostenibile",
    "✅ Sustainable mortgage"
  );
}

/* ===== KPI ===== */
document.getElementById("monthly").innerText = "€"+monthly.toFixed(0);
document.getElementById("yearly").innerText  = "€"+yearly.toFixed(0);
document.getElementById("impact").innerText  = roi.toFixed(1)+"%";

document.querySelector(".lead-box").scrollIntoView({
  behavior:"smooth"
});  

/* ===== EXTRA ===== */
renderExtra(roi, yearly);

/* ===== BANK ===== */
renderBanks(amount);

renderDecision(roi);
  
}


/* ================= EXTRA ================= */
function renderExtra(roi, yearly){

const extra = document.getElementById("extra");

let score = "C";
if(roi > 15) score = "A";
else if(roi > 8) score = "B";

const loss = yearly * 0.3;

const risk =
roi < 5 ? t("ALTO","HIGH") :
roi < 15 ? t("MEDIO","MEDIUM") :
t("BASSO","LOW");

extra.innerHTML = `

<div style="font-weight:700;margin-bottom:10px;">
🔥 ${t("Punteggio investimento","Investment Score")}: ${score}
</div>

<div style="
background:#fee2e2;
padding:12px;
border-radius:10px;
margin-top:10px;
font-weight:600;
color:#b91c1c;
">
⚠️ ${t("Stai perdendo circa","You are losing about")}
<strong>€${loss.toFixed(0)}/anno</strong>
</div>

<br>

<div>
💰 ${t("Costo reale mutuo","Real mortgage cost")}:
€${yearly.toFixed(0)}
</div>

<br>

<div>
📊 ${t("Rischio investimento","Investment risk")}:
<strong>${risk}</strong>
</div>

`;
}

function renderDecision(roi){

const box = document.getElementById("decision-box");
box.style.display = "block";

let verdict, color;

if(roi < 5){
  verdict = t(
    "❌ NON fare questo mutuo",
    "❌ DO NOT take this mortgage"
  );
  color = "#ef4444";
}
else if(roi < 12){
  verdict = t(
    "⚠️ Operazione rischiosa",
    "⚠️ Risky investment"
  );
  color = "#f59e0b";
}
else{
  verdict = t(
    "✅ Mutuo sostenibile",
    "✅ Sustainable investment"
  );
  color = "#10b981";
}

box.innerHTML = `
<div style="text-align:center;font-weight:700;font-size:18px;color:${color}">
${verdict}
</div>

<div style="margin-top:10px;text-align:center;color:#64748b">
${t(
  "Questa è una valutazione reale basata sui dati inseriti",
  "This is a real evaluation based on your data"
)}
</div>
`;
}  


/* ================= BANCHE ================= */
function renderBanks(amount){

const banks = [
{name:"Intesa Sanpaolo", rate:3.1},
{name:"UniCredit", rate:3.3},
{name:"Credit Agricole", rate:3.4},
{name:"BNL BNP Paribas", rate:3.5},
{name:"Banco BPM", rate:3.7}
];

banks.sort((a,b)=>a.rate-b.rate);

/* 🔥 INIT HTML */
let html = "<h3 style='margin-top:40px'>🏦 " +
t("Migliori mutui disponibili","Best mortgage options") +
"</h3>";

/* 🔒 BLOCCO PAYWALL (QUI GIUSTO) */
if(!isProUser()){
  html += `
  <div style="
    background:#111827;
    color:white;
    padding:20px;
    border-radius:14px;
    margin-top:20px;
    text-align:center;
  ">
    🔒 ${t(
      "Le migliori offerte reali sono disponibili nel piano Investor",
      "Real mortgage offers are available in Investor plan"
    )}
  </div>
  `;
}

/* 🔥 LISTA BANCHE */
banks.forEach((b,i)=>{

const locked = !isProUser() && i > 0;

html+=`
<div class="bank-card ${i===0?"best":""} ${locked?"locked":""}">

<h3>${b.name}</h3>

<div style="font-size:26px;font-weight:800;color:#10b981">
  ${b.rate}%
</div>

<div style="font-size:13px;color:#64748b;margin-bottom:10px">
  ${t("Tasso fisso medio","Average fixed rate")}
</div>

${i===0 ? `
<div style="color:#10b981;font-weight:600">
🔥 ${t("Migliore offerta","Best offer")}
</div>
` : ""}

${
locked
? `
<div style="margin-top:10px;color:#ef4444;font-weight:600">
🔒 ${t("Sblocca per vedere tutte le offerte","Unlock to see all offers")}
</div>

<button class="btn-main"
onclick="startPlanPurchase('investor')">
${t("Sblocca ora","Unlock now")}
</button>
`
: `
<button class="btn-main"
onclick="selectMortgage(${b.rate}, '${b.name}')">
${t("Seleziona mutuo","Select mortgage")}
</button>
`
}

</div>
`;
});

/* 🔥 RENDER */
document.getElementById("banks").innerHTML = html;

}
function goToPricing(){
  window.location.href = "/#pricing";
}  

/* ================= SELECT ================= */
function selectMortgage(rate, bank){

localStorage.setItem("mortgage_rate",rate);

/* 🔥 FUTURO: redirect partner */
console.log("🏦 Selected bank:", bank);

window.location.href="/tool/";

}


/* ================= LEAD ================= */
async function saveLead(){

const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;

if(!email){
alert(t("Inserisci email","Enter email"));
return;
}

const impactEl = document.getElementById("impact");
const roiValue = impactEl && !isNaN(parseFloat(impactEl.innerText))
  ? parseFloat(impactEl.innerText)
  : 0;

const payload = {
  type:"mutui",
  email,
  phone,
  city: window.currentCity || "unknown",
  roi: roiValue,
  amount: parseFloat(document.getElementById("amount").value || 0),
  years: parseFloat(document.getElementById("years").value || 0),
  plan: window.currentPlan || "free"
};

try{

/* 🔥 SAVE DB */
const res = await fetch("/api/send-lead",{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body: JSON.stringify(payload)
});

/* 🔥 EMAIL UTENTE (MANCAVA!) */
await fetch("/api/send-lead-email",{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body: JSON.stringify({
    email,
    type:"mutui",
    roi: roiValue,
    amount: payload.amount,
    years: payload.years,
    lang: window.currentLang || "it"
  })
});

/* 🔥 FOLLOWUP */
setTimeout(()=>{
  fetch("/api/send-followup",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      email,
      step:2,
      lang: window.currentLang || "it"
    })
  });
},60000);

const data = await res.json();

console.log("🔥 Lead sent:", data);

/* UI WOW */
const success = document.getElementById("success");
success.style.display="block";

success.innerHTML = `
✔ ${t("Richiesta inviata","Request sent")}
<br>
🔥 ${t("Ti abbiamo inviato le migliori offerte","We sent you the best offers")}
<br>
💰 €${data.value || 0}
`;

}catch(e){
console.error("❌ Lead error:", e);
alert("Errore invio");
}

}

</script>

</body>
</html>
