<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mutuo B&B – Simulazione e confronto</title>

<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/favicon.png">

<style>

/* ===== HERO ===== */
.hero-mutui{
padding:120px 20px 100px;
text-align:center;
color:white;
background:
linear-gradient(rgba(2,6,23,0.6), rgba(2,6,23,0.8)),
url("/img/milan-bg.jpg") center/cover;
}

.hero-mutui h1{
font-size:46px;
font-weight:800;
}

.hero-mutui p{
color:#e2e8f0;
margin-top:10px;
}

/* ===== CARD ===== */
.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 20px 60px rgba(0,0,0,0.08);
}

/* ===== TOOL ===== */
.tool-card{
margin-top:-60px;
}

/* ===== INPUT ===== */
input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #e2e8f0;
margin-bottom:10px;
}

/* ===== BUTTON ===== */
.btn-main{
background:linear-gradient(135deg,#10b981,#059669);
color:white;
padding:14px 20px;
border-radius:10px;
font-weight:600;
cursor:pointer;
}

/* ===== LEAD BOX ===== */
.lead-box{
margin-top:50px;
padding:50px;
border-radius:20px;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
text-align:center;
}

.success-msg{
margin-top:15px;
color:#10b981;
display:none;
}

/* ===== RESULT ===== */
.mortgage-result{
background:white;
padding:20px;
border-radius:14px;
margin-top:15px;
border:1px solid #e2e8f0;
}

.best{
border:2px solid #10b981;
}

</style>

</head>

<body>

<div id="global-header"></div>

<main>

<!-- HERO -->
<section class="hero-mutui">

<h1>Mutuo B&B: conviene davvero?</h1>
<p>Il 68% degli investimenti con mutuo è in perdita</p>

</section>

<div class="container">

<!-- TOOL -->
<div class="card tool-card">

<h3>🏦 Comparatore Mutui</h3>

<input id="mortgageAmount" placeholder="Importo (€)">
<input id="mortgageYears" value="20">
<input id="rateA" value="3.2">
<input id="rateB" value="3.6">
<input id="rateC" value="4.1">

<button onclick="runMortgageComparison()" class="btn-main">
Confronta mutui
</button>

</div>

<!-- RESULTS -->
<div id="mortgage-results"></div>

<!-- 🔥 LEAD -->
<div class="lead-box">

<h2>Ricevi le migliori offerte mutuo</h2>

<input id="leadEmail" placeholder="Inserisci email">

<button onclick="saveLead()" class="btn-main">
Ricevi offerte
</button>

<div id="successMsg" class="success-msg">
✅ Richiesta inviata! Ti contatteremo presto
</div>

</div>

</div>

</main>

<div id="global-footer"></div>

<script src="/js/lang.js" defer></script>
<script type="module" src="/js/header.js"></script>
<script src="/js/footer.js" defer></script>

<!-- FIREBASE -->
<script type="module">

import { db } from "/js/firebase-init.js";
import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

/* ===== SAVE LEAD ===== */
window.saveLead = async function(){

const email = document.getElementById("leadEmail").value;

if(!email || !email.includes("@")){
alert("Inserisci email valida");
return;
}

try{

await addDoc(collection(db,"leads_mutui"),{
email:email,
created:serverTimestamp(),
source:"mutui_page"
});

document.getElementById("successMsg").style.display="block";
document.getElementById("leadEmail").value="";

}catch(e){
console.error(e);
alert("Errore salvataggio");
}

};

</script>

<script>

/* ===== COMPARISON ===== */
function runMortgageComparison(){

const amount = parseFloat(document.getElementById("mortgageAmount").value || 100000);

const rates = [
{name:"Banca A", rate:parseFloat(rateA.value)},
{name:"Banca B", rate:parseFloat(rateB.value)},
{name:"Banca C", rate:parseFloat(rateC.value)}
];

let html = "";

rates.forEach((bank,i)=>{

const yearly = amount * (bank.rate/100);

html += `
<div class="mortgage-result ${i===0 ? "best":""}">
<h3>${bank.name}</h3>
<p>Tasso: ${bank.rate}%</p>
<p>Costo annuo: €${yearly.toFixed(0)}</p>
<button onclick="selectMortgage(${bank.rate})" class="btn-main">
Usa questo mutuo
</button>
</div>
`;

});

document.getElementById("mortgage-results").innerHTML = html;

}

function selectMortgage(rate){
localStorage.setItem("mortgage_rate", rate);
window.location.href = "/tool/";
}

</script>

</body>
</html>
