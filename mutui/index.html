<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title
data-it="Comparatore Mutui – RendimentoBB"
data-en="Mortgage Comparator – RendimentoBB">
Comparatore Mutui – RendimentoBB
</title>

<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon.png">  

</head>

<body>

<div id="global-header"></div>  

<main>

<div class="container" style="padding-top:80px;padding-bottom:120px;">


<h1 
data-it="Comparatore Mutui"
data-en="Mortgage Comparator"
style="text-align:center;margin-bottom:40px;">
Comparatore Mutui
</h1>


<!-- MORTGAGE COMPARATOR -->

<div id="mortgage" class="tool-card">

<h3
data-it="🏦 Comparatore Mutui"
data-en="🏦 Mortgage Comparator">
🏦 Comparatore Mutui
</h3>

<div class="form-grid">

<div class="input-group">
<label
data-it="Importo Mutuo (€)"
data-en="Mortgage Amount (€)">
Importo Mutuo (€)
</label>
<input type="number" id="mortgageAmount"
data-placeholder-it="Inserisci importo"
data-placeholder-en="Enter amount">
</div>

<div class="input-group">
<label
data-it="Durata (anni)"
data-en="Duration (years)">
Durata (anni)
</label>
<input type="number" id="mortgageYears" value="20"
data-placeholder-it="Durata in anni"
data-placeholder-en="Duration in years">
</div>

<div class="input-group">
<label
data-it="Tasso Banca A (%)"
data-en="Bank A Rate (%)">
Tasso Banca A (%)
</label>
<input type="number" id="rateA" value="3.2" step="0.1"
data-placeholder-it="Tasso banca A"
data-placeholder-en="Bank A rate">
</div>

<div class="input-group">
<label
data-it="Tasso Banca B (%)"
data-en="Bank B Rate (%)">
Tasso Banca B (%)
</label>
<input type="number" id="rateB" value="3.6"
data-placeholder-it="Tasso banca B"
data-placeholder-en="Bank B rate">
</div>

<div class="input-group">
<label
data-it="Tasso Banca C (%)"
data-en="Bank C Rate (%)">
Tasso Banca C (%)
</label>
<input type="number" id="rateC" value="4.1"
data-placeholder-it="Tasso banca C"
data-placeholder-en="Bank C rate">
</div>

</div>


<button onclick="compareMortgages()" class="btn btn-primary"
data-it="Confronta Mutui"
data-en="Compare Mortgages">
Confronta Mutui
</button>
</div>

<div id="mortgage-results" style="margin-top:40px;"></div>

</div>

</div>

</main>

<script src="/js/lang.js" defer></script>
<script type="module" src="/js/header.js"></script>
<script src="/js/footer.js" defer></script>

<script type="module" src="/js/mortgage-rates.js"></script>

<script type="module" src="/js/firebase-init.js"></script>
<script type="module" src="/js/app.js"></script> 

</body>
</html>
