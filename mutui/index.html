<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title
data-it="Mutuo B&B – Simulatore e confronto banche Italia"
data-en="B&B Mortgage – Compare Italian banks and simulate ROI impact">
Mutuo B&B – Simulatore
</title>

<meta name="description"
data-it="Confronta mutui reali per investimenti B&B. Calcola costi, impatto sul ROI e trova le migliori banche in Italia."
data-en="Compare real mortgages for B&B investments. Calculate costs, ROI impact and find the best banks in Italy.">

<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/favicon.png">

<style>

/* ===== HERO ===== */
.hero-mutui{
padding:120px 20px 100px;
text-align:center;
color:white;
background:
linear-gradient(rgba(15,23,42,0.7), rgba(15,23,42,0.85)),
url("/img/milan-bg.jpg") center/cover;
}

.hero-mutui h1{
font-size:42px;
font-weight:800;
}

.hero-mutui p{
color:#cbd5f5;
margin-top:10px;
}

/* ===== CARD ===== */
.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 20px 60px rgba(0,0,0,0.08);
}

.tool-card{
margin-top:-60px;
}

/* ===== INPUT ===== */
input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #e2e8f0;
margin-bottom:10px;
}

/* ===== BUTTON ===== */
.btn-main{
background:linear-gradient(135deg,#10b981,#059669);
color:white;
padding:14px 20px;
border-radius:10px;
font-weight:600;
cursor:pointer;
border:none;
width:100%;
}

/* ===== RESULT ===== */
.mortgage-result{
background:white;
padding:20px;
border-radius:14px;
margin-top:15px;
border:1px solid #e2e8f0;
transition:0.3s;
}

.mortgage-result:hover{
transform:translateY(-3px);
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.best{
border:2px solid #10b981;
}

/* ===== LEAD ===== */
.lead-box{
margin-top:60px;
padding:50px;
border-radius:20px;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
text-align:center;
}

.success-msg{
margin-top:15px;
color:#10b981;
display:none;
}

</style>

</head>

<body>

<div id="global-header"></div>

<main>

<!-- HERO -->
<section class="hero-mutui">
<h1
data-it="Mutuo B&B: quanto incide davvero?"
data-en="Mortgage impact on your B&B investment">
Mutuo B&B
</h1>

<p
data-it="Il mutuo può distruggere o moltiplicare il tuo ROI"
data-en="A mortgage can destroy or multiply your ROI">
Analizza prima di investire
</p>
</section>

<div class="container">

<!-- TOOL -->
<div class="card tool-card">

<h3
data-it="🏦 Comparatore mutui reali"
data-en="🏦 Real mortgage comparison">
Comparatore mutui
</h3>

<input id="mortgageAmount"
data-it-placeholder="Importo mutuo (€)"
data-en-placeholder="Loan amount (€)">

<input id="mortgageYears" value="20"
data-it-placeholder="Durata (anni)"
data-en-placeholder="Years">

<button onclick="runMortgageComparison()" class="btn-main"
data-it="Confronta mutui"
data-en="Compare mortgages">
Confronta mutui
</button>

</div>

<!-- RESULTS -->
<div id="mortgage-results"></div>

<!-- LEAD -->
<div class="lead-box">

<h2
data-it="Ricevi le migliori offerte mutuo"
data-en="Get the best mortgage offers">
Offerte mutuo
</h2>

<p
data-it="Broker e banche ti contatteranno con offerte reali"
data-en="Top brokers and banks will contact you with real offers"
style="color:#94a3b8;margin-bottom:20px;">
Lead
</p>

<input id="leadEmail"
data-it-placeholder="Inserisci email"
data-en-placeholder="Enter email">

<input id="leadPhone"
data-it-placeholder="Telefono (opzionale)"
data-en-placeholder="Phone (optional)">

<button onclick="saveLead()" class="btn-main"
data-it="Ricevi offerte personalizzate"
data-en="Get personalized offers">
Ricevi offerte
</button>

<div id="successMsg" class="success-msg">
✅ OK
</div>

</div>

</div>

</main>

<div id="global-footer"></div>

<script src="/js/lang.js" defer></script>
<script type="module" src="/js/header.js"></script>
<script src="/js/footer.js" defer></script>

<script type="module">

import { saveLeadMutui } from "/js/leads.js";

window.saveLead = async function(){

const email = leadEmail.value.trim();

if(!email.includes("@")){
alert(window.currentLang==="en" ? "Enter valid email" : "Inserisci email valida");
return;
}

await saveLeadMutui({
email,
phone: leadPhone.value,
amount: mortgageAmount.value,
years: mortgageYears.value
});

successMsg.style.display="block";

};

</script>

<script>

function runMortgageComparison(){

const amount = parseFloat(mortgageAmount.value || 100000);

const banks = [
{name:"Intesa Sanpaolo", rate:3.1},
{name:"UniCredit", rate:3.4},
{name:"BNL BNP Paribas", rate:3.6},
{name:"Banco BPM", rate:3.8},
{name:"Credit Agricole", rate:4.0}
];

banks.sort((a,b)=>a.rate-b.rate);

let html="";

banks.forEach((bank,i)=>{

const yearly = amount * (bank.rate/100);

html+=`
<div class="mortgage-result ${i===0?"best":""}">
<h3>${bank.name}</h3>

<p>${window.currentLang==="en"?"Rate":"Tasso"}: ${bank.rate}%</p>

<p>${window.currentLang==="en"?"Yearly cost":"Costo annuo"}: €${yearly.toFixed(0)}</p>

<button onclick="selectMortgage(${bank.rate})" class="btn-main">
${window.currentLang==="en"?"Use this mortgage":"Usa questo mutuo"}
</button>

</div>
`;

});

document.getElementById("mortgage-results").innerHTML = html;

}

function selectMortgage(rate){
localStorage.setItem("mortgage_rate", rate);
window.location.href="/tool/";
}

</script>

</body>
</html>
