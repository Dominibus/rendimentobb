<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title
data-it="Mutuo B&B – Simulatore ROI + confronto banche"
data-en="B&B Mortgage – ROI simulator + bank comparison">
Mutuo B&B
</title>

<meta name="description"
data-it="Calcola il vero impatto del mutuo sul tuo investimento B&B. Simula rata, ROI e confronta le migliori banche."
data-en="Calculate the real impact of a mortgage on your B&B investment. Simulate payments, ROI and compare banks.">

<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/img/favicon.png">

<style>

/* ===== HERO ===== */
.hero-mutui{
padding:120px 20px 100px;
text-align:center;
color:white;
background:
linear-gradient(rgba(15,23,42,0.75), rgba(15,23,42,0.9)),
url("/img/milan-bg.jpg") center/cover;
}

.hero-mutui h1{
font-size:46px;
font-weight:800;
}

.hero-mutui p{
color:#cbd5f5;
margin-top:10px;
}

/* ===== CARD TOOL ===== */
.tool-box{
max-width:900px;
margin:-80px auto 0;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 20px 60px rgba(0,0,0,0.1);
}

/* ===== GRID ===== */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #e2e8f0;
}

/* ===== BTN ===== */
.btn-main{
margin-top:10px;
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#10b981,#059669);
color:white;
font-weight:600;
cursor:pointer;
}

/* ===== KPI ===== */
.kpi-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-top:20px;
}

.kpi{
background:#f8fafc;
padding:15px;
border-radius:12px;
text-align:center;
}

/* ===== RESULTS ===== */
.bank-card{
background:white;
border:1px solid #e2e8f0;
padding:20px;
border-radius:16px;
margin-top:15px;
transition:.3s;
}

.bank-card.best{
border:2px solid #10b981;
}

/* ===== LEAD ===== */
.lead-box{
margin-top:60px;
padding:50px;
border-radius:20px;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
text-align:center;
}

.success-msg{
color:#10b981;
margin-top:10px;
display:none;
}

</style>

</head>

<body>

<div id="global-header"></div>

<main>

<!-- HERO -->
<section class="hero-mutui">
<h1
data-it="Il mutuo può distruggere il tuo ROI"
data-en="A mortgage can destroy your ROI">
Mutuo B&B
</h1>

<p
data-it="Simula prima di perdere migliaia di euro"
data-en="Simulate before losing thousands of euros">
Analisi reale
</p>
</section>

<div class="container">

<!-- TOOL -->
<div class="tool-box">

<h3 data-it="Simulatore mutuo" data-en="Mortgage simulator">Simulatore</h3>

<div class="grid">
<input id="amount" placeholder="€ 200000">
<input id="years" placeholder="20">

<input id="rate" placeholder="3.5%">
<input id="income" placeholder="Ricavi annui (€)">
</div>

<button class="btn-main" onclick="calculate()"
data-it="Calcola impatto"
data-en="Calculate impact">
Calcola
</button>

<!-- KPI -->
<div class="kpi-grid">
<div class="kpi">
<div id="monthly">-</div>
<small data-it="Rata mensile" data-en="Monthly payment">Rata</small>
</div>

<div class="kpi">
<div id="yearly">-</div>
<small data-it="Costo annuo" data-en="Yearly cost">Costo</small>
</div>

<div class="kpi">
<div id="impact">-</div>
<small data-it="Impatto su ROI" data-en="ROI impact">ROI</small>
</div>
</div>

</div>

<!-- BANKS -->
<div id="banks"></div>

<!-- LEAD -->
<div class="lead-box">

<h2
data-it="Ricevi offerte mutuo reali"
data-en="Get real mortgage offers">
Lead
</h2>

<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefono">

<button onclick="saveLead()" class="btn-main"
data-it="Ricevi offerte"
data-en="Get offers">
Invia
</button>

<div id="success" class="success-msg">
OK
</div>

</div>

</div>

</main>

<div id="global-footer"></div>

<script src="/js/lang.js" defer></script>
<script type="module" src="/js/header.js"></script>
<script src="/js/footer.js" defer></script>

<script>

function calculate(){

const amount = parseFloat(amountInput());
const rate = parseFloat(rateInput());
const years = parseFloat(document.getElementById("years").value || 20);
const income = parseFloat(document.getElementById("income").value || 30000);

const monthlyRate = rate/100/12;
const n = years*12;

const monthly = amount * (monthlyRate / (1 - Math.pow(1+monthlyRate,-n)));
const yearly = monthly*12;

const impact = ((income - yearly)/income*100).toFixed(1);

document.getElementById("monthly").innerText = "€"+monthly.toFixed(0);
document.getElementById("yearly").innerText = "€"+yearly.toFixed(0);
document.getElementById("impact").innerText = impact+"%";

renderBanks(amount);

}

function amountInput(){
return document.getElementById("amount").value || 200000;
}

function rateInput(){
return document.getElementById("rate").value || 3.5;
}

function renderBanks(amount){

const banks = [
{name:"Intesa Sanpaolo", rate:3.1},
{name:"UniCredit", rate:3.4},
{name:"BNL BNP", rate:3.6},
{name:"Banco BPM", rate:3.8}
];

banks.sort((a,b)=>a.rate-b.rate);

let html="";

banks.forEach((b,i)=>{

const yearly = amount * (b.rate/100);

html+=`
<div class="bank-card ${i===0?"best":""}">
<h3>${b.name}</h3>
<p>${b.rate}%</p>
<p>€${yearly.toFixed(0)}/anno</p>

<button class="btn-main" onclick="selectMortgage(${b.rate})">
${window.currentLang==="en"?"Use mortgage":"Usa mutuo"}
</button>
</div>
`;

});

document.getElementById("banks").innerHTML=html;

}

function selectMortgage(rate){
localStorage.setItem("mortgage_rate",rate);
window.location.href="/tool/";
}

</script>

</body>
</html>
