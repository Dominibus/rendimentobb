<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comparatore Mutui – RendimentoBB</title>

<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon.png">  

</head>

<body>

<main>

<div class="container" style="padding-top:80px;padding-bottom:120px;">


<h1 style="text-align:center;margin-bottom:40px;">
Comparatore Mutui
</h1>


<!-- MORTGAGE COMPARATOR -->

<div id="mortgage" class="tool-card">

<h3>🏦 Comparatore Mutui</h3>

<div class="form-grid">

<div class="input-group">
<label>Importo Mutuo (€)</label>
<input type="number" id="mortgageAmount" value="120000">
</div>

<div class="input-group">
<label>Durata (anni)</label>
<input type="number" id="mortgageYears" value="20">
</div>

<div class="input-group">
<label>Tasso Banca A (%)</label>
<input type="number" id="rateA" value="3.2" step="0.1">
</div>

<div class="input-group">
<label>Tasso Banca B (%)</label>
<input type="number" id="rateB" value="3.6">
</div>

<div class="input-group">
<label>Tasso Banca C (%)</label>
<input type="number" id="rateC" value="4.1">
</div>

</div>


<div style="text-align:center;margin-top:40px;">
<button onclick="compareMortgages()" class="btn btn-primary">
Confronta Mutui
</button>
</div>

<div id="mortgage-results" style="margin-top:40px;"></div>

</div>

</div>

</main>

<script src="/js/lang.js" defer></script>
<script src="/js/header.js" defer></script>
<script src="/js/footer.js" defer></script>

<script type="module" src="/js/mortgage-rates.js"></script>

<script type="module" src="/js/firebase-init.js"></script>
<script type="module" src="/js/app.js"></script> 

</body>
</html>
