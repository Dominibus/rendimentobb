<style>

/* =====================================
🔥 MUTUI – SAAS FINTECH ULTRA (FINAL)
===================================== */

/* ===== BASE ===== */
body{
  padding-top:60px;
  background:linear-gradient(to bottom,#f8fafc,#e2e8f0);
  font-family:Inter,system-ui;
}

/* =====================================
🔥 HERO – FINTECH STRIPE STYLE
===================================== */

.hero-mutui{
  position:relative;
  padding:140px 20px 120px;
  text-align:center;

  background:
   linear-gradient(
   rgba(2,6,23,.65),
   rgba(2,6,23,.75)
  ),
  url("/img/milan-bg.jpg") center/cover;

  overflow:hidden;
}

/* glow */
.hero-mutui::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 30%, rgba(16,185,129,0.18), transparent 60%);
  z-index:1;
}

/* testo */
.hero-mutui h1,
.hero-mutui p{
  position:relative;
  z-index:2;
  color:#ffffff !important;
}

.hero-mutui h1{
  font-size:48px;
  font-weight:800;
  margin-bottom:15px;
  max-width:900px;
  margin-left:auto;
  margin-right:auto;

  text-shadow:
    0 10px 30px rgba(0,0,0,.9);
}

.hero-mutui p{
  font-size:18px;
  opacity:.95;
  color:#cbd5f5 !important;
}

/* =====================================
🔥 TOOL BOX – BANK UI
===================================== */

.tool-box{
  max-width:900px;
  margin:-100px auto 0;

  background:#ffffff;
  padding:35px;

  border-radius:20px;

  box-shadow:
    0 60px 140px rgba(2,6,23,.18),
    0 20px 50px rgba(2,6,23,.08);

  border:1px solid #e2e8f0;

  position:relative;
  z-index:10;
}

/* titolo */
.tool-box h3{
  color:#0f172a !important;
  font-weight:700;
  font-size:18px;
  margin-bottom:14px;
}

/* INPUT */
.tool-box input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #e2e8f0;
  background:white;
  margin-bottom:12px;
  transition:.2s;
  color:#0f172a;
}

.tool-box input:focus{
  border-color:#10b981;
  outline:none;
  box-shadow:0 0 0 3px rgba(16,185,129,.15);
}

/* =====================================
🔥 CTA – STRIPE CONVERSION
===================================== */

.btn-main{
  width:100%;
  padding:14px;
  border:none;
  border-radius:999px;

  background:linear-gradient(135deg,#10b981,#059669);
  color:white;

  font-weight:700;
  font-size:15px;

  box-shadow:0 12px 30px rgba(16,185,129,.35);
  cursor:pointer;

  transition:.25s;
}

.btn-main:hover{
  transform:translateY(-2px);
  box-shadow:0 20px 45px rgba(16,185,129,.45);
}

/* =====================================
🔥 KPI – DASHBOARD BANK
===================================== */

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-top:22px;
}

.kpi{
  background:#f8fafc;
  padding:20px;
  border-radius:14px;
  text-align:center;

  border:1px solid #e2e8f0;

  box-shadow:
    0 10px 25px rgba(0,0,0,.05);
}

.kpi div{
  font-size:22px;
  font-weight:700;
  color:#0f172a;
}

.kpi small{
  color:#64748b;
}

/* =====================================
🔥 ALERT
===================================== */

.roi-alert{
  margin-top:15px;
  padding:14px;
  border-radius:10px;
  display:none;
  font-weight:600;
  text-align:center;
}

.roi-bad{
  background:#fee2e2;
  color:#b91c1c;
}

.roi-good{
  background:#dcfce7;
  color:#166534;
}

/* =====================================
🔥 EXTRA BOX
===================================== */

.extra-box{
  margin-top:20px;
  padding:20px;
  border-radius:14px;
  background:#f1f5f9;
  border:1px solid #e2e8f0;
  color:#0f172a;
}

#decision-box{
  background:white;
  border:1px solid #e2e8f0;
}

/* =====================================
🔥 BANK CARDS – LEAD READY
===================================== */

.bank-card{
  background:white;
  padding:22px;
  border-radius:16px;
  margin-top:15px;

  border:1px solid #e2e8f0;

  box-shadow:
    0 12px 30px rgba(0,0,0,.06);

  transition:.25s;
}

.bank-card:hover{
  transform:translateY(-4px);
  box-shadow:0 30px 60px rgba(0,0,0,.12);
}

/* BEST OFFER */
.bank-card.best{
  border:2px solid #10b981;
  background:linear-gradient(to bottom,#f0fdf4,#ffffff);
}

/* LOCK */
.bank-card.locked{
  opacity:0.6;
  filter:blur(2px);
  pointer-events:none;
  position:relative;
}

.bank-card.locked::after{
  content:"🔒 PRO";
  position:absolute;
  top:10px;
  right:10px;
  background:#ef4444;
  color:white;
  font-size:12px;
  padding:4px 8px;
  border-radius:8px;
}

/* TESTI */
#banks,
#banks *{
  color:#0f172a !important;
}

.bank-card p{
  color:#334155 !important;
}

.bank-card small,
.bank-card span{
  color:#64748b !important;
}

.bank-card strong{
  color:#10b981 !important;
}

/* =====================================
🔥 LEAD BOX – CONVERSION
===================================== */

.lead-box{
  margin-top:70px;
  padding:45px;

  background:linear-gradient(180deg,#ffffff,#f8fafc);

  border-radius:20px;

  border:1px solid #e2e8f0;
}

.lead-box h2{
  color:#0f172a;
  font-weight:700;
  margin-bottom:15px;
}

.lead-box input{

}

/* SUCCESS */
.success-msg{
  color:#10b981;
  display:none;
  margin-top:15px;
  font-weight:600;
}

/* =====================================
🔥 MOBILE
===================================== */

@media(max-width:768px){

  .hero-mutui{

  }

  .tool-box{
    margin-top:-60px;
    padding:20px;
  }

  .kpi-grid{
    grid-template-columns:1fr;
  }
}

</style>

🔥 Il mutuo può farti perdere migliaia di euro

<p

Simula l’impatto reale su ROI, profitto e rischio in meno di 30 secondi

<script>

function getAccess(){

  const plan = String(window.currentPlan || "").toLowerCase();

  return {
    isPro: plan === "pro" || plan === "pro_yearly",
    isInvestor: plan === "investor",
    isLogged: !!window.currentUser
  };

} 

/* ================= LANG ================= */
function t(it,en){
return (window.currentLang === "en") ? en : it;
}

/* ================= CALCOLO ================= */
function calculate(){

console.log("🔥 CALCULATE TRIGGERED");
  
const amount = parseFloat(document.getElementById("amount").value || 200000);
const rate   = parseFloat(document.getElementById("rate").value || 3.5);
const years  = parseFloat(document.getElementById("years").value || 20);
const income = parseFloat(document.getElementById("income").value || 30000);

const monthlyRate = rate/100/12;
const n = years*12;

const monthly = amount * (monthlyRate / (1 - Math.pow(1+monthlyRate,-n)));
const yearly = monthly*12;

const roi = ((income - yearly)/income*100);

/* ===== ALERT ===== */
const alertBox = document.getElementById("roi-alert");
alertBox.style.display="block";

if(roi < 0){
  alertBox.className="roi-alert roi-bad";
  alertBox.innerHTML = t(
  "⚠️ Questo mutuo sta distruggendo il tuo profitto",
  "⚠️ This mortgage is destroying your profit"
);
}else{
  alertBox.className="roi-alert roi-good";
  alertBox.innerHTML = t(
    "✅ Mutuo sostenibile",
    "✅ Sustainable mortgage"
  );
}

/* ===== KPI ===== */
document.getElementById("monthly").innerText = lockValue("€"+monthly.toFixed(0));
document.getElementById("yearly").innerText  = lockValue("€"+yearly.toFixed(0));
document.getElementById("impact").innerText  = lockValue(roi.toFixed(1), "%");

document.querySelector(".lead-box").scrollIntoView({
  behavior:"smooth"
});  

/* ===== EXTRA ===== */
renderExtra(roi, yearly);

// 🔥 FORCE EXTRA VISIBILITY (FIX)
const extraBox = document.getElementById("extra");

if(extraBox){
  extraBox.style.display = "block";
}

/* ===== BANK ===== */
renderBanks(amount);

renderDecision(roi);
  
}

function lockValue(value, suffix=""){

  const access = getAccess();

  return !access.isPro
    ? "🔒 Pro"
    : value + suffix;
}

/* ================= EXTRA ================= */
function renderExtra(roi, yearly){

const extra = document.getElementById("extra");

if(!extra){
  console.error("❌ #extra NON trovato");
  return;
}

extra.innerHTML = ""; // reset sicurezza

const loss = yearly * 0.3;
const access = getAccess();

/* ===== BLOCCO PRINCIPALE LEAD ===== */
extra.innerHTML = `

<div style="
  background:linear-gradient(135deg,#111827,#1e293b);
  color:white;
  padding:18px;
  border-radius:14px;
  text-align:center;
  font-weight:700;
  font-size:16px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
">

  ⚠️ ${
    access.isPro
    ? t("Stai perdendo","You are losing")
    : t("Potresti perdere","You could lose")
  }

  <div style="
    font-size:28px;
    margin:10px 0;
    color:#f87171;
    font-weight:800;
  ">
    ${
      access.isPro
      ? "€"+loss.toFixed(0)+"/anno"
      : "🔒 Pro"
    }
  </div>

  <div style="
    font-size:14px;
    color:#cbd5f5;
    margin-bottom:15px;
    font-weight:500;
  ">
    ${
      t(
        "a causa di un mutuo non ottimizzato",
        "due to a non-optimized mortgage"
      )
    }
  </div>

  ${
    access.isInvestor || access.isPro
    ? `
    <button class="btn-main"
      style="max-width:280px"
      onclick="document.getElementById('banks').scrollIntoView({behavior:'smooth'})">
      🏦 ${t("Contatta banca ORA","Contact bank NOW")}
    </button>
    `
    : `
    <button class="btn-main"
      style="max-width:280px"
      onclick="startPlanPurchase('investor')">
      🔓 ${t("Sblocca offerte banche","Unlock bank offers")}
    </button>
    `
  }

</div>

`;
}

function renderDecision(roi){

const box = document.getElementById("decision-box");
box.style.display = "block";

let verdict, color;

if(roi < 5){
  verdict = t(
    "❌ NON fare questo mutuo",
    "❌ DO NOT take this mortgage"
  );
  color = "#ef4444";
}
else if(roi < 12){
  verdict = t(
    "⚠️ Operazione rischiosa",
    "⚠️ Risky investment"
  );
  color = "#f59e0b";
}
else{
  verdict = t(
    "✅ Mutuo sostenibile",
    "✅ Sustainable investment"
  );
  color = "#10b981";
}

box.innerHTML = `
<div style="text-align:center;font-weight:700;font-size:18px;color:${color}">
${verdict}
</div>

<div style="margin-top:10px;text-align:center;color:#64748b">
${t(
  "Questa è una valutazione reale basata sui dati inseriti",
  "This is a real evaluation based on your data"
)}
</div>
`;
}  


/* ================= BANCHE ================= */
function renderBanks(amount){

const banks = [
{name:"Intesa Sanpaolo", rate:3.1},
{name:"UniCredit", rate:3.3},
{name:"Credit Agricole", rate:3.4},
{name:"BNL BNP Paribas", rate:3.5},
{name:"Banco BPM", rate:3.7}
];

banks.sort((a,b)=>a.rate-b.rate);

/* HEADER */
let html = "<h3 style='margin-top:40px'>🏦 " +
t("Migliori mutui disponibili","Best mortgage options") +
"</h3>";

/* PAYWALL HEADER */
if(!getAccess().isPro){
  html += `
  <div style="
    background:#111827;
    color:white;
    padding:20px;
    border-radius:14px;
    margin-top:20px;
    text-align:center;
  ">
    🔒 ${t(
      "Le migliori offerte reali sono disponibili nel piano Investor",
      "Real mortgage offers are available in Investor plan"
    )}

    <div style="margin-top:15px;">
      <button class="btn-main"
        style="max-width:280px"
        onclick="startPlanPurchase('investor')">
        🔓 ${t("Sblocca tutte le offerte","Unlock all offers")}
      </button>

      <div style="margin-top:8px;font-size:13px;color:#9ca3af">
        ${t(
          "Accesso immediato alle migliori banche",
          "Instant access to best banks"
        )}
      </div>
    </div>
  </div>
  `;
}

/* LISTA */
banks.forEach((b,i)=>{

const monthlyRate = b.rate/100/12;
const n = 20*12;
const monthly = amount * (monthlyRate / (1 - Math.pow(1+monthlyRate,-n)));
const yearly = monthly * 12;

const access = getAccess();
const locked = !access.isInvestor && !access.isPro;

html += `
<div class="bank-card ${i===0?"best":""}">

<h3>${b.name}</h3>

<div style="font-size:26px;font-weight:800;color:#10b981">
  ${b.rate}%
</div>

<div style="font-size:13px;color:#64748b;margin-bottom:10px">
  ${t("Tasso fisso medio","Average fixed rate")}
</div>

<div style="font-size:14px;margin-bottom:10px;color:#0f172a">
  ${
    locked
    ? `🔒 ${t("Sblocca per vedere il costo reale","Unlock to see real cost")}`
    : `💸 ${t("Costo annuo","Yearly cost")}: <strong>€${yearly.toFixed(0)}</strong>`
  }
</div>

${i===0 ? `
<div style="
  background:#dcfce7;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
  font-weight:600;
  color:#166534;
">
  ${
    locked
    ? `🔒 ${t("Sblocca per vedere quanto puoi risparmiare","Unlock to see your savings")}`
    : `💰 ${t("Puoi risparmiare fino a","You can save up to")} <strong>€${(yearly*0.15).toFixed(0)}/anno</strong>`
  }

  <div style="margin:15px 0;border-top:1px solid #e2e8f0;"></div>
  <span style="font-size:12px;color:#166534">
    ⏳ ${t("Offerta limitata","Limited offer")}
  </span>
</div>
` : ""}

${
locked
? `
<button class="btn-main"
onclick="startPlanPurchase('investor')">
${t("Sblocca ora","Unlock now")}
</button>
`
: `
<button class="btn-main"
onclick="selectMortgage(${b.rate}, '${b.name}')">
${t("Seleziona mutuo","Select mortgage")}
</button>
`
}

</div>
`;

});

/* RENDER */
document.getElementById("banks").innerHTML = html;

}

/* ================= NAV ================= */
function goToPricing(){
  window.location.href = "/#pricing";
}

function startPlanPurchase(plan){

  if(!window.currentUser){
    showUpgradeModal();

    // 🔥 salva intento (marketing)
    localStorage.setItem("pending_plan", plan);

    return;
  }

  window.location.href = "/api/create-checkout-session?plan=" + plan;
}

  function showUpgradeModal(){
  document.getElementById("upgrade-modal").style.display = "flex";
}

function closeUpgradeModal(){
  document.getElementById("upgrade-modal").style.display = "none";
}
  
/* ================= SELECT ================= */
function selectMortgage(rate, bank){

localStorage.setItem("mortgage_rate",rate);

/* 🔥 FUTURO: redirect partner */
console.log("🏦 Selected bank:", bank);

window.location.href="/tool/";

}


/* ================= LEAD ================= */
async function saveLead(){

const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;

if(!email){
alert(t("Inserisci email","Enter email"));
return;
}

const impactEl = document.getElementById("impact");
const roiValue = impactEl && !isNaN(parseFloat(impactEl.innerText))
  ? parseFloat(impactEl.innerText)
  : 0;

const payload = {
  type:"mutui",
  email,
  phone,
  city: window.currentCity || "unknown",
  roi: roiValue,
  amount: parseFloat(document.getElementById("amount").value || 0),
  years: parseFloat(document.getElementById("years").value || 0),
  plan: window.currentPlan || "free"
};

try{

/* 🔥 SAVE DB */
const res = await fetch("/api/send-lead",{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body: JSON.stringify(payload)
});

/* 🔥 EMAIL UTENTE (MANCAVA!) */
await fetch("/api/send-lead-email",{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body: JSON.stringify({
    email,
    type:"mutui",
    roi: roiValue,
    amount: payload.amount,
    years: payload.years,
    lang: window.currentLang || "it"
  })
});

/* 🔥 FOLLOWUP */
setTimeout(()=>{
  fetch("/api/send-followup",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      email,
      step:2,
      lang: window.currentLang || "it"
    })
  });
},60000);

const data = await res.json();

console.log("🔥 Lead sent:", data);

/* UI WOW */
const success = document.getElementById("success");
success.style.display="block";

success.innerHTML = `
✔ ${t("Richiesta inviata","Request sent")}
<div style="margin:15px 0;border-top:1px solid #e2e8f0;"></div>
🔥 ${t("Ti abbiamo inviato le migliori offerte","We sent you the best offers")}
<div style="margin:15px 0;border-top:1px solid #e2e8f0;"></div>
💰 €${data.value || 0}
`;

}catch(e){
console.error("❌ Lead error:", e);
alert("Errore invio");
}

}

document.addEventListener("DOMContentLoaded", () => {

  console.log("✅ DOM READY");

  const btn = document.getElementById("calc-btn");

  if(btn){
    console.log("✅ Bottone trovato");
    btn.addEventListener("click", calculate);
  }else{
    console.error("❌ Bottone NON trovato");
  }

});  

</script>

<div id="upgrade-modal" style="
position:fixed;
inset:0;
background:rgba(2,6,23,.55);
backdrop-filter: blur(6px);
display:none;

justify-content:center;
z-index:9999;
">

  <div style="
  background:linear-gradient(180deg,#ffffff,#f8fafc);
  padding:30px;
  border-radius:20px;
  max-width:420px;
  width:90%;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
  ">

    <h3 style="
       margin-bottom:10px;
       color:#0f172a;
       font-weight:700;
      data-it="🔒 Sblocca i dati reali"
      data-en="🔒 Unlock real data">
      🔒 Sblocca i dati reali
    </h3>

    <p style="color:#334155;font-weight:500;margin-bottom:20px;"
      data-it="Stai prendendo decisioni senza dati completi"
      data-en="You are making decisions without full data">
      Stai prendendo decisioni senza dati completi
    </p>

    <button class="btn-main"
      onclick="startPlanPurchase('investor')"
      data-it="🔓 Sblocca ora"
      data-en="🔓 Unlock now">
      🔓 Sblocca ora
    </button>

    <div style="margin-top:10px;">
      <button onclick="closeUpgradeModal()" style="
        background:none;
        border:none;
        color:#64748b;
