Comparatore Mutui
</h1>


<!-- MORTGAGE COMPARATOR -->

<div id="mortgage" class="tool-card">

<h3>🏦 Comparatore Mutui</h3>

<div class="form-grid">

<div class="input-group">
<label>Importo Mutuo (€)</label>
<input type="number" id="mortgageAmount" value="120000">
</div>

<div class="input-group">
<label>Durata (anni)</label>
<input type="number" id="mortgageYears" value="20">
</div>

<div class="input-group">
<label>Tasso Banca A (%)</label>
<input type="number" id="rateA" value="3.2" step="0.1">
</div>

<div class="input-group">
<label>Tasso Banca B (%)</label>
<input type="number" id="rateB" value="3.6">
</div>

<div class="input-group">
<label>Tasso Banca C (%)</label>
<input type="number" id="rateC" value="4.1">
</div>

</div>


<div style="text-align:center;margin-top:40px;">
<button onclick="compareMortgages()" class="btn btn-primary">
Confronta Mutui
</button>
</div>

<div id="mortgage-results" style="margin-top:40px;"></div>

</div>
