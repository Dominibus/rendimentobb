<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title data-it="Mutuo B&B – Simulatore ROI + confronto banche"
data-en="B&B Mortgage – ROI simulator + bank comparison">
Mutuo B&B
</title>

<meta name="description"
data-it="Simula mutuo, ROI e confronta banche. Scopri se stai perdendo soldi."
data-en="Simulate mortgage, ROI and compare banks. Avoid losing money.">

<link rel="stylesheet" href="/css/style.css">

<style>

/* ===== UI CLEAN SAAS ===== */
body{
padding-top:60px;
background:linear-gradient(to bottom,#f8fafc,#e2e8f0);
font-family:Inter,system-ui;
}

.hero-mutui{
padding:120px 20px;
text-align:center;
color:white;
background:
linear-gradient(rgba(15,23,42,.7),rgba(15,23,42,.9)),
url("/img/milan-bg.jpg") center/cover;
}

.tool-box{
max-width:900px;
margin:-80px auto 0;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 30px 80px rgba(0,0,0,.1);
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #e2e8f0;
margin-bottom:10px;
}

.btn-main{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#10b981,#059669);
color:white;
font-weight:600;
cursor:pointer;
}

.kpi-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-top:20px;
}

.kpi{
background:#f8fafc;
padding:20px;
border-radius:14px;
text-align:center;
}

.roi-alert{
margin-top:15px;
padding:12px;
border-radius:10px;
display:none;
font-weight:600;
}

.roi-bad{background:#fee2e2;color:#b91c1c;}
.roi-good{background:#dcfce7;color:#166534;}

.bank-card{
background:white;
padding:20px;
border-radius:16px;
margin-top:15px;
border:1px solid #e2e8f0;
}

.bank-card.best{
border:2px solid #10b981;
}

.extra-box{
margin-top:20px;
padding:20px;
border-radius:14px;
background:#f1f5f9;
}

.lead-box{
margin-top:50px;
padding:40px;
background:white;
border-radius:20px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.success-msg{
color:#10b981;
display:none;
}

</style>
</head>

<body>

<div id="global-header"></div>

<section class="hero-mutui">
<h1 data-it="Il mutuo può distruggere il tuo ROI"
data-en="A mortgage can destroy your ROI"></h1>

<p data-it="Simula prima di perdere migliaia di euro"
data-en="Simulate before losing thousands"></p>
</section>

<div class="container">

<div class="tool-box">

<h3 data-it="Simulatore mutuo" data-en="Mortgage simulator"></h3>

<input id="amount" placeholder="€ 200000">
<input id="years" placeholder="20">
<input id="rate" placeholder="3.5%">
<input id="income" placeholder="Ricavi annui">

<button class="btn-main"
data-it="Calcola impatto"
data-en="Calculate impact"
onclick="calculate()"></button>

<div id="roi-alert" class="roi-alert"></div>

<div class="kpi-grid">
<div class="kpi"><div id="monthly">-</div><small>Monthly</small></div>
<div class="kpi"><div id="yearly">-</div><small>Yearly</small></div>
<div class="kpi"><div id="impact">-</div><small>ROI</small></div>
</div>

<!-- 🔥 EXTRA -->
<div id="extra" class="extra-box"></div>

</div>

<div id="banks"></div>

<!-- LEAD -->
<div class="lead-box">

<h2 data-it="Ricevi offerte reali"
data-en="Get real offers"></h2>

<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefono">

<button class="btn-main"
data-it="Ricevi offerte"
data-en="Get offers"
onclick="saveLead()"></button>

<div id="success" class="success-msg">✔ Lead inviato</div>

</div>

</div>

<div id="global-footer"></div>

<script src="/js/lang.js" defer></script>
<script type="module" src="/js/header.js"></script>
<script src="/js/footer.js" defer></script>

<script>

/* ================= LANG HELPER ================= */
function t(it,en){
return (window.currentLang === "en") ? en : it;
}

/* ================= CALCOLO ================= */
function calculate(){

const amountEl = document.getElementById("amount");
const rateEl   = document.getElementById("rate");
const yearsEl  = document.getElementById("years");
const incomeEl = document.getElementById("income");

const amount = parseFloat(amountEl.value || 200000);
const rate   = parseFloat(rateEl.value || 3.5);
const years  = parseFloat(yearsEl.value || 20);
const income = parseFloat(incomeEl.value || 30000);

const monthlyRate = rate/100/12;
const n = years*12;

const monthly = amount * (monthlyRate / (1 - Math.pow(1+monthlyRate,-n)));
const yearly  = monthly*12;

const roi = ((income - yearly)/income*100);

/* ===== ALERT ===== */
const alertBox = document.getElementById("roi-alert");
alertBox.style.display="block";

if(roi < 0){
  alertBox.className="roi-alert roi-bad";
  alertBox.innerHTML = t(
    "⚠️ Il mutuo sta distruggendo il tuo ROI",
    "⚠️ Mortgage is destroying your ROI"
  );
}else{
  alertBox.className="roi-alert roi-good";
  alertBox.innerHTML = t(
    "✅ Mutuo sostenibile",
    "✅ Sustainable mortgage"
  );
}

/* ===== KPI ===== */
document.getElementById("monthly").innerText = "€"+monthly.toFixed(0);
document.getElementById("yearly").innerText  = "€"+yearly.toFixed(0);
document.getElementById("impact").innerText  = roi.toFixed(1)+"%";

/* ===== EXTRA (🔥 VALORE) ===== */
renderExtra(roi, yearly);

/* ===== BANK ===== */
renderBanks(amount);

}


/* ================= EXTRA (CASH + RISCHIO) ================= */
function renderExtra(roi, yearly){

const risk =
roi < 5 ? t("ALTO","HIGH") :
roi < 15 ? t("MEDIO","MEDIUM") :
t("BASSO","LOW");

const el = document.getElementById("banks");

el.insertAdjacentHTML("beforebegin",`
<div class="bank-card" style="margin-top:20px;">
<b>${t("Confronto CASH","Cash comparison")}</b><br>
${t("Senza mutuo guadagno stimato:","Estimated without mortgage:")}
€${(yearly*1.4).toFixed(0)}

<br><br>

<b>${t("Rischio investimento","Investment risk")}:</b> ${risk}
</div>
`);

}


/* ================= BANCHE ================= */
function renderBanks(amount){

const banks = [
{name:"Intesa Sanpaolo", rate:3.1},
{name:"UniCredit", rate:3.3},
{name:"BNL BNP Paribas", rate:3.5},
{name:"Credit Agricole", rate:3.4},
{name:"Banco BPM", rate:3.7}
];

banks.sort((a,b)=>a.rate-b.rate);

let html="";

banks.forEach((b,i)=>{

html+=`
<div class="bank-card ${i===0?"best":""}">
<h3>${b.name}</h3>
<p>${b.rate}%</p>

<button class="btn-main"
onclick="selectMortgage(${b.rate})">
${t("Usa questo mutuo","Use this mortgage")}
</button>
</div>
`;

});

document.getElementById("banks").innerHTML = html;

}


/* ================= SELECT ================= */
function selectMortgage(rate){
localStorage.setItem("mortgage_rate",rate);
window.location.href="/tool/";
}


/* ================= LEAD + SCORING ================= */
function saveLead(){

const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;

if(!email) return;

/* 🔥 LEAD SCORING */
const score =
(email ? 40 : 0) +
(phone ? 40 : 0) +
(Math.random()*20);

console.log("🔥 Lead mutuo:", email);
console.log("🔥 Score:", score);

document.getElementById("success").style.display="block";

}

</script>

</body>
</html>
